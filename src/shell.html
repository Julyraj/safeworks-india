<title>SafeWorks India</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/*__TOKENS__*/
/* brand chrome stays navy in both themes */
:root{--brand:#0f1c2b;--brand-2:#1c2f45;--brand-fg:#e8edf2;--brand-muted:#93a1af;--sos:#c62828}
/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--safe-top);z-index:60;background:var(--brand)}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img,svg{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
h2{font-family:var(--font-cond);font-size:30px;line-height:1.1;letter-spacing:.005em}
h3{font-size:17px;line-height:1.3}
h4{font-size:14px;color:var(--muted);font-weight:600}
p{margin:0}
.lead{color:var(--muted);max-width:68ch;margin-top:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;background:var(--hivis);color:var(--hivis-ink);padding:10px 14px;border-radius:var(--r-md);z-index:100;font-weight:600;text-decoration:none}
.skip:focus{top:calc(8px + var(--safe-top))}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.93em}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grow{flex:1 1 auto;min-width:0}
.right{margin-left:auto}
.center{text-align:center}
.mt{margin-top:12px}.mt-s{margin-top:6px}.mt-l{margin-top:20px}
.hide-phone{}
@media (max-width:759px){.hide-phone{display:none!important}}
@media (min-width:760px){.only-phone{display:none!important}}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.rail{display:none}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:var(--safe-top);z-index:40;background:var(--brand);color:var(--brand-fg);display:flex;align-items:center;gap:8px;min-height:56px;padding:6px max(var(--gutter),env(safe-area-inset-right,0px)) 6px max(var(--gutter),env(safe-area-inset-left,0px))}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(135deg,#f5c400 0 14px,var(--brand) 14px 28px)}
.top .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.mark{width:34px;height:34px;flex:none;border-radius:8px;background:var(--hivis);color:var(--hivis-ink);display:grid;place-items:center;font-family:var(--font-cond);font-weight:700;font-size:16px;letter-spacing:.02em}
.top .brand b{font-family:var(--font-cond);font-weight:600;font-size:20px;letter-spacing:.01em;white-space:nowrap}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:var(--tap);min-height:var(--tap);padding:0 10px;border-radius:var(--r-md);border:0;background:transparent;color:inherit}
.iconbtn:hover{background:rgba(255,255,255,.08)}
.top .searchbtn{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:var(--r-md);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#c6d0da;text-align:left}
.top .searchbtn span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .searchbtn:hover{background:rgba(255,255,255,.14)}
kbd{font-family:var(--font-mono);font-size:11px;padding:2px 6px;border-radius:5px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-2);line-height:1.3}
.top kbd{border-color:rgba(255,255,255,.25);background:transparent;color:#c6d0da}
:root[data-theme="dark"] .hero,:root[data-theme="dark"] .ind .ic,:root[data-theme="dark"] .hub-h .ic{background:var(--brand-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero,:root:not([data-theme="light"]) .ind .ic,:root:not([data-theme="light"]) .hub-h .ic{background:var(--brand-2)}}
.portal-link{display:inline-flex;align-items:center;gap:6px;color:#e8edf2;text-decoration:none;font-size:13.5px;padding:8px 10px;border-radius:var(--r-md);border:1px solid rgba(255,255,255,.2);white-space:nowrap}
.portal-link:hover{background:rgba(255,255,255,.1)}
.content{padding:22px max(var(--gutter),env(safe-area-inset-right,0px)) calc(96px + var(--safe-bottom)) max(var(--gutter),env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;width:100%;max-width:1180px;min-width:0}
.content:focus{outline:none}

@media (min-width:1024px){
  .app{grid-template-columns:248px 1fr}
  .rail{display:flex;flex-direction:column;gap:14px;background:var(--brand);color:#c6d0da;padding:18px 12px 20px max(14px,env(safe-area-inset-left,0px));position:sticky;top:var(--safe-top);height:calc(100vh - var(--safe-top));overflow:auto;scrollbar-width:thin}
  .rail .brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;padding:2px 6px}
  .rail .brand b{font-family:var(--font-cond);font-size:21px;font-weight:600;display:block;line-height:1.1}
  .rail .brand small{display:block;font-size:12px;color:#93a1af}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav .grp{font-size:12px;color:#7f8f9d;padding:14px 10px 4px}
  .nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;min-height:38px;border-radius:var(--r-md);color:#c6d0da;text-decoration:none;font-size:14px}
  .nav a .icon{width:18px;height:18px;opacity:.9}
  .nav a:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav a.on{background:var(--brand-2);color:#fff;box-shadow:inset 3px 0 0 var(--hivis)}
  .nav a .n{margin-left:auto;font-size:12px;color:#7f8f9d;font-variant-numeric:tabular-nums}
  .railfoot{margin-top:auto;font-size:12px;color:#7f8f9d;line-height:1.45;padding:0 6px}
  .top{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
  .top::after{display:none}
  .top .brand,.top .menubtn{display:none}
  .top .searchbtn{max-width:560px;border-color:var(--line);background:var(--surface-2);color:var(--muted)}
  .top .searchbtn:hover{border-color:var(--line-strong);background:var(--surface-3)}
  .top kbd{border-color:var(--line-strong);background:var(--surface);color:var(--muted)}
  .top .iconbtn:hover{background:var(--surface-2)}
  .portal-link{color:var(--ink);border-color:var(--line)}
  .portal-link:hover{background:var(--surface-2)}
  .content{padding-top:26px;padding-bottom:56px}
  .tabbar,.sosfab-phone{display:none}
}

/* ---------- tab bar (phone + tablet) ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(5,1fr);background:var(--brand);border-top:1px solid rgba(255,255,255,.08);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + var(--safe-bottom)) max(6px,env(safe-area-inset-left,0px))}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;color:#c6d0da;text-decoration:none;font-size:11.5px;background:none;border:0;border-radius:var(--r-md);padding:4px 2px}
.tabbar .icon{width:22px;height:22px}
.tabbar .on{color:#fff;background:var(--brand-2)}
.tabbar .sos{color:#fff}
@media (min-width:1024px){.tabbar{display:none}}
.tabbar .sos .sosdot{width:40px;height:30px;border-radius:var(--r-pill);background:var(--sos);display:grid;place-items:center;font-family:var(--font-cond);font-weight:700;font-size:15px;letter-spacing:.04em}
@media (min-width:1024px){.sosfab{position:fixed;right:22px;bottom:22px;z-index:35;display:inline-flex;align-items:center;gap:8px;background:var(--sos);color:#fff;text-decoration:none;font-family:var(--font-cond);font-weight:700;font-size:17px;letter-spacing:.05em;padding:12px 18px;border-radius:var(--r-pill);box-shadow:var(--shadow-2)}}
@media (max-width:1023px){.sosfab{display:none}}

/* ---------- sheets, palette, toasts ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(15,28,43,.45);opacity:0;transition:opacity var(--t-med) var(--ease)}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--surface);color:var(--ink);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-sheet);max-height:min(88vh,860px);display:flex;flex-direction:column;transform:translateY(100%);transition:transform var(--t-med) var(--ease);padding-bottom:var(--safe-bottom)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:10px auto 0}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:10px var(--gutter) 8px}
.sheet .sh h3{font-family:var(--font-cond);font-size:22px}
.sheet .sb{overflow:auto;padding:4px var(--gutter) 18px;overscroll-behavior:contain}
@media (min-width:760px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(680px,calc(100vw - 32px));transform:translate(-50%,-46%);opacity:0;border-radius:var(--r-lg);transition:transform var(--t-med) var(--ease),opacity var(--t-med) var(--ease)}.sheet.show{transform:translate(-50%,-50%);opacity:1}.sheet .grab{display:none}}
.menu-list{display:grid;gap:4px}
.menu-list .grp{font-size:13px;color:var(--muted);padding:12px 6px 4px}
.menu-list a{display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:6px 10px;border-radius:var(--r-md);color:inherit;text-decoration:none}
.menu-list a:hover{background:var(--surface-2)}
.menu-list a.on{background:var(--blue-tint);color:var(--blue)}
.menu-list a .n{margin-left:auto;color:var(--muted);font-size:13px}
.palette{position:fixed;z-index:72;left:50%;top:calc(8vh + var(--safe-top));transform:translateX(-50%);width:min(720px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-2);display:flex;flex-direction:column;max-height:min(78vh,720px);overflow:hidden}
.palette .pin{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.palette input{flex:1;border:0;background:transparent;font-size:17px;min-width:0;padding:8px 0;outline:none;-webkit-appearance:none;appearance:none}
.palette input::-webkit-search-cancel-button,.hero .search input::-webkit-search-cancel-button,.input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.palette .pres{overflow:auto;overscroll-behavior:contain;padding:6px;display:flex;flex-direction:column}
.palette .pgrp{font-size:12.5px;color:var(--muted);padding:10px 10px 4px}
.palette .pr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--r-md);text-decoration:none;color:inherit;cursor:pointer;min-height:44px}
.palette .pr .icon{width:18px;height:18px;color:var(--muted)}
.palette .pr .pt{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palette .pr .ps{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palette .pr .pk{font-size:12px;color:var(--muted);white-space:nowrap}
.palette .pr.sel,.palette .pr:hover{background:var(--blue-tint)}
.palette .pr.sel .pt{color:var(--blue)}
.palette .pfoot{display:flex;gap:14px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.palette .pstatus{padding:14px;color:var(--muted);font-size:14px}
@media (max-width:759px){.palette{top:calc(6px + var(--safe-top));width:calc(100vw - 12px);max-height:calc(100vh - 24px - var(--safe-top))}.palette .pfoot{display:none}.palette .pr{grid-template-columns:24px 1fr}.palette .pr .pk{display:none}}
.toasts{position:fixed;left:50%;bottom:calc(76px + var(--safe-bottom));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100vw - 24px))}
@media (min-width:1024px){.toasts{bottom:24px}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--r-md);box-shadow:var(--shadow-2);font-size:14px;max-width:100%}
:root[data-theme="dark"] .toast{background:#e8edf2;color:#0f1c2b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:#e8edf2;color:#0f1c2b}}
.toast .ub{border:0;background:var(--hivis);color:var(--hivis-ink);font-weight:600;padding:6px 12px;border-radius:var(--r-sm);min-height:32px}
.toast .ux{border:0;background:transparent;color:inherit;opacity:.8;min-width:32px;min-height:32px;padding:0}
.toast.err{background:var(--sos);color:#fff}
.toast .tbar{position:absolute;left:0;bottom:0;height:3px;background:var(--hivis);width:100%;transform-origin:left;animation:shrink 8s linear forwards}
.toast{position:relative;overflow:hidden}
@keyframes shrink{to{transform:scaleX(0)}}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 16px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--hivis);border-color:var(--hivis);color:var(--hivis-ink);font-weight:600}
.btn.primary:hover{background:var(--hivis-press);border-color:var(--hivis-press)}
.btn.quiet{border-color:transparent;background:transparent}
.btn.quiet:hover{background:var(--surface-2)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn .icon{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 12px;line-height:1.3;text-align:left;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:13.5px;text-decoration:none;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--line-strong);background:var(--surface-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
:root[data-theme="dark"] .chip.on{background:#e8edf2;border-color:#e8edf2;color:#0f1c2b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{background:#e8edf2;border-color:#e8edf2;color:#0f1c2b}}
.chip.sm{min-height:26px;padding:0 9px;font-size:12px;cursor:default;background:var(--surface-2);border-color:transparent}
.chip.haz{background:var(--orange-tint);color:var(--orange);border-color:transparent;font-weight:500}
.chip.ppe{background:var(--blue-tint);color:var(--blue);border-color:transparent;font-weight:500}
.chip .icon{width:16px;height:16px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:var(--r-sm);border:1px solid var(--line);color:var(--muted);white-space:nowrap;line-height:1.5}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.st.inforce::before{background:var(--green)} .st.transition::before{background:var(--amber)} .st.draft::before{background:var(--blue)} .st.repealed::before{background:var(--red)} .st.guidance::before{background:var(--blue)}
.acc{font-size:12px;padding:2px 8px;border-radius:var(--r-sm);border:1px solid var(--line);white-space:nowrap;line-height:1.5}
.acc.a-free{color:var(--green);border-color:var(--green)} .acc.a-free-login{color:var(--blue);border-color:var(--blue)} .acc.a-paid{color:var(--amber);border-color:var(--amber)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea,.input{min-height:var(--tap);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--r-md);padding:8px 12px;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}
.field.wide{grid-column:1/-1}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.segs{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.segs button{border:0;background:transparent;min-height:40px;padding:0 12px;font-size:13.5px;color:var(--ink-2)}
.segs button.on{background:var(--ink);color:#fff}
:root[data-theme="dark"] .segs button.on{background:#e8edf2;color:#0f1c2b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .segs button.on{background:#e8edf2;color:#0f1c2b}}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs a,.tabs button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 14px;border:0;background:transparent;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs .on{color:var(--ink);border-bottom-color:var(--hivis)}
.tabs .n{font-size:12px;color:var(--muted);background:var(--surface-3);border-radius:var(--r-pill);padding:1px 7px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0;overflow-wrap:break-word}
.card.flat{background:var(--surface-2);border-color:transparent}
.card.alert-red{border-color:var(--red)}
.card.alert-blue{border-left:4px solid var(--blue)}
.note{padding:10px 14px;border-left:4px solid var(--amber);background:var(--amber-tint);border-radius:0 var(--r-md) var(--r-md) 0;font-size:14px}
.note.blue{border-left-color:var(--blue);background:var(--blue-tint)}
.note.red{border-left-color:var(--red);background:var(--red-tint)}
.note.green{border-left-color:var(--green);background:var(--green-tint)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr))}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;min-width:0;overflow-wrap:break-word}
.item.clk{cursor:pointer;text-decoration:none;color:inherit;display:block}
.item.clk:hover{border-color:var(--line-strong);background:var(--surface-2)}
.item .hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.item .t{font-weight:600;font-size:16px;line-height:1.3}
.meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sum{margin-top:8px;max-width:78ch}
ul.keys{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14px}
ul.keys li::marker{color:var(--blue)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--font-cond);font-weight:600;font-size:14px;color:#fff;background:var(--ink);border-radius:6px;width:28px;height:26px;display:grid;place-items:center;margin-top:1px}
:root[data-theme="dark"] .steps li::before{background:#e8edf2;color:#0f1c2b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .steps li::before{background:#e8edf2;color:#0f1c2b}}
details{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}

 t.innerHTML=`<span class="grow">${esc(msg)}</span>${opts.undo?`<button type="button" class="ub">Undo</button>`:""}<button type="button" class="ux" aria-label="Dismiss">${ICONS.x}</button>${opts.undo?'<span class="tbar" aria-hidden="true"></span>':""}`;
 let done=false;const ms=opts.ms||(opts.undo?8000:2200);
 const close=()=>{if(done)return;done=true;t.remove();if(opts.undo&&opts.commit)opts.commit()};
 const timer=setTimeout(close,ms);
 t.querySelector(".ux").addEventListener("click",()=>{clearTimeout(timer);close()});
 if(opts.undo)t.querySelector(".ub").addEventListener("click",()=>{if(done)return;done=true;clearTimeout(timer);t.remove();opts.undo()});

const INDEX=[];let indexState="idle",indexDone=0,indexTotal=0;const indexWaiters=[];
function addIdx(k,t,s,href,boost){INDEX.push({k,t,s:s||"",h:(t+" "+(s||"")).toLowerCase(),href,b:boost||0})}
const INDEX_SOURCES=[
 ()=>INDS.forEach(i=>addIdx("Industry",i.t,[i.tag,...Object.values(i.n||{})].join(" "),"#industry/"+i.id,20)),
 ()=>INDS.forEach(i=>indContent(i).tasks.forEach(t=>addIdx("Task pack",t.t,i.t,"#pack/"+i.id+"/"+t.id,12))),
 ()=>NAVGROUPS.forEach(([g,items])=>items.forEach(([id,l])=>addIdx("View",l,g,"#"+id,15))),
 ()=>REGS.forEach(r=>addIdx("Regulation",r.t,r.sum+" "+r.key.join(" ")+" "+r.a+" "+r.d.join(" "),"#regulations/"+r.id,4)),
 ()=>PROCS.forEach(p=>addIdx("Procedure",p.t,p.purpose+" "+p.tags.join(" ")+" "+p.hazards.join(" ")+" "+p.steps.join(" "),"#procedures/"+p.id,6)),
 ()=>CHECKLISTS.forEach(c=>addIdx("Checklist",c.t,c.cat+" "+c.items.join(" "),"#checklists/"+c.id,6)),
 ()=>TALKS.forEach((t,i)=>addIdx("Toolbox talk",t.t,t.pts.join(" "),"#talks/"+i,5)),
 ()=>FORMS.forEach((f,i)=>addIdx("Form",f.t,f.law+" · "+f.j+" · "+f.when+" "+f.note,"#forms/"+i,2)),
 ()=>REPORTING.forEach((r,i)=>addIdx("Deadline",r.ev+" — "+r.j,r.to+" · "+r.dl+" · "+r.form,"#deadlines/"+i,3)),
 ()=>NUMBERS.forEach((n,i)=>addIdx("Limit",n.k,n.v,"#numbers/"+i,3)),
 ()=>KEYWORDS.forEach((k,i)=>addIdx("Glossary",k[0],k[2],"#keywords/"+i,1)),
 ()=>{PROTOCOLS.lsr.forEach((x,i)=>addIdx("Life-Saving Rule",x.t,x.rule,"#protocols/lsr",4));PROTOCOLS.standing.forEach(x=>addIdx("Protocol",x.t,x.purpose+" "+x.steps.join(" "),"#protocols/standing/"+x.id,3));PROTOCOLS.emergency.forEach(x=>addIdx("Emergency protocol",x.t,x.trigger+" "+x.steps.join(" "),"#protocols/emergency/"+x.id,5))},
 ()=>{FIRSTAID.topics.forEach(x=>addIdx("First aid",x.t,x.recognise.join(" ")+" "+x.do.join(" "),"#firstaid/"+x.id,4));UNSAFE.acts.forEach(c=>c.items.forEach(it=>addIdx("Unsafe act",it,c.cat,"#unsafe/acts",1)));UNSAFE.conditions.forEach(c=>c.items.forEach(it=>addIdx("Unsafe condition",it,c.cat,"#unsafe/conditions",1)))},
 ()=>{SECTORS.forEach(s=>{const ind=INDS.find(i=>i.sector===s.id);addIdx("Sector guide",s.t,s.desc+" "+s.hazards.join(" "),ind?"#industry/"+ind.id+"/sector":"#industries",3)});MATRIX.domains.forEach(d=>addIdx("State matrix",d.t,[...d.central,...d.tn,...d.ka,...d.bis].join(" "),"#matrix/"+d.n,2))}
];
function buildIndex(cb){if(indexState==="done"){cb&&cb();return}if(cb)indexWaiters.push(cb);if(indexState==="building")return;indexState="building";indexTotal=INDEX_SOURCES.length;indexDone=0;
 const step=()=>{const t0=performance.now();while(indexDone<indexTotal&&performance.now()-t0<10){INDEX_SOURCES[indexDone]();indexDone++;paletteStatus()}if(indexDone<indexTotal)idle(step);else{indexState="done";indexWaiters.splice(0).forEach(f=>f())}};
 idle(step)}
function search(q,limit){const toks=q.toLowerCase().split(/\s+/).filter(Boolean);if(!toks.length)return[];const out=[];
 for(const it of INDEX){let ok=true,sc=it.b;for(const w of toks){if(!it.h.includes(w)){ok=false;break}const tl=it.t.toLowerCase();if(tl===w)sc+=24;else if(tl.startsWith(w))sc+=18;else if(tl.includes(w))sc+=10;else sc+=1}if(ok)out.push([sc,it])}
 out.sort((a,b)=>b[0]-a[0]);return out.slice(0,limit||60).map(x=>x[1])}

  PRES.innerHTML=(indexState!=="done"?`<div class="pstatus">Indexing the library… ${indexDone}/${indexTotal}</div>`:"")+(recent.length?`<div class="pgrp">Recent</div>`:"")+pItems.filter(x=>x.k==="Recent").map((x,i)=>prow(x,i)).join("")+`<div class="pgrp">Try</div>`+pItems.filter(x=>x.k==="Try").map((x)=>prow(x,pItems.indexOf(x))).join("")+`<div class="pgrp">Tools</div>`+pItems.filter(x=>x.k==="Tool").map(x=>prow(x,pItems.indexOf(x))).join("");markSel();return}

 if(!R.length){PRES.innerHTML=(indexState!=="done"?`<div class="pstatus">Indexing… ${indexDone}/${indexTotal} sections ready.</div>`:"")+`<div class="empty"><b>No matches for “${esc(q)}”</b><span>Try a shorter word (scaffold, permit, 48 hours) or browse by industry.</span><a class="btn sm" href="#industries" data-close>Browse industries</a></div>`;return}

 pushRecent(id);const c=indContent(ind);tab=HUB_TABS.some(t=>t[0]===tab)?tab:"tasks";if(tab==="sector"&&!c.sec)tab="tasks";

 else if(tab==="procedures")body=c.procs.length?`<div class="grid" data-arrows>${c.procs.map(procRow).join("")}</div>`:emptyTab("procedures","#procedures","Browse all procedures");

 <header class="hub-h"><div class="top-row"><span class="ic">${ico(ind.icon)}</span><div class="grow"><h2>${esc(ind.t)}</h2>${langs.length?`<div class="langs">${langs.map(([l,t])=>`<span lang="${l}">${esc(t)}</span>`).join("")}</div>`:""}<p class="mt-s">${esc(ind.tag)}</p></div></div>

 ${procs.length?`<div class="card"><h4>Procedures that cite it</h4><div class="chips mt-s">${procs.slice(0,12).map(p=>`<a class="chip" href="#procedures/${attr(p.id)}">${esc(p.t)}</a>`).join("")}</div></div>`:""}`}

const INC_J=["Karnataka","Tamil Nadu","India – other state / central sphere","USA (OSHA)","UK"];

function incMatch(j,ev){const rows=[];const add=(f)=>REPORTING.filter(f).forEach(r=>rows.push(r));const ind=j!=="USA (OSHA)"&&j!=="UK";
 if(j==="USA (OSHA)"){if(ev.startsWith("Fatal"))add(r=>r.ev==="Work-related fatality");else if(ev.startsWith("Serious"))add(r=>r.ev.startsWith("In-patient"));else add(r=>r.j==="USA (OSHA)");return rows}
 if(j==="UK"){if(ev.startsWith("Fatal")||ev.startsWith("Dangerous")||ev.startsWith("Serious"))add(r=>r.j==="UK");return rows}
 if(ev.startsWith("Fatal")){add(r=>r.ev==="Fatal accident");if(j==="Karnataka")add(r=>r.j==="Karnataka"&&r.ev.startsWith("Factory"));if(j==="Tamil Nadu")add(r=>r.j==="Tamil Nadu"&&r.ev.startsWith("Factory"));add(r=>r.ev.startsWith("Construction site"));add(r=>r.ev.startsWith("Fatal accident – comp"));add(r=>r.ev.startsWith("Employee injured"))}
 if(ev.startsWith("Serious")){add(r=>r.ev.startsWith("Injury preventing"));if(j==="Karnataka")add(r=>r.j==="Karnataka"&&r.ev.startsWith("Factory"));if(j==="Tamil Nadu")add(r=>r.j==="Tamil Nadu"&&r.ev.startsWith("Factory"));add(r=>r.ev.startsWith("Employee injured"))}
 if(ev.startsWith("Dangerous"))add(r=>r.ev.startsWith("Dangerous occurrence"));
 if(ev.startsWith("Occupational"))add(r=>r.ev.startsWith("Occupational disease"));

  $("#c-gap",v).innerHTML=(out&&base)?(((s1+s2)/out)<=base?`<div class="alert ok">Intensity ${((s1+s2)/out).toFixed(4)} ≤ GEI target ${base} — surplus ≈ ${((base-(s1+s2)/out)*out).toFixed(0)} CCC</div>`:`<div class="alert bad">Intensity ${((s1+s2)/out).toFixed(4)} above GEI target ${base} — deficit ≈ ${(((s1+s2)/out-base)*out).toFixed(0)} CCC to buy/surrender</div>`):"";
  $$("input",v).forEach(i=>saved[i.id]=i.value);store.set("carbon",saved)};
 $$("input",v).forEach(i=>i.addEventListener("input",upd));upd();
 $("#c-copy",v).addEventListener("click",()=>copy(["GHG QUICK ESTIMATE (Scope 1 & 2) – "+new Date().toLocaleDateString("en-IN"),...Object.entries(EF).map(([k,e])=>`${e.l}: ${$("#q-"+k,v).value||0} × ${$("#f-"+k,v).value} ${e.u} = ${$("#t-"+k,v).textContent} tCO2e`),`Scope 1: ${$("#c-s1",v).textContent} tCO2e`,`Scope 2 (location): ${$("#c-s2",v).textContent} tCO2e`,`Scope 2 (market): ${$("#c-s2m",v).textContent} tCO2e`,`Scope 1+2: ${$("#c-tot",v).textContent} tCO2e`,`Intensity per unit: ${$("#c-int",v).textContent}; per ₹ crore: ${$("#c-turn",v).textContent}`,"Factors: IPCC 2006 defaults / CEA v20 grid 0.727 – replace with BEE-specified factors for CCTS filings."].join("\n")));
 $("#c-reset",v).addEventListener("click",()=>{const snap=store.get("carbon",{});store.set("carbon",{});route();toast("Calculator reset",{undo:()=>{store.set("carbon",snap);route()}})})}

/* ===================== SOS ===================== */
const SOS_NUMS=[["112","Unified emergency (police · fire · ambulance)",""],["108","Ambulance",""],["101","Fire and rescue",""],["100","Police",""],["1077","District disaster control room","alt"],["1800116117","Poison centre (AIIMS)","alt","1800-116-117"],["1554","Coast guard (sea / man overboard)","alt"],["181","Women helpline","alt"],["1070","State disaster helpline","alt"],["104","Health helpline","alt"],["1912","Electricity utility (BESCOM / TANGEDCO)","alt"],["1098","Child helpline","alt"]];
const siteDefault=()=>({name:"",assembly:"",hospital:"",hospitalPhone:"",ambulance:"",contacts:[]});
const tel=n=>"tel:"+String(n).replace(/[^\d+]/g,"");
function sos(){const site=Object.assign(siteDefault(),store.get("site",{}));
 const quick=[["e-medical","Medical emergency / CPR"],["e-fire","Fire"],["e-gas","Gas leak / toxic release"],["e-electric","Electrocution"],["e-fall","Fall / suspended worker"],["e-confined","Confined space rescue"],["e-collapse","Collapse"],["e-snake","Snake bite"],["e-heat","Heat stroke"],["e-burn","Burns"],["e-spill","Chemical spill"],["e-evac","Evacuation"]];
 return `<div><h2 style="color:var(--red)">SOS — emergency</h2><p class="lead">Tap a number to call. Make the scene safe, call for help, then follow the emergency card. Numbers are shown as text so you can dial them by hand.</p></div>
 <div class="sosgrid">${SOS_NUMS.map(([n,l,c,disp])=>`<a class="sosbtn ${c}" href="${tel(n)}"><b${disp?' class="long"':""}>${esc(disp||n)}</b><span>${esc(l)}</span></a>`).join("")}</div>
 <div class="card"><div class="row between"><h3>Site emergency contacts</h3><span class="muted small">Saved on this device</span></div>
  <div class="form mt"><div class="field"><label for="sName">Site / plant name</label><input id="sName" value="${attr(site.name)}"></div><div class="field"><label for="sAssembly">Assembly point</label><input id="sAssembly" value="${attr(site.assembly)}"></div><div class="field"><label for="sHospital">Nearest trauma hospital</label><input id="sHospital" value="${attr(site.hospital)}"></div><div class="field"><label for="sHospitalPhone">Hospital phone</label><input id="sHospitalPhone" inputmode="tel" value="${attr(site.hospitalPhone)}"></div><div class="field"><label for="sAmbulance">Ambulance tie-up phone</label><input id="sAmbulance" inputmode="tel" value="${attr(site.ambulance)}"></div></div>
  <div class="list mt" id="sContacts">${site.contacts.map((c,i)=>`<div class="row between item" style="padding:10px 14px"><div><b>${esc(c.role)}</b> · ${esc(c.name)}<div class="muted mono">${esc(c.phone)}</div></div><div class="row"><a class="btn sm primary" href="${tel(c.phone)}">Call</a><button type="button" class="btn sm" data-del="${i}">Remove</button></div></div>`).join("")||'<div class="muted small">Add the site main controller, safety officer, first-aider, ERT leader, electrical in-charge, security…</div>'}</div>
  <div class="form mt" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))"><div class="field"><label for="cRole">Role</label><select id="cRole"><option>Site Main Controller</option><option>Incident Controller</option><option>Safety Officer</option><option>First-aider</option><option>ERT leader</option><option>Electrical in-charge</option><option>Security</option><option>Factory Medical Officer / OHC</option><option>Client / corporate HSE</option><option>Other</option></select></div><div class="field"><label for="cName">Name</label><input id="cName"></div><div class="field"><label for="cPhone">Phone</label><input id="cPhone" inputmode="tel"></div></div>
  <div class="row mt">${site.hospitalPhone?`<a class="btn primary" href="${tel(site.hospitalPhone)}">Call hospital</a>`:""}${site.ambulance?`<a class="btn primary" href="${tel(site.ambulance)}">Call ambulance tie-up</a>`:""}<button type="button" class="btn" id="cAdd">Add contact</button><button type="button" class="btn" id="sShare">Share emergency sheet</button></div></div>
 <div class="card"><h3>Emergency cards</h3><div class="chips mt">${quick.map(([id,l])=>`<a class="chip" href="#protocols/emergency/${id}">${esc(l)}</a>`).join("")}</div><div class="row mt"><a class="btn" href="#firstaid">First aid</a><a class="btn" href="#incidents">Incident notification</a><a class="btn" href="#emergency">All contacts and portals</a></div></div>
 <div class="card alert-red"><h4>Remember</h4><ol class="steps mt-s"><li><span>Danger — protect yourself; isolate power, gas, plant.</span></li><li><span>Call 112 / 108; send someone to the gate to guide the ambulance.</span></li><li><span>Not breathing: 30 compressions : 2 breaths; get the AED.</span></li><li><span>Severe bleeding: firm direct pressure; tourniquet for limbs if needed.</span></li><li><span>Never enter a confined space or touch an electrocution victim until it is safe.</span></li></ol></div>`}
function bindSos(v){const site=Object.assign(siteDefault(),store.get("site",{}));const save=()=>store.set("site",site);
 [["sName","name"],["sAssembly","assembly"],["sHospital","hospital"],["sHospitalPhone","hospitalPhone"],["sAmbulance","ambulance"]].forEach(([id,k])=>$("#"+id,v).addEventListener("change",e=>{site[k]=e.target.value.trim();save();route()}));
 $("#cAdd",v).addEventListener("click",()=>{const name=$("#cName",v).value.trim(),phone=$("#cPhone",v).value.trim();if(!phone){toast("Enter a phone number",{kind:"err"});$("#cPhone",v).focus();return}site.contacts.push({role:$("#cRole",v).value,name,phone});save();toast("Contact added");route()});
 $$("[data-del]",v).forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.del;const removed=site.contacts.splice(i,1)[0];save();route();toast("Contact removed",{undo:()=>{const s=Object.assign(siteDefault(),store.get("site",{}));s.contacts.splice(Math.min(i,s.contacts.length),0,removed);store.set("site",s);route()}})}));
 $("#sShare",v).addEventListener("click",()=>share(["EMERGENCY SHEET"+(site.name?" — "+site.name:""),"","112 Emergency · 108 Ambulance · 101 Fire · 100 Police · 1077 District control · Poison 1800-116-117",site.assembly?"Assembly point: "+site.assembly:"",site.hospital?"Hospital: "+site.hospital+(site.hospitalPhone?" ("+site.hospitalPhone+")":""):"",site.ambulance?"Ambulance tie-up: "+site.ambulance:"","",...site.contacts.map(c=>c.role+": "+c.name+" "+c.phone)].filter(x=>x!=="").join("\n"),"Emergency sheet"))}

/* ===================== APP & MY DATA ===================== */
function appView(){const keys=store.keys();const bytes=keys.reduce((n,k)=>{try{return n+(localStorage.getItem(k)||"").length}catch(e){return n}},0);const standalone=IN_APP||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;const packs=store.get("packs",[]);const mine=IND_BY.get(myIndustry());const recent=store.get("recentInd",[]);
 return `<div><h2>App &amp; my data</h2><p class="lead">SafeWorks runs fully offline once installed. Your checklists, observations, photos, site contacts, packs and carbon figures stay on this device only — back them up before changing phones.</p></div>
 <div class="two">
  <div class="card"><h3>Install</h3><p class="muted small mt-s">Version ${APP_VERSION} · ${IN_APP?"Android app":standalone?"Installed (standalone)":"Running in the browser"}</p>
   <ul class="keys"><li><b>Android (Chrome):</b> menu ⋮ → <i>Install app</i> / <i>Add to Home screen</i>, or download the APK from the Releases page.</li><li><b>iPhone (Safari):</b> Share → <i>Add to Home Screen</i>.</li><li><b>Windows / Mac (Chrome or Edge):</b> install icon in the address bar.</li><li>After installing it opens like an app and works without internet.</li></ul>
   <div class="row mt"><button type="button" class="btn primary" id="appInstall">Install now</button><a class="btn" href="https://github.com/Julyraj/safeworks-india/releases" target="_blank" rel="noopener">Android APK (Releases)</a></div></div>
  <div class="card"><h3>My data on this device</h3><p class="muted small mt-s">${plural(keys.length,"item")} · ${(bytes/1024).toFixed(0)} KB used (browser limit ≈ 5 MB)</p>
   <div class="row mt"><button type="button" class="btn" id="bkCopy">${ICONS.copy}Copy backup</button><button type="button" class="btn" id="bkShare">Share backup</button></div>
   <div class="field mt"><label for="bkIn">Restore — paste a backup here</label><textarea id="bkIn" placeholder='{"swi.obs":"[...]"}'></textarea></div>
   <div class="row mt-s"><button type="button" class="btn" id="bkRestore">Restore backup</button><button type="button" class="btn danger" id="bkClear">Erase all my data</button></div></div>
 </div>
 <div class="two">
  <div class="card"><h3>My industry and packs</h3><p class="muted small mt-s">${mine?`My industry: <b>${esc(mine.t)}</b>`:"No industry chosen yet — open an industry hub and tap “Set as my industry”."}</p>
   ${packs.length?`<div class="list mt">${packs.map((p,i)=>`<div class="row between item" style="padding:10px 14px"><a href="#pack/${attr(p.ind)}/${attr(p.task)}">${esc(p.t)}</a><button type="button" class="btn sm" data-unpack="${i}">Remove</button></div>`).join("")}</div>`:`<p class="muted small mt">No saved packs. Open a task pack and tap “Add to my packs”.</p>`}
   <div class="row mt">${recent.length?`<button type="button" class="btn" id="clearRecent">Clear recent industries</button>`:""}${packs.length?`<button type="button" class="btn" id="clearPacks">Clear all packs</button>`:""}</div></div>
  <div class="card"><h3>Appearance and shortcuts</h3><div class="row mt"><span>Theme</span><div class="segs" id="themeSegs">${THEMES.map(t=>`<button type="button" class="${store.get("theme","system")===t?"on":""}" data-t="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div></div><div class="row mt"><button type="button" class="btn" id="showHelp">${ICONS.help}Keyboard shortcuts</button></div>
   <h4 class="mt-l">About</h4><p class="small mt-s">SafeWorks India — industry-first safety library. Regulatory snapshot ${SNAPSHOT}; items marked “verify” need the gazetted text. Source and updates: <a href="https://github.com/Julyraj/safeworks-india" target="_blank" rel="noopener">github.com/Julyraj/safeworks-india</a>. This app supports, and does not replace, statutory texts, certified training and competent-authority advice.</p></div>
 </div>`}
function bindApp(v){const dump=()=>{const o={};store.keys().forEach(k=>{try{o[k]=localStorage.getItem(k)}catch(e){}});return JSON.stringify(o)};
 $("#bkCopy",v).addEventListener("click",()=>copy(dump(),"Backup copied"));$("#bkShare",v).addEventListener("click",()=>share(dump(),"SafeWorks backup"));
 $("#bkRestore",v).addEventListener("click",()=>{try{const o=JSON.parse($("#bkIn",v).value);let n=0;Object.entries(o).forEach(([k,val])=>{if((k.startsWith("swi.")||k.startsWith("sw:"))&&typeof val==="string"){const nk=k.startsWith("sw:")?"swi."+k.slice(3).replace(/:/g,"."):k;try{localStorage.setItem(nk,val);n++}catch(e){}}});toast("Restored "+plural(n,"item"));route()}catch(e){toast("That is not a valid backup",{kind:"err"})}});
 $("#bkClear",v).addEventListener("click",()=>{const snap={};store.keys().forEach(k=>{try{snap[k]=localStorage.getItem(k)}catch(e){}});store.keys().forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});route();toast("All data erased",{undo:()=>{Object.entries(snap).forEach(([k,val])=>{try{localStorage.setItem(k,val)}catch(e){}});route()}})});
 $("#appInstall",v).addEventListener("click",doInstall);
 $$("[data-unpack]",v).forEach(b=>b.addEventListener("click",()=>{const L=store.get("packs",[]);const i=+b.dataset.unpack;const removed=L.splice(i,1)[0];store.set("packs",L);route();toast("Pack removed",{undo:()=>{const L2=store.get("packs",[]);L2.splice(Math.min(i,L2.length),0,removed);store.set("packs",L2);route()}})}));
 $("#clearRecent",v)?.addEventListener("click",()=>{const snap=store.get("recentInd",[]);store.set("recentInd",[]);route();toast("Recent industries cleared",{undo:()=>{store.set("recentInd",snap);route()}})});
 $("#clearPacks",v)?.addEventListener("click",()=>{const snap=store.get("packs",[]);store.set("packs",[]);route();toast("All packs removed",{undo:()=>{store.set("packs",snap);route()}})});
 $("#themeSegs",v).addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;store.set("theme",b.dataset.t);applyTheme();$$("button",e.currentTarget).forEach(x=>x.classList.toggle("on",x===b))});
 $("#showHelp",v).addEventListener("click",helpSheet)}

/* ===================== ROUTER ===================== */
const HEAVY=new Set(["regulations","downloads","keywords","matrix","industry","pack","firstaid","protocols","unsafe","talks","checklists","procedures","industries"]);
function parseHash(){const h=decodeURIComponent((location.hash||"#home").slice(1));const parts=h.split("/").map(p=>p.trim()).filter(Boolean);return {view:parts[0]||"home",a:parts[1],b:parts[2],parts}}
function currentView(){return parseHash().view}
function go(h){if(!h)return;if(location.hash===h)route();else location.hash=h}
const VIEWS={
 home:{render:()=>home(),bind:bindHome,title:"SafeWorks India"},
 industries:{render:()=>industries(),bind:bindIndustries,title:"Industries"},
 sectors:{alias:"industries"},
 industry:{render:(a,b)=>hub(a,b),bind:(v,a)=>bindHub(v,a),title:a=>(IND_BY.get(a)||{}).t||"Industry",nav:"industries"},
 pack:{render:(a,b)=>pack(a,b),bind:(v,a,b)=>bindPack(v,a,b),title:a=>"Pack · "+((IND_BY.get(a)||{}).t||""),nav:"industries"},
 regulations:{render:a=>regs(a),bind:(v,a)=>bindRegs(v,a),title:"Regulations"},
 downloads:{render:()=>downloads(),bind:bindDownloads,title:"Document downloads"},
 procedures:{render:a=>procs(a),bind:(v,a)=>bindProcs(v,a),title:"Procedures"},
 checklists:{render:a=>checklists(a),bind:(v,a)=>bindCks(v,a),title:"Checklists"},
 talks:{render:()=>talks(),bind:v=>bindTalkCopy(v),title:"Toolbox talks",jump:a=>"talk-"+a},
 forms:{render:()=>forms(),bind:bindForms,title:"Forms & registers",jump:a=>"form-"+a},
 reporting:{render:()=>reporting(),bind:()=>{},title:"Reporting deadlines",jump:a=>"rep-"+a},
 numbers:{render:()=>numbers(),bind:bindNumbers,title:"Limits & thresholds",jump:a=>"num-"+a},
 keywords:{render:()=>keywords(),bind:bindKeywords,title:"Keywords & glossary",jump:a=>"kw-"+a},
 glossary:{alias:"keywords"},
 protocols:{render:a=>protocols(a),bind:bindProtocols,title:"Safety protocols",jump:(a,b)=>b},
 unsafe:{render:a=>unsafe(a),bind:bindUnsafe,title:"Unsafe acts & conditions"},
 firstaid:{render:()=>firstaid(),bind:bindFirstaid,title:"First aid",jump:a=>a},
 matrix:{render:()=>matrix(),bind:bindMatrix,title:"TN vs Karnataka matrix",jump:a=>"mx-"+a},
 risk:{render:()=>risk(),bind:bindRisk,title:"Risk matrix calculator"},
 deadlines:{render:a=>deadlines(a!==undefined?+a:undefined),bind:bindDeadlines,title:"Deadline calculator"},
 permits:{render:a=>permits(a),bind:bindPermits,title:"Permit builder"},
 incidents:{render:()=>incidents(),bind:bindIncidents,title:"Incident navigator"},
 observe:{render:()=>observe(),bind:bindObserve,title:"Observation card"},
 carbon:{render:()=>carbon(),bind:bindCarbon,title:"Carbon & ESG desk"},
 emergency:{render:()=>emergency(),bind:()=>{},title:"Emergency contacts"},
 sos:{render:()=>sos(),bind:bindSos,title:"SOS"},
 app:{render:()=>appView(),bind:bindApp,title:"App & my data"}
};
let routeSeq=0;
function route(keep){const {view,a,b}=parseHash();let def=VIEWS[view];if(def&&def.alias){location.replace("#"+def.alias+(a?"/"+a:""));return}
 const v=$("#view");closeSheet();closePalette();
 if(!def){def={render:()=>`<div class="empty"><b>There is no page called “${esc(view)}”</b><span>Pick a section from the menu or search the library.</span><div class="row"><a class="btn primary" href="#home">Home</a><button type="button" class="btn" data-open-search="${attr(view)}">Search “${esc(view)}”</button></div></div>`,bind:()=>{},title:"Not found"}}
 renderNav(def.nav||view);
 const t=typeof def.title==="function"?def.title(a,b):def.title;document.title=(t&&t!=="SafeWorks India"?t+" · ":"")+"SafeWorks India";
 const seq=++routeSeq;const paint=()=>{if(seq!==routeSeq)return;try{v.innerHTML=def.render(a,b);def.bind(v,a,b);const j=def.jump&&def.jump(a,b);if(j){const el=document.getElementById(j);if(el){el.scrollIntoView({block:"start"});el.style.outline="3px solid var(--hivis)";el.style.outlineOffset="2px";setTimeout(()=>{el.style.outline="";el.style.outlineOffset=""},2500);el.querySelector("details")?.setAttribute("open","")}}}catch(err){console.error(err);v.innerHTML=errorCard(err,view);$("#errCopy",v)?.addEventListener("click",()=>copy($("pre",v).textContent,"Details copied"))}v.setAttribute("aria-busy","false");if(!keep&&!(def.jump&&def.jump(a,b)))window.scrollTo({top:0})};
 if(HEAVY.has(view)&&!keep){v.setAttribute("aria-busy","true");v.innerHTML=skeleton(view==="industry"||view==="pack"?"hub":view==="regulations"||view==="downloads"?"list":"grid");raf(paint)}else paint();
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-open-search]");if(b){e.preventDefault();openPalette(b.dataset.openSearch||"")}});
window.addEventListener("hashchange",()=>route());
if(IN_APP&&window.Capacitor.Plugins.App){window.Capacitor.Plugins.App.addListener("backButton",({canGoBack})=>{if(!PALETTE.hidden){closePalette();return}if(sheetOpen()){closeSheet();return}if(canGoBack&&location.hash&&location.hash!=="#home")history.back();else window.Capacitor.Plugins.App.exitApp()})}
route();
idle(()=>buildIndex());
})();
</script>
