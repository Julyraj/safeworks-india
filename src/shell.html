<title>SafeWorks India</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed navy rail on the left (site-control-room feel), white working surface, safety-orange accent reserved for actions and active states; semantic colours (good/warn/crit) separate from the accent. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface2:#eaeef1; --fg:#17222c; --muted:#5b6974; --line:#d4dbe1;
  --accent:#d1480c; --accent-ink:#ffffff; --accent-soft:#fdeee4;
  --nav:#0f1c2b; --nav-fg:#c9d4de; --nav-active:#1c2f45;
  --good:#1e7a4b; --warn:#a9700e; --crit:#b3261e; --info:#1f5fa8;
  --chip:#e6ebef; --chip-fg:#2b3942;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px; --shadow:0 1px 2px rgba(16,24,32,.06),0 4px 14px rgba(16,24,32,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1419; --surface:#161e26; --surface2:#1d2730; --fg:#e4eaef; --muted:#97a5b1; --line:#2a3741;
  --accent:#f07a35; --accent-ink:#161010; --accent-soft:#3a2416;
  --nav:#0a1118; --nav-fg:#b9c6d1; --nav-active:#182636;
  --good:#4fbf85; --warn:#e2b04a; --crit:#f0786e; --info:#6ea8ea;
  --chip:#22303b; --chip-fg:#cdd7df; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#161e26; --surface2:#1d2730; --fg:#e4eaef; --muted:#97a5b1; --line:#2a3741;
  --accent:#f07a35; --accent-ink:#161010; --accent-soft:#3a2416;
  --nav:#0a1118; --nav-fg:#b9c6d1; --nav-active:#182636;
  --good:#4fbf85; --warn:#e2b04a; --crit:#f0786e; --info:#6ea8ea;
  --chip:#22303b; --chip-fg:#cdd7df; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
a{color:var(--info)}
button{font:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.rail{background:var(--nav);color:var(--nav-fg);padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-family:var(--mono);font-size:13px;flex:none}
.brand h1{font-size:16px;margin:0;color:#fff;letter-spacing:.2px;text-wrap:balance}
.brand small{display:block;font-size:11px;color:var(--nav-fg);font-family:var(--mono);letter-spacing:.3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7f8f9d;padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);color:var(--nav-fg);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--nav-active);color:#fff}
.nav a.on{background:var(--nav-active);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav a .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:#7f8f9d}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.railfoot{margin-top:auto;font-size:11.5px;color:#7f8f9d;line-height:1.45}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;min-width:0}
.search input{flex:1;border:0;background:transparent;color:var(--fg);font:inherit;outline:none;min-width:0}
.search input:focus-visible{outline:none}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search kbd{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.asof{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.content{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1180px;width:100%}
h2{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:16px;margin:0;text-wrap:balance}
h4{font-size:13.5px;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lead{color:var(--muted);margin:4px 0 0;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--accent)}
.tile .big{font-family:var(--mono);font-size:24px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .lbl{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);color:var(--chip-fg);border-radius:999px;padding:3px 10px;font-size:12px;border:1px solid transparent;cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.sm{padding:1px 8px;font-size:11px;cursor:default}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.st.inforce::before{background:var(--good)} .st.transition::before{background:var(--warn)} .st.draft::before{background:var(--info)} .st.repealed::before{background:var(--crit)} .st.guidance::before{background:var(--info)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:focus-visible,.chip:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.item.clk{cursor:pointer}
.item.clk:hover{border-color:var(--accent)}
.item .hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.item .t{font-weight:600;font-size:15.5px;text-wrap:balance}
.meta{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sum{margin:8px 0 0;max-width:80ch}
ul.keys{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
ul.keys li::marker{color:var(--accent)}
.note{margin-top:10px;padding:8px 12px;border-left:3px solid var(--warn);background:var(--surface2);font-size:13.5px;border-radius:0 var(--r) var(--r) 0}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"";width:0;height:0;border-left:6px solid var(--muted);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){details summary::before{transition:none}}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:12px;color:var(--accent-ink);background:var(--accent);border-radius:4px;width:26px;height:24px;display:grid;place-items:center;font-weight:500;margin-top:2px}
.refs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.refs .box{background:var(--surface2);border-radius:var(--r);padding:10px 12px;font-size:13px;min-width:0}
.refs .box h4{margin-bottom:6px}
.refs ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ck{display:flex;flex-direction:column;gap:6px}
.ck label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.ck label:has(input:checked){background:var(--surface2);text-decoration:line-through;color:var(--muted)}
.ck input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.bar{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .2s}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:8px 10px;font:inherit;min-width:0;width:100%}
.f textarea{min-height:70px;resize:vertical}
.f.wide{grid-column:1/-1}
.out{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px;max-height:520px;overflow:auto;line-height:1.5}
.alert{padding:10px 12px;border-radius:var(--r);font-size:13.5px;border:1px solid}
.alert.ok{border-color:var(--good);color:var(--good)} .alert.bad{border-color:var(--crit);color:var(--crit)} .alert.wn{border-color:var(--warn);color:var(--warn)}
.gas{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.gas .g{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--surface)}
.gas .g b{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.gas .g input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-family:var(--mono);font-size:16px;padding:4px 0}
.gas .g.bad{border-color:var(--crit)} .gas .g.ok{border-color:var(--good)}
.gas .g small{display:block;font-size:11px;color:var(--muted)}
.empty{color:var(--muted);padding:24px;text-align:center}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
input.num{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:5px 8px;font:inherit;font-family:var(--mono)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:20;box-shadow:var(--shadow)}
.sr{display:flex;flex-direction:column;gap:8px}
.sr .r{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.sr .r:hover{border-color:var(--accent)}
.sr .k{font-family:var(--mono);font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;padding-top:3px;white-space:nowrap}
.timeline{display:flex;flex-direction:column;gap:0}
.timeline .ev{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.timeline .ev .d{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500}
.back{color:var(--muted);text-decoration:none;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--accent)}
.mtable td:first-child{font-weight:600;width:28%}
.menu-btn{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;padding-block:12px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px;scrollbar-width:thin}
  .nav .grp{display:none}
  .nav a{white-space:nowrap;padding:6px 10px;font-size:13px}
  .nav a .n{display:none}
  .railfoot{display:none}
  .top{top:env(safe-area-inset-top,0px)}
  .asof{display:none}
  .timeline .ev{grid-template-columns:1fr}
  .refs{grid-template-columns:1fr}
}
@media print{.rail,.top{display:none}}
</style>

const PCATS=["All","Construction","Industrial","Chemical","Electrical","Lifting & Tools","Fire & Emergency","Health","Carbon & ESG","Management"];
function procs(){
 if(STATE.proc){const p=PROCS.find(x=>x.id===STATE.proc);if(p)return procDetail(p)}

function procText(p){const L=[];L.push(p.t.toUpperCase(),"","PURPOSE: "+p.purpose,"SCOPE: "+p.scope,"","ROLES:",...p.roles.map(r=>"- "+r),"","HAZARDS:",...p.hazards.map(r=>"- "+r),"","PRE-REQUISITES:",...p.pre.map(r=>"- "+r),"","PROCEDURE:",...p.steps.map((s,i)=>(i+1)+". "+s),"","PPE:",...p.ppe.map(r=>"- "+r),"","STOP WORK IF:",...p.stop.map(r=>"- "+r),"","RECORDS:",...p.records.map(r=>"- "+r),"","REFERENCES:","India: "+p.refs.india.join("; "),"Karnataka: "+p.refs.ka.join("; "),"Tamil Nadu: "+p.refs.tn.join("; "),"OSHA/US: "+p.refs.osha.join("; "),"International: "+p.refs.intl.join("; "));return L.join("\n")}

 </div>
 <div class="two">

  ${[["India – Central",p.refs.india],["Karnataka",p.refs.ka],["Tamil Nadu",p.refs.tn],["USA (OSHA / NFPA / ANSI)",p.refs.osha],["International / UK-EU",p.refs.intl]].map(([h,a])=>`<div class="box"><h4>${h}</h4><ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}

const CKCATS=["All","Construction","Industrial","Chemical","Electrical","Fire & Emergency","Health","Environment","Management"];
function checklists(){
 if(STATE.ck){const c=CHECKLISTS.find(x=>x.id===STATE.ck);if(c)return ckDetail(c)}
 const list=CHECKLISTS.filter(c=>STATE.ckCat==="All"||c.cat===STATE.ckCat);
 return `<div><h2>Checklists</h2><p class="lead">Tick items as you inspect. Progress is remembered on this device only; copy the summary into your inspection register.</p></div>

 <div class="grid">${list.map(c=>{const st=store.get("ck:"+c.id,{});const done=Object.values(st).filter(Boolean).length;return `<div class="item clk" data-ck="${c.id}"><div class="t">${esc(c.t)}</div><div class="meta" style="margin:4px 0 8px"><span class="tag">${esc(c.cat)}</span><span>${c.items.length} items</span></div><div class="bar"><i style="width:${Math.round(done/c.items.length*100)}%"></i></div><div class="meta" style="margin-top:6px">${done}/${c.items.length} done</div></div>`}).join("")}</div>`;

function ckDetail(c){
 const st=store.get("ck:"+c.id,{});
 return `<a class="back" href="#checklists" data-back="ck">← All checklists</a>
 <div class="row" style="justify-content:space-between"><div><h2>${esc(c.t)}</h2><div class="meta"><span class="tag">${esc(c.cat)}</span><span>${c.items.length} items</span></div></div><div class="row"><button class="btn" id="ckCopy">Copy summary</button><button class="btn" id="ckReset">Reset</button></div></div>
 <div class="card" style="display:flex;flex-direction:column;gap:8px"><div class="form" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div class="f"><label for="ckSite">Site / area</label><input id="ckSite" value="${esc(store.get("ck:meta:"+c.id,{}).site||"")}"></div><div class="f"><label for="ckBy">Inspected by</label><input id="ckBy" value="${esc(store.get("ck:meta:"+c.id,{}).by||"")}"></div><div class="f"><label for="ckDate">Date</label><input id="ckDate" type="date" value="${esc(store.get("ck:meta:"+c.id,{}).date||new Date().toISOString().slice(0,10))}"></div></div><div class="bar"><i id="ckBar"></i></div><div class="meta" id="ckCount"></div></div>
 <div class="ck" id="ckItems">${c.items.map((it,i)=>`<label><input type="checkbox" id="ck-${c.id}-${i}" data-i="${i}" ${st[i]?"checked":""}><span>${esc(it)}</span></label>`).join("")}</div>
 <div class="card"><h4>Findings / actions</h4><textarea id="ckNotes" class="f" style="width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);padding:8px;font:inherit">${esc(store.get("ck:meta:"+c.id,{}).notes||"")}</textarea></div>`;
}
function bindCk(c){
 const st=store.get("ck:"+c.id,{});const meta=store.get("ck:meta:"+c.id,{});
 const upd=()=>{const d=Object.values(st).filter(Boolean).length;$("#ckBar").style.width=Math.round(d/c.items.length*100)+"%";$("#ckCount").textContent=`${d} of ${c.items.length} items checked`};
 $("#ckItems").addEventListener("change",e=>{if(e.target.matches("input")){st[e.target.dataset.i]=e.target.checked;store.set("ck:"+c.id,st);upd()}});
 ["ckSite","ckBy","ckDate","ckNotes"].forEach(id=>$("#"+id).addEventListener("input",e=>{meta[id.slice(2).toLowerCase()]=e.target.value;store.set("ck:meta:"+c.id,meta)}));
 $("#ckReset").addEventListener("click",()=>{Object.keys(st).forEach(k=>delete st[k]);store.set("ck:"+c.id,st);$("#ckItems").querySelectorAll("input").forEach(i=>i.checked=false);upd()});
 $("#ckCopy").addEventListener("click",()=>{const lines=[c.t.toUpperCase(),`Site: ${$("#ckSite").value}  Inspected by: ${$("#ckBy").value}  Date: ${$("#ckDate").value}`,"",...c.items.map((it,i)=>(st[i]?"[x] ":"[ ] ")+it),"",`Result: ${Object.values(st).filter(Boolean).length}/${c.items.length} compliant`,"Findings/actions:",$("#ckNotes").value||"(none)"];copy(lines.join("\n"))});
 upd();
}

  L.push("","Issuer: "+(g("pIssuer")||"—")+"   Sign/time: ________","Receiver: "+(g("pReceiver")||"—")+"   Sign/time: ________","","CLOSE-OUT: area clean, tools removed, guards refitted, fire watch complete  [ ]","Closed by issuer: ________  time: ____   De-isolation authorised: [ ]","","Reference: "+t.ref,"Generated "+new Date().toLocaleString());
  $("#pOut").textContent=L.join("\n");const warn=[];if(missing)warn.push(missing+" precaution(s) unchecked");if(bad.length)warn.push("gas test failed");if(!g("pTo"))warn.push("no expiry time");if(warn.length)toast("Permit NOT ready: "+warn.join(", "));else toast("Permit ready");return L.join("\n")};

/* ---------- INCIDENT NAVIGATOR ---------- */
const INC_J=["Karnataka","Tamil Nadu","India – other state / central sphere","USA (OSHA)","UK"];
const INC_EV=["Fatal accident","Serious injury (absent ≥ 48 h / hospitalised)","Dangerous occurrence (no injury)","Occupational disease","Major chemical accident / release","Electrical accident","Boiler / pressure vessel accident","Environmental spill / discharge","Petroleum / explosives / cylinder incident","Radiation incident","Lift / hoist accident"];
function incMatch(j,ev){
 const rows=[];const add=(f)=>REPORTING.filter(f).forEach(r=>rows.push(r));
 const ind=j!=="USA (OSHA)"&&j!=="UK";
 if(j==="USA (OSHA)"){if(ev.startsWith("Fatal"))add(r=>r.ev==="Work-related fatality");else if(ev.startsWith("Serious"))add(r=>r.ev.startsWith("In-patient"));else add(r=>r.j==="USA (OSHA)");return rows}
 if(j==="UK"){if(ev.startsWith("Fatal")||ev.startsWith("Dangerous")||ev.startsWith("Serious"))add(r=>r.j==="UK");return rows}
 if(ev.startsWith("Fatal")){add(r=>r.ev==="Fatal accident");if(j==="Karnataka")add(r=>r.j==="Karnataka"&&r.ev.startsWith("Factory"));if(j==="Tamil Nadu")add(r=>r.j==="Tamil Nadu"&&r.ev.startsWith("Factory"));add(r=>r.ev.startsWith("Construction site"));add(r=>r.ev.startsWith("Fatal accident – comp"));add(r=>r.ev.startsWith("Employee injured"))}
 if(ev.startsWith("Serious")){add(r=>r.ev.startsWith("Injury preventing"));if(j==="Karnataka")add(r=>r.j==="Karnataka"&&r.ev.startsWith("Factory"));if(j==="Tamil Nadu")add(r=>r.j==="Tamil Nadu"&&r.ev.startsWith("Factory"));add(r=>r.ev.startsWith("Employee injured"))}
 if(ev.startsWith("Dangerous"))add(r=>r.ev.startsWith("Dangerous occurrence"));
 if(ev.startsWith("Occupational"))add(r=>r.ev.startsWith("Occupational disease"));
 if(ev.startsWith("Major chemical")){add(r=>r.ev.startsWith("Major chemical"));add(r=>r.ev.startsWith("Dangerous occurrence"));add(r=>r.ev.startsWith("Hazardous waste"));add(r=>r.ev.startsWith("Accidental discharge"))}
 if(ev.startsWith("Electrical")){add(r=>r.ev.startsWith("Electrical accident"));add(r=>r.ev.startsWith("Dangerous occurrence"))}
 if(ev.startsWith("Boiler")){add(r=>r.ev.startsWith("Boiler"));add(r=>r.ev.startsWith("Dangerous occurrence"))}
 if(ev.startsWith("Environmental")){add(r=>r.ev.startsWith("Accidental discharge"));add(r=>r.ev.startsWith("Hazardous waste"))}
 if(ev.startsWith("Petroleum")){add(r=>r.ev.startsWith("Accident at petroleum"));add(r=>r.ev.startsWith("Dangerous occurrence"))}
 if(ev.startsWith("Radiation"))add(r=>r.ev.startsWith("Radiation"));
 if(ev.startsWith("Lift")){add(r=>r.ev.startsWith("Lift/escalator"));add(r=>r.ev.startsWith("Dangerous occurrence"))}
 if(ind&&(ev.startsWith("Fatal")||ev.startsWith("Serious"))&&!rows.some(r=>r.ev.startsWith("Fatal accident")||r.ev.startsWith("Injury")))add(r=>r.ev==="Fatal accident");
 return rows;
}

 <div class="tbl"><table class="mtable"><tbody>${list.map(([k,c,v])=>`<tr><td>${esc(k)}<div class="meta">${esc(c)}</div></td><td>${esc(v)}</td></tr>`).join("")}</tbody></table></div>`;
}
function bindKeywords(){bindChips($("#view"),val=>{STATE.kwCat=val;route()})}

/* ---------- SEARCH ---------- */
function searchView(q){
 const t=q.toLowerCase();const hit=s=>String(s).toLowerCase().includes(t);const R=[];
 REGS.forEach(r=>{if(hit(r.t)||hit(r.sum)||r.key.some(hit)||hit(r.a))R.push({k:"Regulation",t:r.t,s:r.sum,go:{v:"regulations",reg:r.id}})});
 PROCS.forEach(p=>{if(hit(p.t)||hit(p.purpose)||hit(p.scope)||p.steps.some(hit)||p.hazards.some(hit))R.push({k:"Procedure",t:p.t,s:p.purpose,go:{v:"procedures",proc:p.id}})});
 CHECKLISTS.forEach(c=>{if(hit(c.t)||c.items.some(hit))R.push({k:"Checklist",t:c.t,s:c.items.find(hit)||c.items[0],go:{v:"checklists",ck:c.id}})});
 FORMS.forEach(f=>{if(hit(f.t)||hit(f.law)||hit(f.note))R.push({k:"Form",t:f.t,s:f.law+" · "+f.when,go:{v:"forms"}})});
 REPORTING.forEach(r=>{if(hit(r.ev)||hit(r.to)||hit(r.law))R.push({k:"Deadline",t:r.ev+" — "+r.j,s:r.to+" · "+r.dl,go:{v:"reporting"}})});
 NUMBERS.forEach(n=>{if(hit(n.k)||hit(n.v))R.push({k:"Limit",t:n.k,s:n.v,go:{v:"numbers"}})});
 TALKS.forEach(x=>{if(hit(x.t)||x.pts.some(hit))R.push({k:"Toolbox talk",t:x.t,s:x.pts[0],go:{v:"talks"}})});
 SECTORS.forEach(x=>{if(hit(x.t)||hit(x.desc)||x.hazards.some(hit)||x.statutory.some(hit))R.push({k:"Sector",t:x.t,s:x.desc,go:{v:"sectors",sector:x.id}})});
 UNSAFE.acts.forEach(c=>c.items.forEach(it=>{if(hit(it)||hit(c.cat))R.push({k:"Unsafe act",t:it,s:c.cat,go:{v:"unsafe"}})}));
 UNSAFE.conditions.forEach(c=>c.items.forEach(it=>{if(hit(it)||hit(c.cat))R.push({k:"Unsafe condition",t:it,s:c.cat,go:{v:"unsafe"}})}));
 PROTOCOLS.lsr.forEach(x=>{if(hit(x.t)||hit(x.rule))R.push({k:"Protocol",t:x.t,s:x.rule,go:{v:"protocols"}})});
 PROTOCOLS.standing.forEach(x=>{if(hit(x.t)||hit(x.purpose)||x.steps.some(hit))R.push({k:"Protocol",t:x.t,s:x.purpose,go:{v:"protocols"}})});
 PROTOCOLS.emergency.forEach(x=>{if(hit(x.t)||hit(x.trigger)||x.steps.some(hit))R.push({k:"Emergency protocol",t:x.t,s:x.trigger,go:{v:"protocols"}})});
 FIRSTAID.topics.forEach(x=>{if(hit(x.t)||x.recognise.some(hit)||x.do.some(hit))R.push({k:"First aid",t:x.t,s:x.recognise[0],go:{v:"firstaid"}})});
 KEYWORDS.forEach(([k,c,v])=>{if(hit(k)||hit(v))R.push({k:"Keyword",t:k,s:v,go:{v:"keywords"}})});
 return `<div><h2>Search: “${esc(q)}”</h2><p class="lead">${R.length} result${R.length===1?"":"s"}</p></div><div class="sr">${R.slice(0,80).map((r,i)=>`<div class="r" data-sr="${i}"><span class="k">${esc(r.k)}</span><div><div style="font-weight:600">${esc(r.t)}</div><div class="meta" style="margin-top:2px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.s)}</div></div></div>`).join("")||'<div class="empty">Nothing found. Try a shorter term (e.g. “scaffold”, “Form XI”, “48 hours”).</div>'}</div>`;
}
let SR=[];

/* ---------- ROUTER ---------- */
function route(){
 const h=(location.hash||"#home").slice(1);const v=$("#view");nav(h);
 if(STATE.q){v.innerHTML=searchView(STATE.q);bindSearch();return}
 switch(h){
  case "regulations":v.innerHTML=regs();bindRegs();break;
  case "procedures":v.innerHTML=procs();bindProcs();break;
  case "checklists":v.innerHTML=checklists();bindCks();break;
  case "permits":v.innerHTML=permits();bindPermits();break;
  case "incidents":v.innerHTML=incidents();bindIncidents();break;
  case "forms":v.innerHTML=forms();break;
  case "reporting":v.innerHTML=reporting();break;
  case "talks":v.innerHTML=talks();v.querySelectorAll("[data-talk]").forEach(b=>b.addEventListener("click",()=>{const t=TALKS[+b.dataset.talk];copy("TOOLBOX TALK: "+t.t+"\n"+t.pts.map((p,i)=>(i+1)+". "+p).join("\n"))}));break;
  case "emergency":v.innerHTML=emergency();break;
  case "numbers":v.innerHTML=numbers();break;
  case "sectors":v.innerHTML=sectors();bindSectors();break;
  case "protocols":v.innerHTML=protocols();bindProtocols();break;
  case "unsafe":v.innerHTML=unsafe();bindUnsafe();break;
  case "firstaid":v.innerHTML=firstaid();bindFirstaid();break;
  case "keywords":v.innerHTML=keywords();bindKeywords();break;
  case "observe":v.innerHTML=observe();bindObserve();break;
  case "glossary":location.hash="#keywords";return;
  case "carbon":v.innerHTML=carbon();bindCarbon();break;
  default:v.innerHTML=home();
 }
 bindJumps(v);window.scrollTo({top:0});
}
function go(h){if(location.hash===h)route();else location.hash=h}
function bindJumps(root){root.querySelectorAll("a[data-proc]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();STATE.proc=a.dataset.proc;STATE.q="";$("#q").value="";go("#procedures")}));root.querySelectorAll("a[data-ck]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();STATE.ck=a.dataset.ck;STATE.q="";$("#q").value="";go("#checklists")}));root.querySelectorAll("a[data-reg]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();STATE.reg=a.dataset.reg;STATE.regJ="All";STATE.regD="All";STATE.regS="All";STATE.q="";$("#q").value="";go("#regulations")}))}
function bindRegs(){const v=$("#view");v.querySelectorAll(".chips").forEach((bar,idx)=>bar.querySelectorAll(".chip[data-v]").forEach(c=>c.addEventListener("click",()=>{if(idx===0)STATE.regJ=c.dataset.v;else if(idx===1)STATE.regD=c.dataset.v;else STATE.regS=c.dataset.v;route()})));if(STATE.reg){const el=document.getElementById("reg-"+STATE.reg);if(el){el.scrollIntoView({block:"start"});el.style.borderColor="var(--accent)";el.querySelector("details")?.setAttribute("open","")}STATE.reg=null}}
function bindProcs(){const v=$("#view");if(STATE.proc){$("#copyProc")?.addEventListener("click",()=>copy(procText(PROCS.find(p=>p.id===STATE.proc))));v.querySelector("[data-back]").addEventListener("click",e=>{e.preventDefault();STATE.proc=null;route()});return}bindChips(v,val=>{STATE.procCat=val;route()});v.querySelectorAll(".item[data-proc]").forEach(it=>it.addEventListener("click",()=>{STATE.proc=it.dataset.proc;route()}))}
function bindCks(){const v=$("#view");if(STATE.ck){bindCk(CHECKLISTS.find(c=>c.id===STATE.ck));v.querySelector("[data-back]").addEventListener("click",e=>{e.preventDefault();STATE.ck=null;route()});return}bindChips(v,val=>{STATE.ckCat=val;route()});v.querySelectorAll(".item[data-ck]").forEach(it=>it.addEventListener("click",()=>{STATE.ck=it.dataset.ck;route()}))}
function bindSearch(){const q=STATE.q.toLowerCase();const items=[];const v=$("#view");v.querySelectorAll("[data-sr]").forEach(el=>el.addEventListener("click",()=>{const title=el.querySelector("div>div").textContent;const k=el.querySelector(".k").textContent;STATE.q="";$("#q").value="";
 if(k==="Regulation"){const r=REGS.find(x=>x.t===title);STATE.reg=r?.id;go("#regulations")}
 else if(k==="Procedure"){const p=PROCS.find(x=>x.t===title);STATE.proc=p?.id;go("#procedures")}
 else if(k==="Checklist"){const c=CHECKLISTS.find(x=>x.t===title);STATE.ck=c?.id;go("#checklists")}
 else if(k==="Sector"){const c=SECTORS.find(x=>x.t===title);STATE.sector=c?.id;go("#sectors")}
 else if(k==="Keyword"||k==="Glossary"){STATE.kwCat="All";go("#keywords")}
 else if(k==="Protocol"||k==="Emergency protocol"){STATE.protoTab=k==="Emergency protocol"?"emergency":(PROTOCOLS.lsr.some(x=>x.t===title)?"lsr":"standing");go("#protocols")}
 else if(k==="Unsafe act"||k==="Unsafe condition"){STATE.unsafeTab=k==="Unsafe act"?"acts":"conditions";go("#unsafe")}
 else if(k==="First aid"){STATE.faCat="All";go("#firstaid")}
 else{const map={Form:"forms",Deadline:"reporting",Limit:"numbers","Toolbox talk":"talks"};go("#"+map[k])}}))}
window.addEventListener("hashchange",()=>{if(location.hash!=="#procedures")STATE.proc=null;if(location.hash!=="#checklists")STATE.ck=null;if(location.hash!=="#sectors")STATE.sector=null;STATE.q="";$("#q").value="";route()});
let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{STATE.q=e.target.value.trim();route()},180)});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus()}if(e.key==="Escape"&&document.activeElement===$("#q")){$("#q").value="";STATE.q="";route()}});
route();
})();
</script>
