t contents.","Monthly: extinguisher visual (pressure, seal, tag), emergency lighting flick test, fire doors/closers, hydrant valve exercise sample, foam system visual, detector cleanliness, sprinkler heads not obstructed/painted/storage ≥ 450 mm below.","Quarterly: hydrant flow at remote points, main drain test (sprinklers), alarm devices audibility test, fire door inspection, gas-suppression pressure/weight check, duct/kitchen hood cleaning as needed.","Annual: pump performance (flow/pressure curve), full sprinkler/hydrant test including deluge trip, detection loop test 100% of devices, foam concentrate lab test, extinguisher service, emergency lighting 3-h duration, passive fire-stopping survey, fire-drill with system use; 5-yearly: internal pipe inspection, pressure gauge calibration, hydrostatic test of hoses; 10-yearly CO2/clean-agent cylinder hydro test; extinguisher hydro test 3–5 years.","Construction sites: install standpipe/riser as floors rise (charged within two floors of work), temporary hydrants, extinguishers per floor and at hot-work; maintain fire tender access roads; protect systems from construction damage.","Impairment: authorise on tag/log; implement compensating measures; limit duration (same shift where possible); restore and test; close log; notify.","Keep records (ITM logs) for Fire Service/insurer; trend defects; replace obsolete components; update design basis on occupancy/process change.","Train ERT on hydrant/hose drill, pump operation, panel reset, foam branch use; monthly drills."],ppe:["ERT: fire kit, helmet, gloves, boots; SCBA"],stop:["Fire pump failed test/ unavailable without compensating measures","Water reserve below minimum","Main control valve found closed/unsupervised","Hot work planned during impairment without controls"],records:["Design basis & drawings, Fire NOC/insurer surveys, ITM logs (weekly/monthly/quarterly/annual/5-yr), impairment log, AMC reports, drill records, defect trend"],refs:{india:["NBC 2016 Part 4; IS 13039, IS 15105, IS 2189, IS 2190, IS 15683, IS 3844, IS 1641/1642/1644, IS 12349, IS 15325; TAC rules; Factories Act s.38 via state rules; OSH Code s.6; BOCW rules (fire protection); state fire acts/NOC conditions"],ka:["KA Factories Rule 66","Karnataka Fire Force Act 1964; KSFES NOC renewal inspections; BBMP high-rise fire conditions"],tn:["TN Factories Rule 61-A","TN Fire Service Act 1985; TNFRS fire licence/NOC; TN CDBR 2019 fire provisions"],osha:["1910 Subpart L (1910.155–165: extinguishers, standpipes, sprinklers, alarms); 1926 Subpart F; NFPA 25, 13, 14, 20, 72, 10, 241, 2001"],intl:["UK Regulatory Reform (Fire Safety) Order 2005; BS 9990/9251/5839; FM Global data sheets; ISO 45001 cl. 8.2"]},checklist:"cl-firesys"},

{id:"legionella",t:"Cooling Towers, Water Systems & Legionella Control",cat:"Health",tags:["Industrial","Health","Environment"],purpose:"Prevent Legionnaires' disease and water-system hazards (chemical dosing, drift, confined spaces) in cooling towers, evaporative condensers, hot and cold water systems and spray systems.",scope:"Industrial cooling towers, HVAC towers, evaporative condensers, hot-water systems, showers in camps/plants, humidifiers, water features, firewater tanks (stagnation).",roles:["Responsible person (water systems)","Water treatment contractor","Maintenance; confined-space entrants","Occupational physician"],hazards:["Legionella growth 20–45 °C in stagnant/biofilm water; aerosol from drift and showers; immunocompromised/older workers at risk","Biocide/acid/alkali dosing chemicals (chlorine, bromine, hypochlorite); confined-space entry into basins/tanks; falls on wet tower decks/ladders"],pre:["Written scheme/risk assessment: schematic of systems, dead legs identified, control measures, monitoring, roles; records for 5 years","Cooling towers: drift eliminators, accessible basins, biocide programme (oxidising + non-oxidising), corrosion/scale control, bleed-off, cleaning/disinfection at least 6-monthly (quarterly in heavy fouling), microbiological testing (TVC monthly, Legionella quarterly), action levels (Legionella ≥ 100 cfu/L review; ≥ 1,000 cfu/L immediate disinfection)","Hot/cold water: hot stored ≥ 60 °C, distributed ≥ 50 °C, cold < 20 °C; flush little-used outlets weekly; descale shower heads quarterly; TMVs maintained","Chemical dosing: bunded, labelled, SDS, PPE, eyewash; automated dosing with interlocks; no mixing of acids with hypochlorite","Confined-space procedures for basins/tanks; WAH for tower access"],steps:["Weekly: check tower operation, water treatment parameters (conductivity, pH, biocide residual), bleed, drift eliminators; flush infrequently used outlets.","Monthly: TVC sampling; temperature checks at sentinel taps (hot/cold); inspect tanks/tower condition; dosing equipment calibration.","Quarterly: Legionella sampling (towers; hot/cold where risk), shower-head cleaning, tower pack/basin inspection.","Six-monthly: tower cleaning & disinfection (chlorination ≥ 5–50 mg/L per method, contact time, neutralise before discharge to drain – SPCB limits), tank cleaning where sediment; review scheme.","Positive results: ≥ 1,000 cfu/L — immediate shock disinfection, re-sample, investigate; cluster of pneumonia cases — inform health authority, isolate system.","Shutdown/stagnation: drain or maintain circulation and biocide; before restart after > 1 week idle, clean/disinfect; firewater tanks on recirculation/chlorination schedule.","Chemical handling: PPE, spill kits, segregated storage; dosing room ventilation; never mix.","Records of all checks, results and actions; annual review of risk assessment; training for operators."],ppe:["Gloves, goggles/face shield for chemicals, respirator (FFP3) when cleaning towers/aerosol work, harness for tower access, boots"],stop:["Legionella ≥ 1,000 cfu/L untreated","Dosing failure/biocide residual absent for > 48 h","Entry into basin without confined-space controls","Discharge of disinfectant without neutralisation"],records:["Water-system schematics & risk assessment, treatment logs, sampling results, cleaning/disinfection certificates, dosing chemical SDS/inventory, incident/outbreak reports"],refs:{india:["OSH Code s.6 & s.24 (welfare water); Factories Act s.11/s.18 via state rules; Water Act (cooling tower blowdown/ disinfectant discharge consent); IS 10500 (drinking water); MoHFW guidance; HOWM (spent chemicals)"],ka:["KSPCB discharge consent for cooling tower blowdown; BBMP water supply standards"],tn:["TNPCB; CMWSSB; TN Public Health Act notification of disease clusters"],osha:["General Duty Clause; OSHA Technical Manual Section III Ch. 7 (Legionnaires' disease); 1910.146 for basins"],intl:["UK HSE L8 ACOP & HSG274 Parts 1–3; ASHRAE 188 & Guideline 12; EU Technical Guidelines for Legionella; WHO"]},checklist:"cl-legionella"}

 standing:[
  {id:"p-stopwork",t:"Stop Work Authority",purpose:"Every person has the authority and duty to stop any work they believe is unsafe, without fear of reprisal.",steps:["Stop: say 'STOP WORK' clearly; make the area safe (do not leave equipment in a dangerous state)","Notify: tell the supervisor/permit holder what you saw and why it is unsafe","Investigate: supervisor and safety officer assess; correct the condition or change the method","Resume: only when the hazard is controlled and the crew is re-briefed; the person who stopped the work is thanked and the event is logged","Follow-up: record in the stop-work register; trend monthly; recognise good calls; discipline retaliation"]},
  {id:"p-ptw",t:"Permit to Work",purpose:"Formal written control for high-risk, non-routine work.",steps:["Request with JSA; issuer walks down the site with the receiver","Isolations, gas tests, precautions and rescue arrangements completed and recorded","Both sign; permit displayed at the job and the control point; crew briefed and signed","Validity ≤ one shift; suspend on alarms or changed conditions; re-validate with re-check","Close-out inspection by issuer; de-isolation only after closure; file"]},
  {id:"p-loto",t:"Energy Isolation (LOTO)",purpose:"Zero-energy state before any work on equipment.",steps:["Identify all energy sources from the ECP","Shut down; isolate; lock and tag each point (personal lock); group lock box for crews","Release stored energy; block/support","Test for dead/zero energy (try-start, proved tester, gauges)","Work; shift handover with lock transfer; restore only by lock owners after head-count"]},
  {id:"p-tbt",t:"Daily Toolbox Talk / Pre-task Briefing",purpose:"Align the crew on the day's tasks, hazards, controls and permit conditions.",steps:["Supervisor gathers crew at start of shift (10–15 min) at the workface","Cover: tasks, hazards from JSA, permits, PPE, weather, emergency arrangements, lessons from yesterday","Ask questions; invite concerns; confirm understanding in the crew's language","Record topic and attendance (signatures); file with the permit","Repeat for new crews joining mid-shift or when the task changes"]},
  {id:"p-report",t:"Hazard, Near-Miss & Injury Reporting",purpose:"Capture every unsafe act/condition, near miss and injury so it can be fixed before it hurts someone.",steps:["Anyone can report: verbally to supervisor, observation card, QR/app, or safety officer — within the shift","No-blame rule for reporting; anonymous option available","Safety officer classifies (unsafe act/condition/near miss/injury) and assigns action with owner and date","High-potential near misses investigated like injuries (RCA within 72 h)","Feedback to the reporter; monthly trend review at the safety committee; recognise top reporters"]},
  {id:"p-bbs",t:"Safety Observation (Behaviour-Based Safety)",purpose:"Structured observation of work practices with immediate feedback.",steps:["Observer (trained; supervisor/peer) announces the observation; observes 10–15 min using the unsafe-acts/conditions categories","Stops imminent danger immediately; otherwise completes the observation","Gives feedback: recognise safe behaviour first, then discuss at-risk behaviour and barriers (why?)","Records on the observation card (no names for behaviours; names for recognition only)","Safety team trends categories weekly; removes barriers (equipment, procedure, training); publishes results"]},
  {id:"p-walk",t:"Management Safety Walk",purpose:"Visible leadership and verification of controls.",steps:["Site head/manager walks a defined area weekly with the safety officer","Talks to workers about their task, hazards and what would make it safer","Checks a sample: permits, PPE, housekeeping, isolation, emergency equipment","Records findings with owners/dates; closes last walk's actions","Shares positives and lessons at the next safety meeting"]},
  {id:"p-visitor",t:"Visitor & Vendor Control",purpose:"Keep visitors safe and out of hazardous areas.",steps:["Register at gate; ID; brief on site rules, emergency, PPE; sign visitor induction","Issue PPE; escort at all times; restricted-area access only with permit holder","Vehicles parked outside work zones; no photography in restricted areas unless approved","Sign out; PPE returned; emergency head-count includes visitors"]},
  {id:"p-driving",t:"Driving & Journey Management",purpose:"Prevent road and site vehicle incidents.",steps:["Licensed, fit drivers; vehicle inspected; seat belts for all; speed limits; no phones","Journey plan for trips > 2 h or at night: route, rest stops every 2 h, max 10 h driving/day, check-in calls","No driving 11 pm–5 am for long trips unless approved; fatigue management","Loads secured/covered; tippers never travel raised","Incident: stop, make safe, first aid, report to supervisor and police as required"]},
  {id:"p-drugs",t:"Alcohol & Drugs",purpose:"Zero tolerance for impairment at work.",steps:["No alcohol or illegal drugs on site; prescription medication affecting alertness to be declared","Random and for-cause testing where policy applies (breath test at gate)","Impaired person removed from work safely (not sent home alone if unsafe); recorded","Support/referral for dependency; disciplinary action per policy","Contractors bound by the same rule"]},
  {id:"p-weather",t:"Adverse Weather Triggers",purpose:"Pre-agreed stop/modify rules for weather.",steps:["Wind > 40 km/h (or crane limit ≈ 9–10 m/s): stop WAH on exposed areas, crane lifts, sheeting; secure loose materials","Lightning within 10 km / thunder heard: stop WAH, crane, scaffold, roof, water and electrical work; shelter in buildings/vehicles; resume 30 min after last thunder","Heavy rain / flood warning: stop excavation entry, inspect after; divert runoff; pump readiness; stop electrical outdoor work","Heat level red (IMD/WBGT): no heavy outdoor work at peak hours; water/rest/shade; buddy system","Cyclone warning (TN coast): secure cranes, lower loads, evacuate workers from low-lying camps, follow TNSDMA orders","Dense fog/smoke: restrict vehicle movement, lights on, marshals"]},

  {id:"p-pressure",t:"Pressure Testing (Hydro/Pneumatic)",purpose:"Prevent injuries from stored pressure energy.",steps:["Written test procedure; hydrotest preferred; pneumatic only with engineering approval and exclusion zone","Calibrated gauges (2), relief valve set ≤ 110% test pressure, vent lines","Barricade; nobody in line of flanges/plugs; pressurise in stages with holds; inspect at reduced pressure","Depressurise and drain before any adjustment; never tighten under pressure","Record test; release permit"]},

  {id:"p-consequence",t:"Consequence Management (fair and consistent)",purpose:"Respond to violations fairly, distinguishing error from recklessness.",steps:["Classify: unintentional error / at-risk shortcut tolerated by system / reckless disregard (just-culture test)","Error → coach and fix the system; at-risk → coach, remove incentive, re-train; reckless → disciplinary ladder (verbal, written, suspension, removal)","Life-Saving Rule breaches: removal from site pending investigation; supervisors accountable for tolerance","Recognise and reward safe behaviour and reporting equally visibly","Record consistently; review for fairness; apply to contractors and staff alike"]}

  {id:"e-spill",t:"Chemical / Oil Spill",trigger:"Loss of containment to ground, drain or water",steps:["Alert; isolate the source if safe (close valve, upright drum); remove ignition sources","PPE per SDS; contain with booms/absorbents/sand; block drains","Collect into labelled containers as hazardous waste; decontaminate area and PPE","Report: internal; SPCB forthwith for significant/off-site releases (HOWM Form 11; EP Act s.9)","Investigate and fix the cause (bund, valve, procedure)"],call:"ERT · SPCB regional office"},
  {id:"e-electric",t:"Electrocution / Electrical Contact",trigger:"Person in contact with electricity, electric shock, arc flash",steps:["Do NOT touch the casualty until the supply is isolated; switch off at the source or use a dry non-conductive object (LV only); HT: keep 10+ m away and call the utility/control room to isolate","Once safe: check response and breathing; CPR/AED if not breathing (electrical arrest responds well to defibrillation)","Treat burns (entry/exit wounds) by cooling and covering; treat for shock; immobilise if thrown/fallen","All electric-shock casualties to hospital for cardiac monitoring, even if they feel fine","Isolate and preserve the equipment; notify Electrical Inspector within 48 h (fatal: immediately)"],call:"108 · Electrical isolation (control room/CEIG/utility 1912)"},
  {id:"e-fall",t:"Fall from Height / Suspended Worker",trigger:"Worker fallen or hanging in harness",steps:["Call for rescue team and 108; do not let the suspended person hang: rescue within 10–15 min (MEWP, rescue kit, ladder, lower by controlled descent)","While waiting, tell them to move legs, push against a surface or stand in foot loops to keep blood circulating","After rescue, assess ABC; treat injuries; spinal precautions if fall > 2 m or mechanism suggests; lay flat and monitor (HSE: upright positioning no longer advised)","Fallen to ground: do not move unless in danger; stabilise head/neck; control bleeding; keep warm","Hospital for all falls > 2 m and all suspension events; retire the harness/lanyard; investigate"],call:"108 · Rescue team"},
  {id:"e-confined",t:"Confined Space Emergency",trigger:"Entrant collapsed, alarm, loss of communication",steps:["Attendant raises the alarm and calls the rescue team; does NOT enter","Attempt non-entry rescue: retrieval line/winch, ventilation to maximum, pass breathing air if available","Entry rescue only by trained team with SCBA and a second attendant; continuous gas monitoring","Once out: CPR/AED/oxygen as needed; treat for toxic exposure (hospital, SDS)","Preserve the space; investigate (atmosphere, isolation, permit); dangerous-occurrence notice 12 h"],call:"108 / 101 · Rescue team"},
  {id:"e-collapse",t:"Structural / Scaffold / Formwork Collapse",trigger:"Collapse, sudden movement, loud cracking",steps:["Evacuate the area and adjacent structures; sound the alarm; stop cranes and vehicles","Head-count immediately; identify trapped persons by last known location","Do not enter unstable debris; rescue only when the engineer/ERT confirms stability or with fire service USAR; shore as you go","First aid to the accessible injured; crush-injury precautions (medical team before releasing persons trapped > 15 min)","Preserve the scene; notify 12 h as dangerous occurrence; structural engineer review before any re-entry"],call:"112 / 101 (fire service rescue) · 108"},
  {id:"e-trench",t:"Excavation Collapse / Engulfment",trigger:"Trench wall failure with persons inside",steps:["Call 112/101/108; stop plant; keep everyone away from the edge — secondary collapse is likely","Do not jump in; locate the victim; if the head is clear, keep airway open and give air (hose/ventilation)","Dig by hand from the side with shoring installed progressively; never use the excavator near the victim","Treat crush/asphyxia on release; hospital","Dangerous-occurrence notice 12 h; investigate protective system failure"],call:"112 · 108"},
  {id:"e-crane",t:"Crane Overturn / Dropped Load / Contact with Power Line",trigger:"Crane instability, load drop, boom contact with lines",steps:["Clear the area; stop all other lifts; operator stays in cab if the crane contacts a live line (jump clear with feet together only if the crane is on fire)","Power line contact: keep everyone ≥ 10 m away; call the utility to de-energise; treat the ground as live","Casualties: first aid once the scene is safe; 108","Secure the crane (engineer/OEM); do not attempt to right it without a plan","Notify dangerous occurrence within 12 h; preserve LMI data and certificates"],call:"108 · Utility 1912 · Crane OEM"},
  {id:"e-vehicle",t:"Vehicle / Mobile Plant Accident",trigger:"Collision, overturn, run-over",steps:["Stop traffic; cones/marshals; switch off engines; fire risk check (fuel)","First aid: do not move casualties unless in danger; control bleeding; CPR if needed; 108","Pinned person: stabilise the vehicle (chocks/crane) before any lifting; medical team present for crush > 15 min","Police (100) for public-road accidents; preserve the scene; breath tests per policy","Report to RTO/insurer; internal investigation; dangerous occurrence if on site with injury"],call:"108 · 100"},
  {id:"e-drown",t:"Drowning / Man Overboard",trigger:"Person in water",steps:["Shout, throw a lifebuoy/line, keep eyes on the person; do not jump in unless trained with a flotation aid","Rescue boat/reach aid; pull the person out horizontally if possible","Not breathing: 5 rescue breaths then CPR 30:2 (breaths are vital in drowning); AED; remove wet clothes, keep warm","Breathing: recovery position; monitor; all submersion victims to hospital (delayed lung injury)","Coast guard 1554 for sea; report"],call:"108 · 1554 (coast guard)"},
  {id:"e-heat",t:"Heat Stroke",trigger:"Confusion, collapse, hot skin, no sweating, temperature > 40 °C",steps:["Call 108; move to shade; remove outer clothing","Cool aggressively: immerse in cool water, or douse with water and fan, ice packs to neck/armpits/groin; continue until help arrives","Conscious: sips of water/ORS; unconscious: recovery position, nothing by mouth","Monitor breathing; CPR if needed","Record heat level and work pattern; review schedule and acclimatisation"],call:"108"},
  {id:"e-snake",t:"Snake Bite",trigger:"Bite marks, swelling, pain, drooping eyelids, difficulty swallowing/breathing",steps:["Do it R.I.G.H.T.: Reassure; Immobilise the limb (splint, keep still, below heart level); Get to hospital with antivenom (108); Tell the doctor the symptoms","Remove rings, watches, tight clothing; note the time; photograph the snake only if safe — do not try to catch it","Do NOT: cut, suck, apply a tourniquet, ice, electric shock, herbal remedies, or give alcohol","Monitor breathing; if breathing weakens (neurotoxic), support with bag-valve mask if trained","Record; check the area for snakes; remove debris/rodent attractants"],call:"108 · Nearest hospital with antivenom (pre-identified)"},
  {id:"e-lightning",t:"Lightning",trigger:"Thunder heard / lightning within 10 km",steps:["Stop WAH, crane, scaffold, roof, electrical and water work; evacuate open areas, tall structures, trees, metal fences","Shelter in a building or closed metal vehicle; avoid phone lines, plumbing, open windows","If caught outside: crouch low with feet together away from tall objects; do not lie flat","Struck person: safe to touch; CPR/AED immediately (cardiac arrest is reversible); treat burns; hospital","Resume 30 min after the last thunder"],call:"108"},
  {id:"e-flood",t:"Flood / Cyclone / Storm",trigger:"IMD warning, rising water, state DMA alert",steps:["Activate the weather plan: secure cranes (free slew), lower loads, lash materials, stop WAH","Evacuate low-lying areas and camps to designated shelters; cut power to flood-prone DBs","Check excavations and cofferdams; pumps on; keep people out until inspected","Account for all persons; communication with district control room (1077)","After: inspect scaffolds, excavations, electrical and structures before resuming; snake/disease precautions"],call:"1077 · 112"},
  {id:"e-quake",t:"Earthquake",trigger:"Ground shaking",steps:["Indoors: DROP, COVER, HOLD ON under a sturdy table; away from glass; do not run outside during shaking; no lifts","Outdoors: move away from structures, scaffolds, cranes, lines; crouch","Plant operators: stop, lower loads, stay in cab until shaking stops","After: evacuate to open assembly point; expect aftershocks; check for gas leaks, fires, structural damage; do not re-enter until inspected","Head-count; first aid; report"],call:"112 · 1077"},
  {id:"e-bomb",t:"Bomb Threat / Suspicious Object",trigger:"Threat call, unattended suspicious package",steps:["Threat call: stay calm, note exact words, caller details, background sounds, time; do not hang up; alert security/site head","Do not touch or move suspicious objects; do not use radios/phones within 25 m","Evacuate as directed (route away from the object); assembly point at a safe distance","Police (100/112) and bomb squad; hand over information; follow their instructions","Return only on police all-clear; debrief"],call:"100 / 112"},
  {id:"e-unrest",t:"Civil Disturbance / Labour Unrest / Intruders",trigger:"Crowd at gate, violence, intrusion",steps:["Security secures gates; non-essential workers withdrawn to safe area; no confrontation","Inform police (100) and site head; protect lives first, property second","Safe shutdown of hazardous processes if the site may be entered; isolate fuel/chemicals; secure explosives","Account for persons; medical aid; record events (CCTV)","Management/HR engage through recognised channels; resume on police advice"],call:"100 / 112"},
  {id:"e-power",t:"Power Failure",trigger:"Loss of supply during operations",steps:["Emergency lighting and DG start; check critical loads (fire pumps, ventilation, hoists, confined-space fans)","Stop confined-space work if ventilation lost; evacuate; stop hot work in process areas if F&G lost","Persons in lifts/hoists: communicate; rescue by trained persons","Treat all circuits as live for restoration; check interlocks before restart","Log and investigate"],call:"Electrical in-charge · Utility 1912"},
  {id:"e-explosion",t:"Explosion",trigger:"Blast, dust/gas/vessel explosion",steps:["Evacuate; expect secondary explosions and fire; move upwind","Alarm; 112/101/108; ERT only with PPE assesses","Isolate fuel, gas, electricity if safe; account for persons","Triage casualties (blast lung, burns, fragments); hospital","Preserve the scene; dangerous occurrence 12 h; MSIHC 48 h"],call:"112 / 101 / 108"},
  {id:"e-radiation",t:"Radiation Source Incident",trigger:"Stuck/lost source, high survey reading",steps:["Clear the area; extend the cordon (survey meter boundary 1 µSv/h or as RSO directs)","Only RSO/qualified radiographers approach; retrieval with tongs/shielding; never touch a source","Lost source: secure the area, call AERB and police immediately; search with meters","Exposed persons: record dose, medical evaluation","Report to AERB within 24 h; investigate"],call:"AERB 24×7 · 100"},
  {id:"e-burn",t:"Burns – Bitumen / Molten Metal / Steam",trigger:"Contact with hot material",steps:["Cool with cool running water for 20 min (start immediately; effective up to 3 h); leave adhered bitumen/metal on skin","Remove clothing/jewellery not stuck to the burn; cover with cling film or non-fluffy dressing; keep warm","No ice, butter, toothpaste, ointments; do not burst blisters","Call 108 for burns larger than the palm, face/hands/genitals, full thickness, inhalation or electrical burns","Burns-centre tie-up; record; investigate"],call:"108 · Burns centre"},
  {id:"e-pandemic",t:"Infectious Disease Outbreak",trigger:"Cluster of fever/respiratory cases; health authority alert",steps:["Isolate symptomatic persons; masks; medical assessment; inform District Health Officer","Screening at gate; hygiene stations; ventilation; stagger shifts; limit gatherings","Contact tracing; quarantine arrangements in camp; sanitisation","Follow MoHFW/State advisories; communicate daily in local languages","Record; review welfare and camp density"],call:"104 (health helpline) · District Health Officer"}
 ]
};

const FIRSTAID = {
 principles:[
  ["DRSABCD","Danger – Response – Send for help (108/112) – Airway – Breathing – CPR – Defibrillation. Use it in every emergency; your own safety first."],
  ["Primary survey","Life threats in order: catastrophic bleeding → airway → breathing → circulation → disability (consciousness) → exposure/environment."],
  ["Call early","Call 108/112 before starting CPR if alone with an adult; send a runner to guide the ambulance to the exact gate."],
  ["Recovery position","Unconscious but breathing: on the side, head tilted back, mouth downward, knee bent to stabilise; monitor breathing every minute."],
  ["Consent & records","Introduce yourself; get consent from a conscious casualty; record time, findings, treatment, vital signs; hand over using MIST (Mechanism, Injuries, Signs, Treatment)."],
  ["Infection control","Gloves, barrier mask/face shield for breaths, sharps in containers, hand hygiene; needle-stick: wash, report, post-exposure protocol."]
 ],
 topics:[
  {id:"fa-cpr",t:"Cardiac arrest – CPR & AED (adult)",cat:"Life-threatening",recognise:["Unresponsive and not breathing normally (gasping = not breathing)","Check ≤ 10 seconds"],do:["Call 108/112, send for the AED","30 chest compressions: centre of chest, 5–6 cm deep, 100–120/min, full recoil; then 2 breaths (1 s each, chest rise) — ratio 30:2","Hands-only CPR if unable/unwilling to give breaths","AED as soon as it arrives: switch on, follow voice prompts, attach pads to bare dry chest, nobody touches during analysis/shock, resume CPR immediately after","Continue until the casualty breathes normally, help takes over, or you are exhausted; swap rescuers every 2 min"],dont:["Don't delay compressions to find a pulse","Don't stop to check unless the casualty moves/breathes"],hospital:"Always — every arrest goes to hospital by ambulance"},
  {id:"fa-cpr-child",t:"CPR – child & infant",cat:"Life-threatening",recognise:["Unresponsive, not breathing normally"],do:["Child (1 yr–puberty): 5 initial rescue breaths, then 30:2 (15:2 with two trained rescuers); compress 1/3 chest depth (~5 cm) with one or two hands","Infant (< 1 yr): 5 initial breaths, then 30:2 (15:2 two rescuers); two fingers or two-thumb encircling, 4 cm depth; cover mouth and nose with your mouth","If alone, do 1 min of CPR before calling 108 (unless a phone is at hand)","AED with paediatric pads/mode if available; adult pads if not (child > 1 yr)"],dont:["Don't use abdominal thrusts on infants (choking)"],hospital:"Always"},
  {id:"fa-choke",t:"Choking",cat:"Life-threatening",recognise:["Clutching throat, cannot speak/cough/breathe, cyanosis"],do:["Mild (can cough): encourage coughing; stay with them","Severe adult/child: 5 back blows between shoulder blades (heel of hand), then 5 abdominal thrusts (fist above navel, pull inward and upward); alternate 5 and 5","Infant: 5 back blows (face down along forearm) then 5 chest thrusts (two fingers); no abdominal thrusts","Unresponsive: start CPR; check mouth before breaths and remove visible objects"],dont:["Don't do blind finger sweeps"],hospital:"After abdominal thrusts (internal injury check) or if symptoms persist"},
  {id:"fa-bleed",t:"Severe bleeding",cat:"Life-threatening",recognise:["Spurting/pooling blood, soaked dressings, pale/cold/clammy, confusion"],do:["Gloves; expose the wound; apply firm direct pressure with a sterile pad; if it soaks through, add more on top — don't remove","Limb life-threatening bleed not controlled by pressure: apply a tourniquet 5–7 cm above the wound (not over a joint), tighten until bleeding stops, note the time, do not loosen","Junctional wounds (groin/armpit/neck): pack the wound with haemostatic or plain gauze and hold pressure ≥ 3 min","Lay the casualty down, raise legs, keep warm (shock); nothing by mouth","Embedded objects: do not remove; pad around them"],dont:["Don't apply a tourniquet for minor bleeding","Don't remove the first dressing"],hospital:"Always for severe bleeding, tourniquet use, or embedded objects"},
  {id:"fa-shock",t:"Shock (circulatory)",cat:"Life-threatening",recognise:["Pale, cold, clammy skin; rapid weak pulse; fast breathing; thirst; dizziness; confusion; collapse"],do:["Treat the cause (bleeding, burns, allergic reaction)","Lay flat; raise legs 20–30 cm if no injury prevents; loosen tight clothing; keep warm (blanket under and over)","Reassure; monitor breathing and response every few minutes; recovery position if unconscious","Call 108"],dont:["Don't give food or drink","Don't apply direct heat"],hospital:"Always"},
  {id:"fa-anaphylaxis",t:"Anaphylaxis (severe allergic reaction)",cat:"Life-threatening",recognise:["Swelling of face/lips/tongue, wheeze/difficulty breathing, hives, collapse after sting, food, drug or chemical exposure"],do:["Call 108","Adrenaline auto-injector (0.5 mg IM, outer thigh, adult) if the casualty has one or the OHC stocks it; repeat after 5 min if no improvement","Lie flat with legs raised; sit up if breathing is difficult; do not stand them up suddenly","CPR if unresponsive and not breathing"],dont:["Don't wait to see if it improves"],hospital:"Always, even after improvement (rebound reactions)"},
  {id:"fa-heart",t:"Heart attack",cat:"Life-threatening",recognise:["Central chest pressure/pain spreading to arm/jaw/back, sweating, nausea, breathlessness; may be mild in diabetics/women"],do:["Call 108; keep calm and rested in a half-sitting 'W' position","If available and not allergic/bleeding risk: chew one aspirin 300 mg (or as advised by the ambulance)","Assist with their own prescribed nitrate spray/tablet if they have it","AED on standby; CPR if they collapse"],dont:["Don't let them walk or drive"],hospital:"Always, by ambulance"},
  {id:"fa-stroke",t:"Stroke",cat:"Life-threatening",recognise:["FAST: Face drooping, Arm weakness, Speech difficulty, Time to call 108; also sudden confusion, vision loss, severe headache, loss of balance"],do:["Call 108 immediately; note the time symptoms started (treatment is time-critical)","Keep comfortable, head and shoulders slightly raised; recovery position if unconscious","Reassure; loosen clothing; monitor breathing"],dont:["Nothing by mouth (swallowing may be affected)"],hospital:"Always, stroke-ready hospital"},
  {id:"fa-burn",t:"Thermal burns & scalds",cat:"Injuries",recognise:["Red, blistered, charred or white/leathery skin; pain (may be absent in deep burns)"],do:["Stop the burning (stop-drop-roll; smother flames); remove from steam/heat","Cool with cool (not ice-cold) running water for 20 minutes — effective up to 3 hours after the burn","Remove clothing, watches, rings not stuck to the skin","Cover loosely with cling film (lengthwise) or a clean non-fluffy dressing; keep the casualty warm","Bitumen/molten metal: cool, leave the material on the skin, cover; hospital will remove"],dont:["No ice, butter, toothpaste, ointments, cotton wool","Don't burst blisters","Don't cool large burns so long that the casualty becomes cold (hypothermia risk)"],hospital:"Burn larger than the casualty's palm, any full-thickness burn, burns to face/hands/feet/genitals/joints, circumferential burns, inhalation (smoke, hoarse voice), electrical or chemical burns, children"},
  {id:"fa-chemburn",t:"Chemical burns & splashes (skin and eyes)",cat:"Chemical",recognise:["Pain, redness, blistering after contact; eye pain, redness, watering, inability to open"],do:["Protect yourself (gloves, goggles); brush off dry powder before wetting","Remove contaminated clothing while flushing","Flush with copious running water ≥ 20 min (alkalis and HF longer); eyes: hold lids open, flush from the nose outward for ≥ 15–20 min and continue en route to hospital; remove contact lenses","Hydrofluoric acid: after flushing, apply 2.5% calcium gluconate gel and massage continuously; hospital urgently (even small HF burns can be fatal)","Take the SDS/label with the casualty"],dont:["Don't neutralise with other chemicals","Don't delay flushing to find the SDS"],hospital:"All chemical eye injuries; HF, phenol, strong acid/alkali burns; any burn larger than a coin"},
  {id:"fa-elec",t:"Electric shock & electrical burns",cat:"Injuries",recognise:["Contact with electricity; burns at entry/exit; unconsciousness; irregular pulse; muscle pain"],do:["Isolate the supply first; for LV use a dry non-conductive object to separate; HT – stay ≥ 10 m away and wait for isolation","Check response/breathing; CPR/AED immediately if not breathing","Cool and cover burns; treat shock; immobilise if fallen"],dont:["Don't touch the casualty while in contact with the source","Don't assume a 'minor' shock is harmless"],hospital:"All shocks from mains/HT: cardiac monitoring; all electrical burns"},
  {id:"fa-fracture",t:"Fractures, dislocations & spinal injury",cat:"Injuries",recognise:["Pain, swelling, deformity, loss of function, grating; spinal: neck/back pain, numbness/tingling, weakness after a fall or high-energy impact"],do:["Keep still; support the injured part in the position found (hands, padding, splint to the body or adjacent limb)","Open fracture: cover with a sterile dressing; control bleeding without pressing on bone","Check circulation beyond the injury (colour, warmth, pulse) before and after splinting","Suspected spinal injury: do not move unless in danger or airway at risk; hold the head in line (manual in-line stabilisation); log-roll with 3–4 people only if essential; unconscious + breathing → careful recovery position maintaining alignment","Cold pack over clothing for swelling"],dont:["Don't straighten, push back or 'test' the limb","Don't give food/drink (surgery likely)"],hospital:"All suspected fractures, dislocations and spinal injuries by ambulance (spinal board/collar for spinal)"},
  {id:"fa-head",t:"Head injury & concussion",cat:"Injuries",recognise:["Blow to the head; headache, nausea/vomiting, dizziness, confusion, drowsiness, unequal pupils, seizure, clear fluid from nose/ear, loss of consciousness (even brief)"],do:["Rest; monitor response (AVPU) every 10 min; apply cold pack to bruising; control scalp bleeding with pressure","Suspect neck injury with any significant head injury — keep head still","Recovery position if unconscious and breathing"],dont:["No alcohol, sedatives or painkillers that mask symptoms","Don't leave alone for 24 h; don't return to work the same day after loss of consciousness"],hospital:"Any loss of consciousness, vomiting, worsening headache, drowsiness, seizure, fluid from ears/nose, unequal pupils, blood-thinner use, or mechanism of fall > 1 m"},
  {id:"fa-eye",t:"Eye injuries (foreign body, welding flash, penetrating)",cat:"Injuries",recognise:["Pain, watering, redness, light sensitivity; arc eye appears 6–12 h after unprotected welding exposure"],do:["Loose foreign body: don't rub; blink; flush with clean water/saline from nose outward; lift the upper lid over the lower","Embedded object/penetrating injury: do not remove or press; cover with a rigid shield/cup, cover both eyes to limit movement, lie the casualty down","Welding flash (arc eye): cool compress, dark room, eye drops only on medical advice, medical assessment","Chemical: see chemical splash — flush 20 min"],dont:["Don't remove embedded objects","Don't let the casualty rub"],hospital:"Embedded objects, chemical splash, persistent pain/vision change, arc eye not settling in 24 h"},
  {id:"fa-amput",t:"Amputation & severed parts",cat:"Injuries",recognise:["Traumatic loss of finger/hand/limb"],do:["Control bleeding (pressure, then tourniquet if needed; note the time); treat shock; 108","Severed part: rinse gently if dirty, wrap in sterile gauze moistened with saline, seal in a plastic bag, place the bag in a container of ice-water (not directly on ice); label with name/time; send with the casualty","Partial amputation: splint in position; do not twist"],dont:["Don't put the part directly on ice or in water"],hospital:"Immediately — reattachment is time-critical (hours)"},
  {id:"fa-crush",t:"Crush injury & entrapment",cat:"Injuries",recognise:["Trapped under load/structure/soil; pain, swelling, numbness; risk of crush syndrome after release"],do:["Call 108/112; make the scene safe; if trapped < 15 min, release quickly if safe; if trapped ≥ 15 min, do not release until a medical team is present (crush syndrome can cause cardiac arrest on release)","Control bleeding; treat shock; keep warm; monitor","Give nothing by mouth; record time of entrapment"],dont:["Don't apply a tourniquet to a crushed limb unless catastrophic bleeding"],hospital:"Always"},
  {id:"fa-inject",t:"High-pressure injection injury (airless paint, hydraulic fluid, grease gun)",cat:"Injuries",recognise:["Small puncture wound, often painless at first; swelling later; history of high-pressure jet"],do:["Treat as a surgical emergency even if it looks trivial: 108/hospital immediately","Elevate; cover loosely; take the SDS of the fluid"],dont:["Don't squeeze, apply cold, or dismiss"],hospital:"Always — surgical decompression within hours prevents amputation"},
  {id:"fa-suspension",t:"Fall arrest / suspension trauma",cat:"Injuries",recognise:["Worker hanging in harness; faintness, nausea, numb legs after minutes"],do:["Rescue within 10–15 min; keep them conscious; encourage leg movement/standing in loops","After rescue: ABC; treat injuries; lay flat (HSE: no need to keep upright); monitor; spinal precautions if indicated"],dont:["Don't leave hanging while 'waiting for the ambulance'"],hospital:"All suspension events"},
  {id:"fa-wound",t:"Minor wounds, splinters, sprains & strains",cat:"Minor",recognise:["Cuts, abrasions, puncture wounds; sprain: pain/swelling at a joint; strain: muscle pain"],do:["Wash hands/gloves; clean the wound with running water; remove loose dirt; antiseptic; sterile dressing; record in the first-aid register","Splinters: remove with clean tweezers if protruding; otherwise leave for medical removal","Sprains: PRICE — Protect, Rest, Ice (15–20 min, wrapped), Compression, Elevation; medical if unable to bear weight or deformity","Check tetanus vaccination status for contaminated wounds (rusty metal, soil)"],dont:["Don't use cotton wool on open wounds","Don't apply heat in the first 48 h for sprains"],hospital:"Deep/gaping wounds (may need stitches within 6–8 h), puncture wounds, bites, signs of infection, tetanus risk"},
  {id:"fa-heat",t:"Heat exhaustion & heat stroke",cat:"Environmental",recognise:["Exhaustion: heavy sweating, cramps, headache, dizziness, nausea, pale clammy skin. Stroke (emergency): confusion, hot skin (dry or wet), temperature > 40 °C, collapse, seizures"],do:["Move to shade/cool area; lie down; loosen clothing","Exhaustion: cool with water spray/fanning, cold packs; sips of water/ORS; rest; no return to work that day","Stroke: call 108; cool aggressively — immersion in cool water or continuous dousing with fanning; ice packs to neck, armpits, groin; recovery position if unconscious"],dont:["Don't give fluids to a confused/unconscious casualty","Don't give salt tablets"],hospital:"Any heat stroke; heat exhaustion not improving in 30 min"},
  {id:"fa-cold",t:"Hypothermia",cat:"Environmental",recognise:["Shivering, confusion, slurred speech, drowsiness after cold water immersion, cold storage, high altitude"],do:["Move to shelter; remove wet clothing; insulate (blankets, foil) incl. head; warm the trunk gradually","Conscious: warm sweet drinks; handle gently (rough handling can trigger arrhythmia)","CPR if not breathing — continue for longer than usual"],dont:["No alcohol; no direct heat (hot water bottles on skin); don't rub limbs"],hospital:"Moderate/severe cases"},
  {id:"fa-drown",t:"Drowning",cat:"Environmental",recognise:["Rescued from water; not breathing or coughing/breathless"],do:["Rescue safely (reach, throw, boat); remove from water, keep horizontal if possible","Not breathing: 5 initial rescue breaths, then CPR 30:2; AED (dry chest first)","Breathing: recovery position; remove wet clothing; warm","Hospital for all submersion victims (secondary drowning hours later)"],dont:["Don't try to drain water from the lungs","Don't do abdominal thrusts"],hospital:"Always"},
  {id:"fa-snake",t:"Snake bite",cat:"Bites & stings",recognise:["Fang marks, pain/swelling (viper); drooping eyelids, difficulty swallowing/breathing, blurred vision (cobra/krait); bleeding from gums (viper); dark urine"],do:["R.I.G.H.T.: Reassure; Immobilise the limb with a splint and keep still (as for a fracture); Get to hospital with antivenom by 108; Tell the doctor the symptoms and time","Remove rings/tight items; keep the limb below heart level; carry the casualty — don't let them walk","Monitor breathing; support ventilation (bag-valve mask) if trained and breathing fails"],dont:["No tourniquet, cutting, sucking, ice, electric shock, herbal pastes, alcohol","Don't waste time catching the snake"],hospital:"Always — antivenom only in hospital; even painless bites (krait) can be fatal"},
  {id:"fa-sting",t:"Scorpion, bee/wasp, spider & centipede",cat:"Bites & stings",recognise:["Local pain/swelling; scorpion red flags: profuse sweating, vomiting, rapid heart rate, breathlessness, priapism; multiple bee stings → systemic reaction"],do:["Remove bee stings by scraping (card/nail); cold pack 10–15 min; elevate; antihistamine/paracetamol per OHC","Scorpion: cold pack, immobilise, hospital — doctor may give prazosin; monitor breathing","Watch for anaphylaxis — see anaphylaxis"],dont:["Don't squeeze stings","Don't apply tourniquets"],hospital:"Scorpion with systemic signs; > 10 bee stings; stings in mouth/throat; any anaphylaxis"},
  {id:"fa-animal",t:"Dog, monkey & other animal bites (rabies)",cat:"Bites & stings",recognise:["Bite, scratch or lick on broken skin by dog, cat, monkey, bat, cattle"],do:["Wash the wound with soap and running water for 15 min; apply povidone-iodine","Cover loosely; do not suture","Hospital the same day for rabies post-exposure vaccination ± immunoglobulin (category II/III) and tetanus"],dont:["Don't delay PEP — rabies is 100% fatal once symptoms start","Don't apply chilli, lime or herbal remedies"],hospital:"Always"},
  {id:"fa-inhal",t:"Chemical inhalation (chlorine, ammonia, CO, H2S, solvent, smoke)",cat:"Chemical",recognise:["Coughing, breathlessness, chest tightness, burning eyes/throat, headache, dizziness, confusion, collapse"],do:["Rescuer safety first: SCBA for H2S/unknown atmospheres; otherwise move the casualty to fresh air upwind","Sit upright if breathing is difficult; loosen clothing; oxygen if trained and available","Not breathing: CPR with a barrier device (avoid mouth-to-mouth for cyanide/pesticides); AED","Eye/skin exposure: flush","CO: 100% oxygen; hospital even if recovered (delayed effects); chlorine/NOx/phosgene: observe 24–48 h for delayed lung oedema"],dont:["Don't enter a confined space or gas cloud without BA"],hospital:"All significant inhalations; take the SDS"},

const INC_J=["Karnataka","Tamil Nadu","India – other state / central sphere","USA (OSHA)","UK"];
const INC_EV=["Fatal accident","Serious injury (absent ≥ 48 h / hospitalised)","Dangerous occurrence (no injury)","Occupational disease","Major chemical accident / release","Electrical accident","Boiler / pressure vessel accident","Environmental spill / discharge","Petroleum / explosives / cylinder incident","Radiation incident","Lift / hoist accident"];
function incMatch(j,ev){
 const rows=[];const add=(f)=>REPORTING.filter(f).forEach(r=>rows.push(r));
 const ind=j!=="USA (OSHA)"&&j!=="UK";
 if(j==="USA (OSHA)"){if(ev.startsWith("Fatal"))add(r=>r.ev==="Work-related fatality");else if(ev.startsWith("Serious"))add(r=>r.ev.startsWith("In-patient"));else add(r=>r.j==="USA (OSHA)");return rows}
 if(j==="UK"){if(ev.startsWith("Fatal")||ev.startsWith("Dangerous")||ev.startsWith("Serious"))add(r=>r.j==="UK");return rows}
 if(ev.startsWith("Fatal")){add(r=>r.ev==="Fatal accident");if(j==="Karnataka")add(r=>r.j==="Karnataka"&&r.ev.startsWith("Factory"));if(j==="Tamil Nadu")add(r=>r.j==="Tamil Nadu"&&r.ev.startsWith("Factory"));add(r=>r.ev.startsWith("Construction site"));add(r=>r.ev.startsWith("Fatal accident – comp"));add(r=>r.ev.startsWith("Employee injured"))}
 if(ev.startsWith("Serious")){add(r=>r.ev.startsWith("Injury preventing"));if(j==="Karnataka")add(r=>r.j==="Karnataka"&&r.ev.startsWith("Factory"));if(j==="Tamil Nadu")add(r=>r.j==="Tamil Nadu"&&r.ev.startsWith("Factory"));add(r=>r.ev.startsWith("Employee injured"))}
 if(ev.startsWith("Dangerous"))add(r=>r.ev.startsWith("Dangerous occurrence"));
 if(ev.startsWith("Occupational"))add(r=>r.ev.startsWith("Occupational disease"));
 if(ev.startsWith("Major chemical")){add(r=>r.ev.startsWith("Major chemical"));add(r=>r.ev.startsWith("Dangerous occurrence"));add(r=>r.ev.startsWith("Hazardous waste"));add(r=>r.ev.startsWith("Accidental discharge"))}
 if(ev.startsWith("Electrical")){add(r=>r.ev.startsWith("Electrical accident"));add(r=>r.ev.startsWith("Dangerous occurrence"))}
 if(ev.startsWith("Boiler")){add(r=>r.ev.startsWith("Boiler"));add(r=>r.ev.startsWith("Dangerous occurrence"))}
 if(ev.startsWith("Environmental")){add(r=>r.ev.startsWith("Accidental discharge"));add(r=>r.ev.startsWith("Hazardous waste"))}
 if(ev.startsWith("Petroleum")){add(r=>r.ev.startsWith("Accident at petroleum"));add(r=>r.ev.startsWith("Dangerous occurrence"))}
 if(ev.startsWith("Radiation"))add(r=>r.ev.startsWith("Radiation"));
 if(ev.startsWith("Lift")){add(r=>r.ev.startsWith("Lift/escalator"));add(r=>r.ev.startsWith("Dangerous occurrence"))}
 if(ind&&(ev.startsWith("Fatal")||ev.startsWith("Serious"))&&!rows.some(r=>r.ev.startsWith("Fatal accident")||r.ev.startsWith("Injury")))add(r=>r.ev==="Fatal accident");
 return rows;
}

/* ---------- OBSERVATION CARD ---------- */
function observe(){
 const log=store.get("obs",[]);const now=new Date();const pad=n=>String(n).padStart(2,"0");
 const opts=(src)=>src.map(c=>`<optgroup label="${esc(c.cat)}">${c.items.map(x=>`<option>${esc(x)}</option>`).join("")}</optgroup>`).join("");
 const stats=()=>{if(!log.length)return '<div class="empty">No observations recorded on this device yet.</div>';const byCat={};log.forEach(o=>{const k=o.type+": "+o.cat;byCat[k]=(byCat[k]||0)+1});const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,8);const acts=log.filter(o=>o.type==="Unsafe act").length,conds=log.filter(o=>o.type==="Unsafe condition").length,safe=log.filter(o=>o.type==="Safe behaviour").length;const open=log.filter(o=>o.status!=="Closed").length;
  return `<div class="tiles"><div class="tile"><span class="big">${log.length}</span><span class="lbl">observations</span></div><div class="tile"><span class="big">${acts}</span><span class="lbl">unsafe acts</span></div><div class="tile"><span class="big">${conds}</span><span class="lbl">unsafe conditions</span></div><div class="tile"><span class="big">${safe}</span><span class="lbl">safe behaviours</span></div><div class="tile"><span class="big" style="color:${open?"var(--warn)":"var(--good)"}">${open}</span><span class="lbl">open actions</span></div></div><div class="tbl" style="margin-top:10px"><table><thead><tr><th>Top categories</th><th>Count</th></tr></thead><tbody>${top.map(([k,n])=>`<tr><td>${esc(k)}</td><td class="mono">${n}</td></tr>`).join("")}</tbody></table></div>`};
 return `<div><h2>Safety observation card</h2><p class="lead">Record an unsafe act, unsafe condition or safe behaviour, rate it, note what was done on the spot and generate the card text for your register or WhatsApp group. The log stays on this device; copy it out for the safety committee.</p></div>
 <div class="card"><div class="form">
  <div class="f"><label for="oType">Type</label><select id="oType"><option>Unsafe act</option><option>Unsafe condition</option><option>Safe behaviour</option></select></div>
  <div class="f"><label for="oItem">What was observed</label><select id="oItem">${opts(UNSAFE.acts)}</select></div>
  <div class="f wide"><label for="oDesc">Details (who/what/where — no names for behaviours)</label><textarea id="oDesc"></textarea></div>
  <div class="f"><label for="oDate">Date & time</label><input id="oDate" type="datetime-local" value="${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}"></div>
  <div class="f"><label for="oLoc">Location / area</label><input id="oLoc"></div>
  <div class="f"><label for="oContractor">Contractor / department</label><input id="oContractor"></div>
  <div class="f"><label for="oObs">Observer</label><input id="oObs"></div>
  <div class="f"><label for="oSev">Risk rating</label><select id="oSev"><option>Low</option><option>Medium</option><option selected>High</option><option>Imminent danger (work stopped)</option></select></div>
  <div class="f"><label for="oAction">Immediate action</label><select id="oAction"><option>Corrected on the spot</option><option>Work stopped</option><option>Barricaded / tagged out</option><option>Person coached</option><option>Reported to supervisor</option><option>Recognised (safe behaviour)</option></select></div>
  <div class="f"><label for="oCause">Likely cause</label><select id="oCause"><option>Lack of knowledge/skill</option><option>Shortcut / production pressure</option><option>Fatigue / capability</option><option>Equipment or environment inadequate</option><option>Procedure or supervision inadequate</option><option>Management system gap</option><option>N/A (safe behaviour)</option></select></div>
  <div class="f"><label for="oCapa">Corrective action</label><input id="oCapa"></div>
  <div class="f"><label for="oOwner">Action owner</label><input id="oOwner"></div>
  <div class="f"><label for="oDue">Due date</label><input id="oDue" type="date"></div>
  <div class="f"><label for="oStatus">Status</label><select id="oStatus"><option>Open</option><option>Closed</option></select></div>
  <div class="f wide"><label for="oPhoto">Photo (optional — opens the camera on phones)</label><input id="oPhoto" type="file" accept="image/*" capture="environment"><img id="oPhotoPrev" class="photoprev" hidden alt="Observation photo preview"></div>
 </div><div class="row" style="margin-top:12px"><button class="btn primary" id="oSave">Save to log</button><button class="btn" id="oShare">Share card</button><button class="btn" id="oCopy">Copy card text</button><button class="btn" id="oExport">Copy full log (CSV)</button><button class="btn" id="oClear">Clear log</button></div>
 <div class="out" id="oOut" style="margin-top:12px">Fill the card and press Copy or Save.</div></div>
 <div class="card"><h3>Observation log (this device)</h3><div style="margin-top:10px" id="oStats">${stats()}</div>
 ${log.length?`<div class="tbl" style="margin-top:10px"><table><thead><tr><th>Photo</th><th>Date</th><th>Type</th><th>Observation</th><th>Rating</th><th>Action</th><th>Status</th></tr></thead><tbody>${log.slice().reverse().slice(0,50).map((o,i)=>`<tr><td>${(()=>{const im=o.id?store.get("obsimg:"+o.id,null):null;return im?`<img class="obsthumb" src="${im}" alt="Photo of observation">`:'<span class="meta">—</span>'})()}</td><td class="mono">${esc(o.date)}</td><td>${esc(o.type)}</td><td>${esc(o.item)}<div class="meta">${esc(o.loc)} ${esc(o.contractor)}</div></td><td>${esc(o.sev)}</td><td>${esc(o.action)}<div class="meta">${esc(o.capa)}</div></td><td><button class="btn sm" data-toggle="${log.length-1-i}">${o.status==="Closed"?"Closed ✓":"Open → close"}</button></td></tr>`).join("")}</tbody></table></div>`:""}
 </div>`;
}
function bindObserve(){
 const type=$("#oType"),item=$("#oItem");const opts=(src)=>src.map(c=>`<optgroup label="${esc(c.cat)}">${c.items.map(x=>`<option>${esc(x)}</option>`).join("")}</optgroup>`).join("");
 type.addEventListener("change",()=>{item.innerHTML=type.value==="Unsafe condition"?opts(UNSAFE.conditions):type.value==="Safe behaviour"?opts([{cat:"Safe behaviours",items:["Correct PPE worn and inspected","Tied off 100% at height","Permit obtained and displayed","Proper isolation verified","Good housekeeping / clean-as-you-go","Banksman used for reversing","Load controlled with tag lines","Hazard reported / work stopped appropriately","Correct manual-handling technique","Toolbox talk delivered well","Guard/safety device in use","Hydration and rest breaks taken"]}]):opts(UNSAFE.acts)});
 const g=id=>$("#"+id).value.trim();const catOf=()=>{const o=item.selectedOptions[0];return o&&o.parentElement.tagName==="OPTGROUP"?o.parentElement.label:""};
 const text=()=>["SAFETY OBSERVATION CARD","Type: "+g("oType")+"   Category: "+catOf(),"Observation: "+g("oItem"),"Details: "+(g("oDesc")||"—"),"Date/time: "+g("oDate")+"   Location: "+(g("oLoc")||"—")+"   Contractor/dept: "+(g("oContractor")||"—"),"Observer: "+(g("oObs")||"—")+"   Rating: "+g("oSev"),"Immediate action: "+g("oAction"),"Likely cause: "+g("oCause"),"Corrective action: "+(g("oCapa")||"—")+"   Owner: "+(g("oOwner")||"—")+"   Due: "+(g("oDue")||"—")+"   Status: "+g("oStatus")].join("\n");
 let photo=null;
 $("#oPhoto").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const max=1024,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);photo=c.toDataURL("image/jpeg",0.6);const pv=$("#oPhotoPrev");pv.src=photo;pv.hidden=false};img.src=rd.result};rd.readAsDataURL(f)});
 $("#oCopy").addEventListener("click",()=>{$("#oOut").textContent=text();copy(text())});
 $("#oShare").addEventListener("click",async()=>{const t=text();$("#oOut").textContent=t;try{if(photo&&navigator.canShare){const blob=await (await fetch(photo)).blob();const file=new File([blob],"observation.jpg",{type:"image/jpeg"});if(navigator.canShare({files:[file]})){await navigator.share({title:"Safety observation",text:t,files:[file]});return}}}catch(e){if(e&&e.name==="AbortError")return}share(t,"Safety observation")});
 $("#oSave").addEventListener("click",()=>{const log=store.get("obs",[]);log.push({type:g("oType"),cat:catOf(),item:g("oItem"),desc:g("oDesc"),date:g("oDate"),loc:g("oLoc"),contractor:g("oContractor"),obs:g("oObs"),sev:g("oSev"),action:g("oAction"),cause:g("oCause"),capa:g("oCapa"),owner:g("oOwner"),due:g("oDue"),status:g("oStatus"),id:Date.now()});const rec=log[log.length-1];if(photo){try{localStorage.setItem("sw:obsimg:"+rec.id,JSON.stringify(photo))}catch(e){toast("Storage full — saved without photo");}}store.set("obs",log);toast("Saved");route()});
 $("#oExport").addEventListener("click",()=>{const log=store.get("obs",[]);const h=["date","type","category","observation","details","location","contractor","observer","rating","immediate_action","cause","corrective_action","owner","due","status"];const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';copy([h.join(",")].concat(log.map(o=>[o.date,o.type,o.cat,o.item,o.desc,o.loc,o.contractor,o.obs,o.sev,o.action,o.cause,o.capa,o.owner,o.due,o.status].map(q).join(","))).join("\n"))});
 $("#oClear").addEventListener("click",()=>{const b=$("#oClear");if(b.dataset.arm){store.set("obs",[]);try{Object.keys(localStorage).filter(k=>k.startsWith("sw:obsimg:")).forEach(k=>localStorage.removeItem(k))}catch(e){}route()}else{b.dataset.arm="1";b.textContent="Press again to clear";setTimeout(()=>{b.dataset.arm="";b.textContent="Clear log"},3000)}});
 document.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>{const log=store.get("obs",[]);const o=log[+b.dataset.toggle];if(o){o.status=o.status==="Closed"?"Open":"Closed";store.set("obs",log);route()}}));
}

/* ---------- FIRST AID ---------- */
const FACATS=["All","Life-threatening","Injuries","Chemical","Environmental","Bites & stings","Medical","Minor"];
function firstaid(){
 const list=FIRSTAID.topics.filter(t=>STATE.faCat==="All"||t.cat===STATE.faCat);
 return `<div><h2>First aid</h2><p class="lead">Site first-aid reference aligned with ILCOR/AHA/ERC 2020–2025 resuscitation guidance and the Indian national snakebite protocol. It supports certified training (St John Ambulance, Indian Red Cross, state-approved centres) and does not replace it. In every case: Danger → Response → Send for help (108/112) → Airway → Breathing → CPR → Defibrillation.</p></div>
 <div class="card" style="border-left:4px solid var(--crit)"><div class="row" style="justify-content:space-between"><h3>Emergency numbers</h3><button class="btn sm" id="faCopyNums">Copy</button></div><div class="chips" style="margin-top:8px"><span class="chip">Ambulance 108 / 102</span><span class="chip">Unified emergency 112</span><span class="chip">Fire 101</span><span class="chip">Police 100</span><span class="chip">Poison centre (AIIMS) 1800-116-117</span><span class="chip">District disaster 1077</span><span class="chip">Coast guard 1554</span><span class="chip">Health helpline 104</span></div></div>
 <div class="card"><h3>Principles</h3><div class="tbl" style="margin-top:10px;border:0"><table class="mtable">${FIRSTAID.principles.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table></div></div>
 <div class="card"><div class="row" style="justify-content:space-between">${chipbar(FACATS,STATE.faCat,"c")}<span class="meta">${list.length} topics</span></div></div>
 <div class="list">${list.map(t=>`<div class="item" id="${t.id}"><div class="hd"><div><div class="t">${esc(t.t)}</div><div class="meta"><span class="tag">${esc(t.cat)}</span></div></div><button class="btn sm" data-copyfa="${t.id}">Copy</button></div>
  <div class="two" style="margin-top:10px;gap:10px">
   <div><h4>Recognise</h4><ul class="keys">${t.recognise.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
   <div><h4 style="color:var(--crit)">Do not</h4><ul class="keys">${t.dont.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  </div>
  <h4 style="margin-top:10px;color:var(--good)">Do</h4><ol class="steps" style="margin-top:6px">${t.do.map(x=>`<li><span>${esc(x)}</span></li>`).join("")}</ol>
  <div class="note" style="border-left-color:var(--info)"><b>Hospital / 108:</b> ${esc(t.hospital)}</div></div>`).join("")}</div>
 <div class="card"><h3>First-aid programme — statutory & good practice</h3><div class="two" style="margin-top:10px">${FIRSTAID.programme.map(p=>`<div><h4>${esc(p.h)}</h4><ul class="keys">${p.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div><div class="row" style="margin-top:12px"><a class="btn" href="#checklists" data-ck="cl-firstaid">First-aid readiness checklist</a><a class="btn" href="#procedures" data-proc="health">Occupational health procedure</a><a class="btn" href="#protocols">Emergency protocols</a></div></div>`;
}
function bindFirstaid(){const v=$("#view");bindChips(v,val=>{STATE.faCat=val;route()});v.querySelectorAll("[data-copyfa]").forEach(b=>b.addEventListener("click",()=>{const t=FIRSTAID.topics.find(x=>x.id===b.dataset.copyfa);copy(["FIRST AID: "+t.t.toUpperCase(),"","RECOGNISE:",...t.recognise.map(x=>"- "+x),"","DO:",...t.do.map((x,i)=>(i+1)+". "+x),"","DO NOT:",...t.dont.map(x=>"- "+x),"","HOSPITAL/108: "+t.hospital,"","Call 108 / 112. Guidance aligned with ILCOR/AHA/ERC; supports, does not replace, certified first-aid training."].join("\n"))}));$("#faCopyNums").addEventListener("click",()=>copy("EMERGENCY NUMBERS (India)\nAmbulance 108 / 102\nUnified emergency 112\nFire 101\nPolice 100\nPoison centre (AIIMS) 1800-116-117\nDistrict disaster control 1077\nCoast guard 1554\nHealth helpline 104"))}

/* ---------- KEYWORDS & GLOSSARY ---------- */
function keywords(){
 const cats=["All",...[...new Set(KEYWORDS.map(k=>k[1]))]];
 const list=KEYWORDS.filter(k=>STATE.kwCat==="All"||k[1]===STATE.kwCat).slice().sort((a,b)=>a[0].localeCompare(b[0]));
 return `<div><h2>Keywords & glossary</h2><p class="lead">${KEYWORDS.length} safety terms, acronyms and authorities with one-line definitions. Filter by category or use the search box at the top.</p></div>
 <div class="card">${chipbar(cats,STATE.kwCat,"c")}</div>
 <div class="tbl"><table class="mtable"><tbody>${list.map(([k,c,v])=>`<tr><td>${esc(k)}<div class="meta">${esc(c)}</div></td><td>${esc(v)}</td></tr>`).join("")}</tbody></table></div>`;
}
function bindKeywords(){bindChips($("#view"),val=>{STATE.kwCat=val;route()})}

/* ---------- SEARCH ---------- */
function searchView(q){
 const t=q.toLowerCase();const hit=s=>String(s).toLowerCase().includes(t);const R=[];
 REGS.forEach(r=>{if(hit(r.t)||hit(r.sum)||r.key.some(hit)||hit(r.a))R.push({k:"Regulation",t:r.t,s:r.sum,go:{v:"regulations",reg:r.id}})});
 PROCS.forEach(p=>{if(hit(p.t)||hit(p.purpose)||hit(p.scope)||p.steps.some(hit)||p.hazards.some(hit))R.push({k:"Procedure",t:p.t,s:p.purpose,go:{v:"procedures",proc:p.id}})});
 CHECKLISTS.forEach(c=>{if(hit(c.t)||c.items.some(hit))R.push({k:"Checklist",t:c.t,s:c.items.find(hit)||c.items[0],go:{v:"checklists",ck:c.id}})});
 FORMS.forEach(f=>{if(hit(f.t)||hit(f.law)||hit(f.note))R.push({k:"Form",t:f.t,s:f.law+" · "+f.when,go:{v:"forms"}})});
 REPORTING.forEach(r=>{if(hit(r.ev)||hit(r.to)||hit(r.law))R.push({k:"Deadline",t:r.ev+" — "+r.j,s:r.to+" · "+r.dl,go:{v:"reporting"}})});
 NUMBERS.forEach(n=>{if(hit(n.k)||hit(n.v))R.push({k:"Limit",t:n.k,s:n.v,go:{v:"numbers"}})});
 TALKS.forEach(x=>{if(hit(x.t)||x.pts.some(hit))R.push({k:"Toolbox talk",t:x.t,s:x.pts[0],go:{v:"talks"}})});
 SECTORS.forEach(x=>{if(hit(x.t)||hit(x.desc)||x.hazards.some(hit)||x.statutory.some(hit))R.push({k:"Sector",t:x.t,s:x.desc,go:{v:"sectors",sector:x.id}})});
 UNSAFE.acts.forEach(c=>c.items.forEach(it=>{if(hit(it)||hit(c.cat))R.push({k:"Unsafe act",t:it,s:c.cat,go:{v:"unsafe"}})}));
 UNSAFE.conditions.forEach(c=>c.items.forEach(it=>{if(hit(it)||hit(c.cat))R.push({k:"Unsafe condition",t:it,s:c.cat,go:{v:"unsafe"}})}));
 PROTOCOLS.lsr.forEach(x=>{if(hit(x.t)||hit(x.rule))R.push({k:"Protocol",t:x.t,s:x.rule,go:{v:"protocols"}})});
 PROTOCOLS.standing.forEach(x=>{if(hit(x.t)||hit(x.purpose)||x.steps.some(hit))R.push({k:"Protocol",t:x.t,s:x.purpose,go:{v:"protocols"}})});
 PROTOCOLS.emergency.forEach(x=>{if(hit(x.t)||hit(x.trigger)||x.steps.some(hit))R.push({k:"Emergency protocol",t:x.t,s:x.trigger,go:{v:"protocols"}})});
 FIRSTAID.topics.forEach(x=>{if(hit(x.t)||x.recognise.some(hit)||x.do.some(hit))R.push({k:"First aid",t:x.t,s:x.recognise[0],go:{v:"firstaid"}})});
 KEYWORDS.forEach(([k,c,v])=>{if(hit(k)||hit(v))R.push({k:"Keyword",t:k,s:v,go:{v:"keywords"}})});
 MATRIX.domains.forEach(d=>{const all=[...d.central,...d.tn,...d.ka,...d.bis];if(hit(d.t)||all.some(hit))R.push({k:"State matrix",t:d.t,s:all.find(hit)||d.central[0],go:{v:"matrix"}})});
 MATRIX.table.forEach(r=>{if(r.some(hit))R.push({k:"State matrix",t:r[0],s:"TN: "+r[2]+" · KA: "+r[3],go:{v:"matrix"}})});
 return `<div><h2>Search: “${esc(q)}”</h2><p class="lead">${R.length} result${R.length===1?"":"s"}</p></div><div class="sr">${R.slice(0,80).map((r,i)=>`<div class="r" data-sr="${i}"><span class="k">${esc(r.k)}</span><div><div style="font-weight:600">${esc(r.t)}</div><div class="meta" style="margin-top:2px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.s)}</div></div></div>`).join("")||'<div class="empty">Nothing found. Try a shorter term (e.g. “scaffold”, “Form XI”, “48 hours”).</div>'}</div>`;
}
let SR=[];

/* ---------- ROUTER ---------- */
function route(){
 const h=(location.hash||"#home").slice(1);const v=$("#view");nav(h);
 if(STATE.q){v.innerHTML=searchView(STATE.q);bindSearch();return}
 switch(h){
  case "regulations":v.innerHTML=regs();bindRegs();break;
  case "downloads":v.innerHTML=downloads();bindDownloads();break;
  case "procedures":v.innerHTML=procs();bindProcs();break;
  case "checklists":v.innerHTML=checklists();bindCks();break;
  case "permits":v.innerHTML=permits();bindPermits();break;
  case "incidents":v.innerHTML=incidents();bindIncidents();break;
  case "forms":v.innerHTML=forms();break;
  case "reporting":v.innerHTML=reporting();break;
  case "talks":v.innerHTML=talks();v.querySelectorAll("[data-talk]").forEach(b=>b.addEventListener("click",()=>{const t=TALKS[+b.dataset.talk];copy("TOOLBOX TALK: "+t.t+"\n"+t.pts.map((p,i)=>(i+1)+". "+p).join("\n"))}));break;
  case "emergency":v.innerHTML=emergency();break;
  case "numbers":v.innerHTML=numbers();break;
  case "sectors":v.innerHTML=sectors();bindSectors();break;
  case "protocols":v.innerHTML=protocols();bindProtocols();break;
  case "sos":v.innerHTML=sos();bindSos();break;
  case "app":v.innerHTML=appView();bindApp();break;
  case "matrix":v.innerHTML=matrix();$("#mxCopy").addEventListener("click",()=>copy(["TAMIL NADU vs KARNATAKA — REGULATORY & ENFORCEMENT MATRIX","",...MATRIX.table.map(r=>r[0]+" | Central: "+r[1]+" | TN: "+r[2]+" | KA: "+r[3]),"",...MATRIX.domains.map(d=>[d.n+". "+d.t,"Central: "+d.central.join("; "),"Tamil Nadu: "+d.tn.join("; "),"Karnataka: "+d.ka.join("; "),"BIS: "+d.bis.join("; ")].join("\n")).flatMap(x=>[x,""])].join("\n")));break;
  case "unsafe":v.innerHTML=unsafe();bindUnsafe();break;
  case "firstaid":v.innerHTML=firstaid();bindFirstaid();break;
  case "keywords":v.innerHTML=keywords();bindKeywords();break;
  case "observe":v.innerHTML=observe();bindObserve();break;
  case "glossary":location.hash="#keywords";return;
  case "carbon":v.innerHTML=carbon();bindCarbon();break;
  default:v.innerHTML=home();
 }
 bindJumps(v);window.scrollTo({top:0});
}
function go(h){if(location.hash===h)route();else location.hash=h}
function bindJumps(root){root.querySelectorAll("a[data-proc]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();STATE.proc=a.dataset.proc;STATE.q="";$("#q").value="";go("#procedures")}));root.querySelectorAll("a[data-ck]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();STATE.ck=a.dataset.ck;STATE.q="";$("#q").value="";go("#checklists")}));root.querySelectorAll("a[data-reg]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();STATE.reg=a.dataset.reg;STATE.regJ="All";STATE.regD="All";STATE.regS="All";STATE.q="";$("#q").value="";go("#regulations")}))}
function bindRegs(){const v=$("#view");v.querySelectorAll(".chips").forEach((bar,idx)=>bar.querySelectorAll(".chip[data-v]").forEach(c=>c.addEventListener("click",()=>{if(idx===0)STATE.regJ=c.dataset.v;else if(idx===1)STATE.regD=c.dataset.v;else STATE.regS=c.dataset.v;route()})));if(STATE.reg){const el=document.getElementById("reg-"+STATE.reg);if(el){el.scrollIntoView({block:"start"});el.style.borderColor="var(--accent)";el.querySelector("details")?.setAttribute("open","")}STATE.reg=null}}
function bindProcs(){const v=$("#view");if(STATE.proc){$("#copyProc")?.addEventListener("click",()=>copy(procText(PROCS.find(p=>p.id===STATE.proc))));v.querySelector("[data-back]").addEventListener("click",e=>{e.preventDefault();STATE.proc=null;route()});return}bindChips(v,val=>{STATE.procCat=val;route()});v.querySelectorAll(".item[data-proc]").forEach(it=>it.addEventListener("click",()=>{STATE.proc=it.dataset.proc;route()}))}
function bindCks(){const v=$("#view");if(STATE.ck){bindCk(CHECKLISTS.find(c=>c.id===STATE.ck));v.querySelector("[data-back]").addEventListener("click",e=>{e.preventDefault();STATE.ck=null;route()});return}bindChips(v,val=>{STATE.ckCat=val;route()});v.querySelectorAll(".item[data-ck]").forEach(it=>it.addEventListener("click",()=>{STATE.ck=it.dataset.ck;route()}))}
function bindSearch(){const q=STATE.q.toLowerCase();const items=[];const v=$("#view");v.querySelectorAll("[data-sr]").forEach(el=>el.addEventListener("click",()=>{const title=el.querySelector("div>div").textContent;const k=el.querySelector(".k").textContent;STATE.q="";$("#q").value="";
 if(k==="Regulation"){const r=REGS.find(x=>x.t===title);STATE.reg=r?.id;go("#regulations")}
 else if(k==="Procedure"){const p=PROCS.find(x=>x.t===title);STATE.proc=p?.id;go("#procedures")}
 else if(k==="Checklist"){const c=CHECKLISTS.find(x=>x.t===title);STATE.ck=c?.id;go("#checklists")}
 else if(k==="Sector"){const c=SECTORS.find(x=>x.t===title);STATE.sector=c?.id;go("#sectors")}
 else if(k==="Keyword"||k==="Glossary"){STATE.kwCat="All";go("#keywords")}
 else if(k==="Protocol"||k==="Emergency protocol"){STATE.protoTab=k==="Emergency protocol"?"emergency":(PROTOCOLS.lsr.some(x=>x.t===title)?"lsr":"standing");go("#protocols")}
 else if(k==="Unsafe act"||k==="Unsafe condition"){STATE.unsafeTab=k==="Unsafe act"?"acts":"conditions";go("#unsafe")}
 else if(k==="First aid"){STATE.faCat="All";go("#firstaid")}
 else if(k==="State matrix"){go("#matrix")}
 else{const map={Form:"forms",Deadline:"reporting",Limit:"numbers","Toolbox talk":"talks"};go("#"+map[k])}}))}
window.addEventListener("hashchange",()=>{if(location.hash!=="#procedures")STATE.proc=null;if(location.hash!=="#checklists")STATE.ck=null;if(location.hash!=="#sectors")STATE.sector=null;STATE.q="";$("#q").value="";route()});
if(IN_APP&&window.Capacitor.Plugins.App){window.Capacitor.Plugins.App.addListener("backButton",({canGoBack})=>{if(document.body.classList.contains("menu-open")){document.body.classList.remove("menu-open");return}if(canGoBack&&location.hash&&location.hash!=="#home")history.back();else window.Capacitor.Plugins.App.exitApp()})}
$("#menuBtn").addEventListener("click",()=>{const open=document.body.classList.toggle("menu-open");$("#menuBtn").setAttribute("aria-expanded",String(open));if(open)window.scrollTo({top:0})});
let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{STATE.q=e.target.value.trim();route()},180)});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus()}if(e.key==="Escape"&&document.activeElement===$("#q")){$("#q").value="";STATE.q="";route()}});
route();
})();
</script>
