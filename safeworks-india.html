<title>SafeWorks India</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed navy rail on the left (site-control-room feel), white working surface, safety-orange accent reserved for actions and active states; semantic colours (good/warn/crit) separate from the accent. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface2:#eaeef1; --fg:#17222c; --muted:#5b6974; --line:#d4dbe1;
  --accent:#d1480c; --accent-ink:#ffffff; --accent-soft:#fdeee4;
  --nav:#0f1c2b; --nav-fg:#c9d4de; --nav-active:#1c2f45;
  --good:#1e7a4b; --warn:#a9700e; --crit:#b3261e; --info:#1f5fa8;
  --chip:#e6ebef; --chip-fg:#2b3942;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px; --shadow:0 1px 2px rgba(16,24,32,.06),0 4px 14px rgba(16,24,32,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1419; --surface:#161e26; --surface2:#1d2730; --fg:#e4eaef; --muted:#97a5b1; --line:#2a3741;
  --accent:#f07a35; --accent-ink:#161010; --accent-soft:#3a2416;
  --nav:#0a1118; --nav-fg:#b9c6d1; --nav-active:#182636;
  --good:#4fbf85; --warn:#e2b04a; --crit:#f0786e; --info:#6ea8ea;
  --chip:#22303b; --chip-fg:#cdd7df; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#161e26; --surface2:#1d2730; --fg:#e4eaef; --muted:#97a5b1; --line:#2a3741;
  --accent:#f07a35; --accent-ink:#161010; --accent-soft:#3a2416;
  --nav:#0a1118; --nav-fg:#b9c6d1; --nav-active:#182636;
  --good:#4fbf85; --warn:#e2b04a; --crit:#f0786e; --info:#6ea8ea;
  --chip:#22303b; --chip-fg:#cdd7df; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
a{color:var(--info)}
button{font:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.rail{background:var(--nav);color:var(--nav-fg);padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-family:var(--mono);font-size:13px;flex:none}
.brand h1{font-size:16px;margin:0;color:#fff;letter-spacing:.2px;text-wrap:balance}
.brand small{display:block;font-size:11px;color:var(--nav-fg);font-family:var(--mono);letter-spacing:.3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7f8f9d;padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);color:var(--nav-fg);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--nav-active);color:#fff}
.nav a.on{background:var(--nav-active);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav a .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:#7f8f9d}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.railfoot{margin-top:auto;font-size:11.5px;color:#7f8f9d;line-height:1.45}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;min-width:0}
.search input{flex:1;border:0;background:transparent;color:var(--fg);font:inherit;outline:none;min-width:0}
.search input:focus-visible{outline:none}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search kbd{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.asof{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.content{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1180px;width:100%}
h2{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:16px;margin:0;text-wrap:balance}
h4{font-size:13.5px;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lead{color:var(--muted);margin:4px 0 0;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--accent)}
.tile .big{font-family:var(--mono);font-size:24px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .lbl{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);color:var(--chip-fg);border-radius:999px;padding:3px 10px;font-size:12px;border:1px solid transparent;cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.sm{padding:1px 8px;font-size:11px;cursor:default}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.st.inforce::before{background:var(--good)} .st.transition::before{background:var(--warn)} .st.draft::before{background:var(--info)} .st.repealed::before{background:var(--crit)} .st.guidance::before{background:var(--info)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.docs{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.docs .dh{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.doc{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.doc .dn{flex:1 1 180px;min-width:0;font-size:13.5px}
.doc .btn{text-decoration:none;white-space:nowrap}
.acc{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);white-space:nowrap}
.acc.a-free{color:var(--good);border-color:var(--good)} .acc.a-free-login{color:var(--info);border-color:var(--info)} .acc.a-paid{color:var(--warn);border-color:var(--warn)}
.doc .arch{font-size:12px;color:var(--muted)}
.dlsearch{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:9px 12px;font:inherit}
.btn:focus-visible,.chip:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.item.clk{cursor:pointer}
.item.clk:hover{border-color:var(--accent)}
.item .hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.item .t{font-weight:600;font-size:15.5px;text-wrap:balance}
.meta{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sum{margin:8px 0 0;max-width:80ch}
ul.keys{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
ul.keys li::marker{color:var(--accent)}
.note{margin-top:10px;padding:8px 12px;border-left:3px solid var(--warn);background:var(--surface2);font-size:13.5px;border-radius:0 var(--r) var(--r) 0}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"";width:0;height:0;border-left:6px solid var(--muted);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){details summary::before{transition:none}}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:12px;color:var(--accent-ink);background:var(--accent);border-radius:4px;width:26px;height:24px;display:grid;place-items:center;font-weight:500;margin-top:2px}
.refs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.refs .box{background:var(--surface2);border-radius:var(--r);padding:10px 12px;font-size:13px;min-width:0}
.refs .box h4{margin-bottom:6px}
.refs ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ck{display:flex;flex-direction:column;gap:6px}
.ck label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.ck label:has(input:checked){background:var(--surface2);text-decoration:line-through;color:var(--muted)}
.ck input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.bar{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .2s}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:8px 10px;font:inherit;min-width:0;width:100%}
.f textarea{min-height:70px;resize:vertical}
.f.wide{grid-column:1/-1}
.out{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px;max-height:520px;overflow:auto;line-height:1.5}
.alert{padding:10px 12px;border-radius:var(--r);font-size:13.5px;border:1px solid}
.alert.ok{border-color:var(--good);color:var(--good)} .alert.bad{border-color:var(--crit);color:var(--crit)} .alert.wn{border-color:var(--warn);color:var(--warn)}
.gas{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.gas .g{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--surface)}
.gas .g b{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.gas .g input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-family:var(--mono);font-size:16px;padding:4px 0}
.gas .g.bad{border-color:var(--crit)} .gas .g.ok{border-color:var(--good)}
.gas .g small{display:block;font-size:11px;color:var(--muted)}
.empty{color:var(--muted);padding:24px;text-align:center}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
input.num{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:5px 8px;font:inherit;font-family:var(--mono)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:20;box-shadow:var(--shadow)}
.sr{display:flex;flex-direction:column;gap:8px}
.sr .r{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.sr .r:hover{border-color:var(--accent)}
.sr .k{font-family:var(--mono);font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;padding-top:3px;white-space:nowrap}
.timeline{display:flex;flex-direction:column;gap:0}
.timeline .ev{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.timeline .ev .d{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500}
.back{color:var(--muted);text-decoration:none;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--accent)}
.mtable td:first-child{font-weight:600;width:28%}
.menu-btn{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;padding-block:12px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px;scrollbar-width:thin}
  .nav .grp{display:none}
  .nav a{white-space:nowrap;padding:6px 10px;font-size:13px}
  .nav a .n{display:none}
  .railfoot{display:none}
  .top{top:env(safe-area-inset-top,0px)}
  .asof{display:none}
  .timeline .ev{grid-template-columns:1fr}
  .refs{grid-template-columns:1fr}
}
/* ----- app shell: SOS, tab bar, install ----- */
.sosfab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--crit);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:700;letter-spacing:.06em;box-shadow:0 6px 18px rgba(179,38,30,.35);text-decoration:none;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.sosfab:hover{filter:brightness(1.08)}
.sosgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.sosbtn{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:10px;text-decoration:none;color:#fff;background:var(--crit);min-height:96px;justify-content:center}
.sosbtn.alt{background:var(--nav);}
.sosbtn b{font-family:var(--mono);font-size:30px;line-height:1.1;letter-spacing:.02em}
.sosbtn span{font-size:13px;opacity:.92}
.sosbtn:active{transform:scale(.98)}
.sosbtn b.long{font-size:21px;white-space:nowrap}
.installbtn{white-space:nowrap}
.tabbar{display:none}
.obsthumb{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.photoprev{max-width:220px;max-height:220px;border-radius:8px;border:1px solid var(--line);margin-top:8px}
@media (max-width:860px){
  .rail .nav,.rail .railfoot{display:none}
  body.menu-open .rail{position:fixed;inset:0;z-index:30;overflow:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  body.menu-open .rail .nav{display:flex;flex-direction:column;overflow:visible}
  body.menu-open .rail .nav .grp{display:block}
  body.menu-open .rail .nav a{white-space:normal;font-size:15px;padding:10px 12px}
  body.menu-open .rail .nav a .n{display:inline}
  .sosfab{display:none}
  .content{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--nav);border-top:1px solid rgba(255,255,255,.08);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--nav-fg);text-decoration:none;font-size:11px;background:none;border:0;padding:6px 2px;border-radius:8px;font-family:var(--font)}
  .tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar .on{color:#fff;background:var(--nav-active)}
  .tabbar .sos{color:#fff;background:var(--crit);font-weight:700}
  .brand{justify-content:space-between}
}
@media print{.rail,.top,.tabbar,.sosfab{display:none}}
</style>

<script>
// Regulatory library — current as of 20 Oct 2026. Verify against the official text before relying on any figure.
const REGS = [

{id:"osh-code",t:"Occupational Safety, Health and Working Conditions Code, 2020",yr:2020,j:"India – Central",d:["Factories","Construction","Welfare/Labour","Mines","Chemical"],a:"Ministry of Labour & Employment (MoLE); Inspector-cum-Facilitator (ICF) at state/central level",s:"In force",sum:"The primary workplace-safety statute in India. In force from 21 Nov 2025; it repealed 13 central Acts including the Factories Act 1948, BOCW Act 1996, Contract Labour Act 1970, Inter-State Migrant Workmen Act 1979, Mines Act 1952 and Dock Workers Act 1986. Applies to establishments with 10+ workers (all establishments carrying hazardous activity regardless of headcount).",key:["s.3 – single registration of establishment (60 days of applicability); existing registrants update details via Shram Suvidha (Central Rules: Form I, within 6 months of 8 May 2026)","s.6 – general duties of employer: safe workplace, plant, systems, information, annual health examination (as prescribed)","s.10 – notice of accident (death or injury) to ICF; s.11 – dangerous occurrences (even without injury); s.12 – notice of notifiable diseases","s.16–s.22 – National & State OSH Advisory Boards; s.22 Safety Committee (threshold as prescribed, e.g. 500+ workers; hazardous-process factories lower); s.23 Safety Officer (factory 500+, hazardous factory 250+, construction 250+, mine 100+ — verify thresholds in applicable rules)","s.24 – welfare: canteen (100+), crèche (50+), first-aid, drinking water, latrines, welfare officer (250+)","s.25–s.27 – working hours (8 h/day), overtime at twice ordinary wage, rest intervals; s.43 women may work at night with consent and safeguards","Ch. XI – contract labour (threshold 50+); Ch. XII – hazardous processes (compulsory disclosure, safety report, emergency plan, exposure limits); Ch. XIII – building and other construction work; Part on mines","Registers, annual return (unified), inspection by ICF with web-based randomised inspection; graded penalties with compounding; employer may be prosecuted on second offence"],url:"https://labour.gov.in",note:"Labour is a concurrent subject: Central Rules apply where the Central Government is the appropriate Government; otherwise the State's OSH Rules apply. During transition, state Factories/BOCW Rules continue to be used where state OSH rules are not yet final."},
{id:"osh-central-rules",t:"Occupational Safety, Health and Working Conditions (Central) Rules, 2026",yr:2026,j:"India – Central",d:["Factories","Construction","Welfare/Labour","Chemical"],a:"MoLE – G.S.R. 345(E), notified 8 May 2026",s:"In force",sum:"Operational rules under the OSH Code for Central-sphere establishments (railways, mines, major ports, oilfields, central PSUs, etc.). Also the model many states are following for their own rules.",key:["Registration: Form I (online), certificate in Form III within 7 days; register of establishments in Form V","Rule 7 – Notice of accidents & dangerous occurrences: death – forthwith (electronic + written; inform police and family); injury preventing work 48 h or more and listed dangerous occurrences – within 12 h, Form XI, to ICF and District Magistrate/SDO","Schedule of dangerous occurrences: collapse of lifting machine/crane/hoist, explosion/fire causing damage, bursting of pressure vessel, collapse of structure/scaffold, electrical short-circuit/fire, release of hazardous substance, etc.","Hours of work: 8 h/day, 48 h/week; spread-over; overtime cap per quarter; women night work conditions (transport, CCTV, lighting, batch size)","Health examination, Safety Committee constitution & functions, Safety Officer qualifications, welfare standards, contract labour licence (5-year all-India licence)"],url:"https://labour.gov.in",note:"Where a State Government is the appropriate Government (most private factories and construction sites in Karnataka/Tamil Nadu), use the State OSH Rules; until those are final, the legacy State Factories Rules and BOCW Rules remain the working technical standard."},
{id:"factories-act",t:"Factories Act, 1948",yr:1948,j:"India – Central",d:["Factories","Chemical","Health"],a:"State Chief Inspector of Factories / Director of Industrial Safety & Health",s:"Repealed (subsumed)",sum:"Repealed by the OSH Code w.e.f. 21 Nov 2025, but still essential reading: existing licences, state Factories Rules (Karnataka 1969, Tamil Nadu 1950) and court practice are built on its section numbering, and state rules continue in transition.",key:["s.2(cb) hazardous process; First Schedule – hazardous industries","s.7A/7B – general duties of occupier and manufacturers","Ch. IV Safety: s.21 fencing, s.23 young persons on dangerous machines, s.28 hoists & lifts, s.29 lifting machines (competent person test), s.31 pressure plant, s.32 floors/stairs, s.33 pits, s.35 eye protection, s.36 confined space / dangerous fumes, s.37 explosive or inflammable dust/gas, s.38 fire precautions, s.40B Safety Officer (1000+ workers)","Ch. IVA Hazardous processes: s.41A Site Appraisal Committee, s.41B disclosure, s.41C occupier responsibility, s.41F permissible exposure limits (Second Schedule), s.41G safety committee, s.41H right to warn","s.88 notice of accident (death / >48 h absence), s.88A dangerous occurrences, s.89 notifiable diseases (Third Schedule), s.92 penalties"],url:"https://www.indiacode.nic.in",note:"Map legacy obligations to OSH Code: s.88 → OSH s.10; s.41G → OSH s.22; s.40B → OSH s.23; s.36 → OSH Code + State Rules on confined spaces."},
{id:"bocw-act",t:"Building and Other Construction Workers (Regulation of Employment and Conditions of Service) Act, 1996",yr:1996,j:"India – Central",d:["Construction","Welfare/Labour"],a:"Registering Officer; State BOCW Welfare Boards",s:"Repealed (subsumed)",sum:"Repealed by the OSH Code (21 Nov 2025). Its Central Rules 1998 and the State Rules (Karnataka 2006, Tamil Nadu 2006) remain the most detailed technical safety standard for Indian construction sites and are still referenced by inspectors and contracts.",key:["Applied to establishments with 10+ building workers; registration (s.7), registration of workers as beneficiaries with Welfare Board","Ch. VII Safety & Health: s.38 safety committees (500+), safety officers (s.38), notice of accidents (s.39)","Central Rules 1998 technical chapters: excessive noise/vibration, fire protection, emergency action plan, fencing of motors, lifting appliances & gear (test by competent person), runways/ramps, excavation & tunnelling, demolition, scaffolding, ladders, structural frame erection, catch platforms, electrical, explosives, hazardous substances, PPE, medical examination, first aid, canteens, crèches","Rule 36/38 (Central Rules) – helmets, safety belts, protective footwear; Rule 54 – scaffold inspection; Rule 65 – excavation shoring beyond 1.5 m (verify)"],url:"https://www.indiacode.nic.in",note:"Welfare cess (1% of construction cost, BOCW Welfare Cess Act 1996) now continues under the Code on Social Security 2020 (Ch. VIII) and State Welfare Boards."},
{id:"ss-code",t:"Code on Social Security, 2020 (incl. BOCW cess, Employees' Compensation, ESI)",yr:2020,j:"India – Central",d:["Welfare/Labour","Construction"],a:"MoLE; EPFO; ESIC; State BOCW Welfare Boards",s:"In force",sum:"In force 21 Nov 2025. Subsumes the Employees' Compensation Act 1923, ESI Act 1948, BOCW Welfare Cess Act 1996 and others. Governs compensation for occupational injury/disease and the construction welfare cess.",key:["Ch. VII Employee's Compensation: employer liability for injury/occupational disease (Third Schedule), report of fatal accidents to Commissioner","Ch. VIII BOCW cess: 1–2% (currently 1%) of cost of construction, paid to State Welfare Board; registration of construction workers as beneficiaries","ESI: accident report to ESIC branch office (24–48 h); medical benefit coverage"],url:"https://labour.gov.in"},
{id:"contract-labour",t:"Contract Labour (Regulation & Abolition) Act, 1970 / Inter-State Migrant Workmen Act, 1979",yr:1970,j:"India – Central",d:["Welfare/Labour","Construction"],a:"Licensing Officer (now ICF under OSH Code)",s:"Repealed (subsumed)",sum:"Both subsumed in OSH Code Ch. XI. Threshold raised from 20 to 50 contract workers; single all-India contractor licence; principal employer responsible for welfare, wages, and safety of contract labour.",key:["Principal employer liable where contractor defaults (wages, PF, safety)","Migrant workers: journey allowance, portability of benefits, toll-free helpline, annual reporting"],url:"https://labour.gov.in"},
{id:"ep-act",t:"Environment (Protection) Act, 1986 & EP Rules, 1986",yr:1986,j:"India – Central",d:["Environment","Chemical"],a:"MoEFCC; CPCB; State Pollution Control Boards (KSPCB, TNPCB)",s:"In force",sum:"Umbrella environmental statute. Parent Act for MSIHC Rules, Chemical Accident Rules, Hazardous Waste Rules, Noise Rules, C&D Waste Rules, E-waste Rules, Battery Waste Rules, EIA Notification. Jan Vishwas (Amendment of Provisions) Act 2023 decriminalised several offences (adjudicating officer, penalties).",key:["s.5 – power to issue directions (closure, stoppage of utilities)","s.7 – no discharge in excess of standards (Schedules to EP Rules)","s.9 – duty to report accidental discharge forthwith to authorities and mitigate","Rule 14 EP Rules – Environmental Statement (Form V) by 30 September each year by units needing consent/authorisation"],url:"https://moef.gov.in"},
{id:"msihc",t:"Manufacture, Storage and Import of Hazardous Chemical Rules, 1989 (MSIHC)",yr:1989,j:"India – Central",d:["Chemical","Factories"],a:"Chief Inspector of Factories (DISH/DFBISH) for factories; CIF of Dock Safety; AERB etc. per Schedule 5",s:"In force",sum:"India's major-accident-hazard (MAH) regime, modelled on Seveso. Applies to industrial activities handling chemicals in Schedule 1 (named chemicals & threshold quantities), Schedule 2 and Schedule 3.",key:["Rule 4 – general duty: identify major accident hazards, provide information, training, equipment","Rule 5 – notify major accident within 48 h (Schedule 6); investigation and report","Rule 7/8 – notification of site (Schedule 7) at least 3 months before commencing; updating","Rule 10 – Safety Report (Schedule 8) for Schedule 3 threshold units; updated every 3 years or on modification","Rule 12 – safety audit annually by competent person; Rule 13 – on-site emergency plan (rehearsed every 6 months); Rule 14 – off-site emergency plan by District Collector/Emergency Authority","Rule 15 – information to public; Rule 17 – Material Safety Data Sheet (Schedule 9) for every hazardous chemical; labelling; Rule 18 – import"],url:"https://moef.gov.in",note:"Draft MSIHC Rules 2024/2025 proposing GHS-aligned classification were circulated by MoEFCC; verify current status."},
{id:"chem-accident-rules",t:"Chemical Accidents (Emergency Planning, Preparedness and Response) Rules, 1996",yr:1996,j:"India – Central",d:["Chemical","Environment"],a:"Central, State, District and Local Crisis Groups; District Collector",s:"In force",sum:"Sets up the four-tier crisis-group structure for chemical emergencies and obliges MAH units to feed information and participate in off-site planning and mock drills.",key:["Rule 9 – District Crisis Group chaired by District Collector; off-site plan rehearsal","Rule 10 – Local Crisis Group at industrial pocket level; MAH units supply information","Occupier must assist in off-site emergency plan, conduct full-scale mock drill at least once a year"],url:"https://moef.gov.in"},
{id:"how-rules",t:"Hazardous and Other Wastes (Management and Transboundary Movement) Rules, 2016",yr:2016,j:"India – Central",d:["Environment","Chemical"],a:"SPCB (authorisation), CPCB, MoEFCC",s:"In force",sum:"Generation, storage (max 90 days), transport, treatment and disposal of hazardous waste (Schedule I/II/III); manifest system; authorisation (Form 1/2); annual returns (Form 4 by 30 June); accident reporting (Form 11).",key:["Rule 6 – authorisation from SPCB; Rule 8 – storage ≤ 90 days; Rule 16 – labelling; Rule 18 – manifest (Form 10) and transport; Rule 20 – record (Form 3) & annual return (Form 4)","Rule 23 – accident during handling: report immediately to SPCB in Form 11","Co-processing / TSDF / recycler registration"],url:"https://cpcb.nic.in"},
{id:"air-water",t:"Air (Prevention and Control of Pollution) Act, 1981 & Water (Prevention and Control of Pollution) Act, 1974",yr:1981,j:"India – Central",d:["Environment"],a:"CPCB; KSPCB; TNPCB",s:"In force",sum:"Consent to Establish (CTE) before construction and Consent to Operate (CTO) before commissioning for Red/Orange/Green/White category industries (CPCB categorisation). Stack/effluent standards, continuous monitoring (OCEMS) for 17 categories.",key:["Water Act s.25/26 – consent for discharge; Air Act s.21 – consent to operate in air-pollution control area","Construction sites: dust control, DG set stack height & noise limits, STP for labour colonies","Non-compliance: closure directions under s.33A/31A; Jan Vishwas 2023 penalty regime"],url:"https://cpcb.nic.in"},
{id:"noise-rules",t:"Noise Pollution (Regulation and Control) Rules, 2000",yr:2000,j:"India – Central",d:["Environment","Health"],a:"SPCB; District Magistrate",s:"In force",sum:"Ambient noise limits by zone (dB(A) Leq): Industrial 75 day / 70 night; Commercial 65/55; Residential 55/45; Silence 50/40. Night = 10 pm–6 am. Construction equipment and DG sets also have source limits under EP Rules Schedule VI.",key:["No loudspeaker/construction noise above limits at night without permission","DG sets: noise limit 75 dB(A) at 1 m (≤1000 kVA, EP Rules); acoustic enclosures","Occupational limit (Factories Act Sch. II / OSH rules): 90 dB(A) 8-h TWA; OSHA PEL 90 dB(A), action level 85 dB(A)"],url:"https://cpcb.nic.in"},
{id:"cd-waste-2025",t:"Environment (Construction and Demolition) Waste Management Rules, 2025",yr:2025,j:"India – Central",d:["Environment","Construction"],a:"MoEFCC; CPCB; Urban Local Bodies; SPCB",s:"In force",sum:"Supersedes the C&D Waste Management Rules 2016; effective 1 April 2026. Introduces Extended Producer Responsibility-style obligations for large generators (projects ≥ 20,000 m² built-up or demolition of similar size), mandatory C&D waste management plans, segregated storage, use of recycled products, and online portal reporting.",key:["Generator must segregate (concrete, soil, steel, wood, plastics), store within site, and hand over to authorised processor; no dumping on roads/drains/water bodies","Large projects: C&D waste management plan submitted with building permit; targets for use of recycled material in new construction","Registration on CPCB portal; annual returns; environmental compensation for violation"],url:"https://moef.gov.in",note:"Local-body bye-laws (BBMP, Greater Chennai Corporation) impose dust-control, barricading and debris-transport conditions in addition."},
{id:"eia-2006",t:"EIA Notification, 2006 (as amended) – Prior Environmental Clearance",yr:2006,j:"India – Central",d:["Environment","Construction"],a:"MoEFCC (Category A); SEIAA (Category B)",s:"In force",sum:"Prior EC needed before construction for listed projects: Item 8(a) building/construction ≥ 20,000 m² built-up; 8(b) townships ≥ 50 ha or ≥ 1,50,000 m²; industrial projects by sector thresholds (chemicals, cement, metallurgy, power, etc.). EC conditions typically include dust, noise, worker welfare, STP, rainwater harvesting and six-monthly compliance reports.",key:["Six-monthly compliance report to Regional Office of MoEFCC","EC conditions are legally binding; violation → EP Act action"],url:"https://parivesh.nic.in"},
{id:"petroleum",t:"Petroleum Act, 1934 & Petroleum Rules, 2002",yr:2002,j:"India – Central",d:["Chemical","Fire","Oil & Gas"],a:"Petroleum and Explosives Safety Organisation (PESO)",s:"In force",sum:"Storage, transport and handling of petroleum Class A (flash point < 23 °C), B (23–65 °C), C (65–93 °C). Licence thresholds (e.g. Class A > 30 L, Class B > 2,500 L in bulk) and safety distances, earthing, flameproof electricals (IS/IEC 60079), no smoking, fire-fighting.",key:["Form XIV/XV licences; Rule 118 – hot work within licensed premises only with gas-free certificate","Accident in licensed premises: notify PESO Chief Controller and local police forthwith","Diesel storage at construction sites (Class B): licence if > 2,500 L; bunding, spill kit, extinguishers"],url:"https://peso.gov.in"},
{id:"explosives",t:"Explosives Act, 1884 & Explosives Rules, 2008; Ammonium Nitrate Rules, 2012",yr:2008,j:"India – Central",d:["Construction","Chemical","Mines"],a:"PESO; District Magistrate (shot-firer, blasting permissions)",s:"In force",sum:"Manufacture, possession, use, transport and sale of explosives. Blasting on construction/quarry sites needs licensed magazine, licensed blaster/shot-firer, blasting plan, and local police/DM permission.",key:["Licence Forms LE-1 to LE-5; magazine construction and distance tables","Blasting: siren, 500 m exclusion (typical), misfire procedure (IS 4081), vibration limits (DGMS circular 7 of 1997 for structures)","Accident notice to Chief Controller of Explosives forthwith"],url:"https://peso.gov.in"},
{id:"gas-cylinders",t:"Gas Cylinders Rules, 2016 & Static and Mobile Pressure Vessels (Unfired) Rules, 2016",yr:2016,j:"India – Central",d:["Pressure/Boilers","Chemical","Fire"],a:"PESO",s:"In force",sum:"Filling, possession, storage and transport of compressed gas cylinders (oxygen, acetylene, LPG, CO2, argon) and bulk pressure vessels (LPG bullets, ammonia, chlorine tonners). Periodic hydrostatic testing, colour coding (IS 4379), valve protection, storage separation (oxidisers ≥ 6 m / fire wall from fuel gases).",key:["Storage of > 200 cylinders needs PESO licence (verify current threshold)","SMPV(U): licence (Form III), safety relief valve testing, competent-person inspection every 5 years, fire protection","Gas Cylinders (Amendment) Rules 2025 – verify changes for composite/hydrogen cylinders"],url:"https://peso.gov.in"},
{id:"boilers-2025",t:"Boilers Act, 2025 & Indian Boiler Regulations, 1950",yr:2025,j:"India – Central",d:["Pressure/Boilers","Factories"],a:"Central Boilers Board; State Chief Inspector of Boilers (Karnataka DFBISH / Tamil Nadu DISH-Boilers)",s:"In force",sum:"Boilers Act 2025 replaced the Boilers Act 1923 (effective 1 May 2025) with decriminalised penalties and third-party inspection. Registration, annual certificate of inspection, boiler attendant/operator certification (BOE), economiser/steam pipeline inspection.",key:["No boiler to be used without certificate; hydraulic test; safety valve setting","Accident/explosion: report to Chief Inspector of Boilers within 24 h; do not disturb scene","Operator: Boiler Attendant (1st/2nd class) / BOE depending on heating surface"],url:"https://dpiit.gov.in"},
{id:"electricity",t:"Electricity Act, 2003 & CEA (Measures relating to Safety and Electric Supply) Regulations, 2023",yr:2023,j:"India – Central",d:["Electrical","Construction","Factories"],a:"Central Electricity Authority; State Chief Electrical Inspector (CEIG)",s:"In force",sum:"Safety regulations for generation, transmission, distribution and use of electricity. 2023 regulations superseded the 2010 regulations (verify transitional provisions). Covers earthing, clearances from overhead lines, approval of HT installations, periodic inspection, electrical accidents.",key:["Approval of CEIG before energising HT/EHT installations and multi-storey buildings (>15 m) electrical installations","Vertical/horizontal clearances from overhead lines; working near live lines; shutdown & permit-to-work","Electrical accident: notify Electrical Inspector within 48 h (Form A), fatal – immediately","Earthing (IS 3043), ELCB/RCD 30 mA for portable tools (IS 732), lightning protection (IS/IEC 62305)"],url:"https://cea.nic.in"},
{id:"mines",t:"Mines Act, 1952 / Mines Rules 1955 / Metalliferous Mines Regulations 1961 / Coal Mines Regulations 2017",yr:1952,j:"India – Central",d:["Mines"],a:"Directorate General of Mines Safety (DGMS)",s:"Repealed (subsumed)",sum:"Mines Act subsumed in OSH Code (Part on mines); Regulations continue. Relevant to quarries, crushers and earth-extraction supplying construction. DGMS circulars on blasting vibration, HEMM, dump design, mine managers' certification.",key:["Quarry: mine manager (permanent 2nd class), notice of opening, DGMS approval of plans","Benches, haul roads (gradient 1 in 16), dump slope; blasting by competent person","Fatal/serious accident: notice to DGMS Regional Inspector forthwith; Form IV-A"],url:"https://www.dgms.gov.in"},
{id:"pli-act",t:"Public Liability Insurance Act, 1991",yr:1991,j:"India – Central",d:["Chemical","Environment"],a:"District Collector (relief); MoEFCC",s:"In force",sum:"Owners handling hazardous substances above notified quantities must carry public liability insurance to pay immediate no-fault relief to victims of accidents; contribute to Environmental Relief Fund.",key:["Accident report to Collector; relief application within 5 years"],url:"https://moef.gov.in"},
{id:"dm-act",t:"Disaster Management Act, 2005 (as amended 2025) & NDMA Guidelines",yr:2005,j:"India – Central",d:["Chemical","Fire","Environment"],a:"NDMA; State DMAs (KSDMA, TNSDMA); District DMAs",s:"In force",sum:"National framework for disaster preparedness. NDMA Guidelines on Chemical (Industrial) Disasters 2007, Fire Safety, Heat Wave Action Plans, Lightning. Industrial sites feed into District Disaster Management Plans.",key:["District Collector powers during emergency (s.34); requisition of resources","Heat action plans (TN and Karnataka) inform outdoor-work scheduling"],url:"https://ndma.gov.in"},
{id:"nbc-2016",t:"National Building Code of India 2016 (SP 7) – Part 4 Fire & Life Safety; Part 7 Construction Management, Practices & Safety",yr:2016,j:"India – Central",d:["Construction","Fire"],a:"Bureau of Indian Standards (BIS); adopted by state building rules",s:"In force",sum:"Part 4 sets occupancy-based fire protection (travel distance, refuge areas, fire pumps, sprinklers above 15 m / by occupancy). Part 7 covers construction practices and safety: scaffolds, formwork, excavation, demolition, temporary works, site organisation, safety in construction (clause 11), and is mandatory where adopted by state building rules (TN CDBR 2019; Karnataka Model Building Bye-laws).",key:["Part 7 Sec. 2 – Construction practices; Sec. 3 – Demolition; Sec. 4 – Safety management (safety plan, safety officer, training, PTW, PPE)","Part 4 – high-rise definition ≥ 15 m; fire NOC from State Fire Service"],url:"https://www.bis.gov.in"},
{id:"bis-construction",t:"BIS Codes for Construction Safety (IS 3696, IS 4014, IS 3764, IS 4130, IS 4081, IS 13430, IS 7205, IS 13367, IS 14489, IS 3786)",yr:0,j:"India – Central",d:["Construction","PPE/Equipment","Management System"],a:"Bureau of Indian Standards",s:"In force",sum:"Key Indian Standards referenced in BOCW/state rules and contracts.",key:["IS 3696 Pt 1 (scaffolds) & Pt 2 (ladders) – safety code","IS 4014 Pt 1/2 – steel tubular scaffolding","IS 3764 – excavation work safety code; IS 4130 – demolition of buildings; IS 4081 – blasting and drilling in construction","IS 7205 – safety code for erection of structural steelwork; IS 7969 – handling & storage of building materials; IS 7293 – handling cement","IS 13430 – safety during additional construction/alteration of existing buildings; IS 13416 Pt 1–5 – preventive measures against hazards (falls, falling objects, heat, fire, drowning)","IS 13367 Pt 1 – safe use of cranes; IS 807 / IS 3177 – crane design; IS 4573 – power-driven mobile cranes","IS 14489 – code of practice on occupational safety and health audit; IS 3786 – computation of injury frequency/severity rates","IS 18001:2007 – OHSMS (Indian standard; largely replaced in practice by IS/ISO 45001)"],url:"https://www.bis.gov.in"},
{id:"bis-ppe",t:"BIS PPE & Equipment Standards (IS 2925, IS 15298, IS 3521, IS 5983, IS 9167, IS 9473, IS 2190, IS 15683, IS 3043, IS 732, IS 5216)",yr:0,j:"India – Central",d:["PPE/Equipment","Electrical","Fire"],a:"Bureau of Indian Standards",s:"In force",sum:"Procure PPE and site equipment to these marks (ISI mark where under compulsory certification — safety helmets, footwear, goggles are under Quality Control Orders).",key:["IS 2925 – industrial safety helmets (QCO); IS 15298 Pt 2 – safety footwear (QCO); IS 5983 – eye protectors; IS 9167 – ear protectors; IS 9473 – respiratory filters; IS 3521 Pt 1–3 – industrial safety harness, lanyards, anchors (fall arrest)","IS 2190 – selection, installation & maintenance of portable fire extinguishers; IS 15683 – portable extinguishers performance","IS 3043 – earthing; IS 732 – electrical wiring installations; IS 5216 – safety procedures in electrical work; IS 13252 – IT equipment safety","IS 4379 – colour coding of gas cylinders; IS 818 – safety in welding; IS 3016 – fire precautions in welding/cutting"],url:"https://www.bis.gov.in"},
{id:"oisd",t:"OISD Standards (OISD-STD-105 Work Permit, 116/117 Fire Protection, 118 Layouts, 160 LPG, GDN-206 Safety Audit)",yr:0,j:"India – Central",d:["Oil & Gas","Chemical","Fire"],a:"Oil Industry Safety Directorate (MoPNG)",s:"In force",sum:"Mandatory for the Indian oil & gas sector and widely adopted by petrochemical and process plants as good practice. OISD-STD-105 is the de-facto Indian permit-to-work benchmark.",key:["OISD-STD-105 – work permit system (hot, cold, confined space, excavation, electrical, vehicle entry); gas test limits (LEL 0% for hot work in process areas)","OISD-STD-118 – inter-unit safety distances; OISD-STD-116 – fire protection in refineries","OISD-GDN-206 – external safety audit; OISD-STD-163 – process safety management"],url:"https://www.oisd.gov.in"},
{id:"radiation",t:"Atomic Energy (Radiation Protection) Rules, 2004 – Industrial Radiography & Nucleonic Gauges",yr:2004,j:"India – Central",d:["Radiation","Construction","Factories"],a:"Atomic Energy Regulatory Board (AERB)",s:"In force",sum:"NDT radiography on sites (pipeline welds, pressure vessels) needs AERB-licensed agency, Radiological Safety Officer, certified radiographers, cordoned area (boundary 1 µSv/h), source storage pit, transport approval, and personnel dosimetry (TLD).",key:["AERB Safety Code AERB/RF-IR/SC-1 – industrial radiography; e-LORA licensing","Radiography generally at night or in enclosed bays; public dose limit 1 mSv/yr; worker 20 mSv/yr (avg over 5 yrs)"],url:"https://www.aerb.gov.in"},
{id:"child-labour",t:"Child and Adolescent Labour (Prohibition and Regulation) Act, 1986 (amended 2016)",yr:1986,j:"India – Central",d:["Welfare/Labour","Construction"],a:"District Magistrate; Labour Department",s:"In force",sum:"No child < 14 in any occupation; adolescents (14–18) barred from hazardous occupations/processes (mines, inflammable substances/explosives, hazardous processes under Factories/OSH Code – includes construction). Age verification records at site gate.",key:["Penalty: imprisonment 6 months–2 years and/or fine; repeat offence stricter","Construction, demolition, brick kilns, welding, chemicals listed as hazardous for adolescents"],url:"https://labour.gov.in"},
{id:"mv-act",t:"Motor Vehicles Act, 1988 & CMV Rules 1989 – Site Vehicles and Earth-Moving Equipment",yr:1988,j:"India – Central",d:["Transport","Construction"],a:"State Transport Department (RTO)",s:"In force",sum:"Registration and fitness of tippers, transit mixers, mobile cranes; construction equipment vehicles (CEV) registration; driver licensing; overloading; reversing alarms/AIS standards; working near public roads (IRC SP 55 traffic management during construction).",key:["CEV: registration, fitness, trained operator; IRC:SP:55 – temporary traffic control; IRC 35 road markings","Speed limits on site (typically 10–20 km/h) set by site rules"],url:"https://morth.nic.in"},
{id:"ghs-india",t:"GHS / Safety Data Sheets in India – MSIHC Rule 17 & Schedule 9, draft GHS alignment",yr:2021,j:"India – Central",d:["Chemical"],a:"MoEFCC; BIS",s:"Draft",sum:"India has not fully mandated UN GHS; MSIHC Rule 17 requires an MSDS in the Schedule 9 format and labelling. Draft MSIHC amendments propose GHS-based classification. Industry practice: supply 16-section GHS SDS (IS/ISO 11014) and GHS pictogram labels.",key:["Use 16-section SDS (ISO 11014 / ANSI Z400.1 / UN GHS Annex 4) as the working format","Label: product identifier, signal word, hazard pictograms, H & P statements, supplier"],url:"https://moef.gov.in"},
{id:"dgfasli-policy",t:"National Policy on Safety, Health and Environment at Workplace (2009) & DGFASLI",yr:2009,j:"India – Central",d:["Management System","Factories","Construction"],a:"Directorate General Factory Advice Service & Labour Institutes (DGFASLI)",s:"In force",sum:"National policy framework; DGFASLI issues model rules, safety guidance, and runs Central Labour Institutes (Mumbai, Kanpur, Chennai, Kolkata, Faridabad). Dock Safety Inspectorate for ports.",key:["Model Factories Rules (reference for state rules); Guidance on safety audit, HIRA, process safety","Dock Workers (Safety, Health & Welfare) Regulations 1990 – port/cargo handling (subsumed into OSH Code)"],url:"https://dgfasli.gov.in"},
{id:"shram-suvidha",t:"Shram Suvidha Portal – Unified Registration & Annual Returns",yr:2014,j:"India – Central",d:["Welfare/Labour","Management System"],a:"MoLE",s:"In force",sum:"Single online portal for Labour Identification Number (LIN), registration under OSH Code/Central Rules (Form I), unified annual return, and inspection reports for central-sphere establishments; many states integrate via their own portals (Karnataka e-Shrama/Seva Sindhu; Tamil Nadu DISH online).",key:["Update existing registration details within 6 months of 8 May 2026 (i.e. by 8 Nov 2026) – Central Rules"],url:"https://shramsuvidha.gov.in"},

{id:"ka-factories-rules",t:"Karnataka Factories Rules, 1969",yr:1969,j:"Karnataka",d:["Factories","Chemical","Health"],a:"Department of Factories, Boilers, Industrial Safety & Health (DFBISH / FBISH), Govt of Karnataka – e-Surakshate portal",s:"In force (transition)",sum:"State rules under the Factories Act: approval of plans, licensing (Forms), hazardous process chapter (Rules 88-A to 88-P: H&S policy, OHC, ambulance van, Safety Committee 88-B, chemical disclosure), machine guarding (Rule 56 Schedules I–VII), lifting machines (Rules 58/59, Forms 6/7), pressure vessels (Rule 61, Form 8), thermic-fluid heaters (Rule 65-B), PPE (Rule 65/88), fire (Rule 66), ventilation (Rule 19), dangerous operations (Rule 129, 26+ Schedules), welfare. Remain the working technical standard until the OSH (Karnataka) Rules are final.",key:["Approval of plans & licence (online via DFBISH/Seva Sindhu); self-certification scheme 2024 for low-risk factories","Lifting machines/tackles tested every 12 months by competent person; pressure vessels (Rule 61) hydraulic test; hoists/lifts 6-monthly","Dangerous operations schedules (lead, chrome, electroplating, sand-blasting, solvents, asbestos, foundry, pesticides etc.) – medical examination by certifying surgeon","Notice of accident: fatal – immediate (phone/online) + written report within time prescribed (Form 18 – verify); non-fatal >48 h – within 24 h; dangerous occurrence – within 4 h (verify)","Safety Officer (Rule 100-series) qualifications; Safety Committee; occupational health centre for hazardous units (Rule 85-series)"],url:"https://labour.karnataka.gov.in",note:"Form numbers and timelines are state-specific — confirm against the current consolidated rules on the DFBISH site."},
{id:"ka-safety-audit",t:"Karnataka Factories (Safety Audit) Rules, 2024",yr:2024,j:"Karnataka",d:["Factories","Management System","Chemical"],a:"DFBISH, Karnataka",s:"In force",sum:"Mandatory periodic safety audit of factories (hazardous-process / MAH units and other notified categories) by empanelled external safety auditors, with audit report submission and closure of findings.",key:["Audit by Chief Inspector-recognised auditor; frequency (annual for hazardous, as notified for others – verify)","Report in prescribed format; compliance action plan; follow IS 14489 methodology"],url:"https://labour.karnataka.gov.in"},
{id:"ka-factories-amend-2023",t:"Factories (Karnataka Amendment) Act, 2023",yr:2023,j:"Karnataka",d:["Factories","Welfare/Labour"],a:"Govt of Karnataka",s:"In force (transition)",sum:"Allowed daily working hours up to 12 h (within 48 h/week) with consent, raised quarterly overtime limit to 145 h, and permitted women on night shifts (7 pm–6 am) subject to safeguards (transport, CCTV, security, batches, written consent). Now read alongside OSH Code s.25–s.27, s.43.",key:["Women night shift conditions: free transport with security, well-lit premises, not less than 10 women per shift (typical), anti-harassment committee","Spread-over up to 12 h; compensatory rest"],url:"https://labour.karnataka.gov.in"},
{id:"ka-osh-rules",t:"Draft Occupational Safety, Health and Working Conditions (Karnataka) Rules, 2026",yr:2026,j:"Karnataka",d:["Factories","Construction","Welfare/Labour"],a:"Labour Department, Govt of Karnataka (Notification LD 245 LET 2021, 23 Jan 2026)",s:"Draft",sum:"Draft state rules under the OSH Code published 23 Jan 2026 (objections to 9 Mar 2026). Cover registration, employer duties (annual health exam, accident/dangerous-occurrence notice, disease notice), Safety Committee & Safety Officer, working hours, registers & returns, Inspector-cum-Facilitator, women's night work, dangerous operations. Final notification status: verify with Labour Department.",key:["Until final: apply Karnataka Factories Rules 1969 / Karnataka BOCW Rules 2006 technical provisions, and OSH Code sections directly","Expect Form numbering aligned to Central Rules (Form XI accident notice)"],url:"https://labour.karnataka.gov.in"},
{id:"ka-bocw-rules",t:"Karnataka Building and Other Construction Workers (Regulation of Employment and Conditions of Service) Rules, 2006",yr:2006,j:"Karnataka",d:["Construction","Welfare/Labour"],a:"Labour Department; Karnataka Building & Other Construction Workers Welfare Board (KBOCWWB)",s:"In force (transition)",sum:"State construction safety rules: registration of establishments, cess (1%), worker registration, and detailed safety chapters mirroring Central Rules 1998 (scaffolds, excavation, demolition, lifting appliances, electrical, PPE, welfare, first aid, canteen, crèche, safety committee/officer).",key:["Safety Officer for sites with 500+ workers (Rule – verify); Safety Committee; site safety plan","Lifting appliance test certificate (Form – verify) by competent person every 12 months; daily checks","Accident notice to Registering Officer/Inspector; fatal – within 4 h (verify) and police","Welfare: drinking water, latrines (1 per 20 up to 100), washing, rest shed, crèche (50+ women workers), first-aid boxes, ambulance arrangement"],url:"https://labour.karnataka.gov.in"},
{id:"ka-shops",t:"Karnataka Shops and Commercial Establishments Act, 1961 (amended 2026)",yr:1961,j:"Karnataka",d:["Welfare/Labour"],a:"Labour Department, Karnataka",s:"In force",sum:"Covers offices, site offices, IT and commercial premises. The Karnataka Shops and Commercial Establishments (Amendment) Act 2026 (notified 4 Sept 2026) removes duplicate registration for establishments registered under OSH Code s.3 and applies the SS Code mutatis mutandis.",key:["Women night work: driver antecedent verification, route planning, vehicle monitoring (stricter than OSH rules)","Working hours 9/day, 48/week; OT 2x"],url:"https://labour.karnataka.gov.in"},
{id:"ka-fire",t:"Karnataka Fire Force Act, 1964 & Karnataka State Fire and Emergency Services NOC Rules",yr:1964,j:"Karnataka",d:["Fire","Construction"],a:"Karnataka State Fire and Emergency Services (KSFES)",s:"In force",sum:"Fire NOC (clearance) for buildings ≥ 15 m high and specified occupancies (industrial, hazardous storage, assembly); provisional NOC at plan stage, final NOC before occupancy; annual renewal/ inspection. Fire-fighting requirements per NBC Part 4.",key:["Industrial buildings: fire hydrant ring main, extinguishers (IS 2190), automatic detection; high-hazard – sprinklers, foam","Site: fire extinguishers within 15 m of hot work; fire watch; emergency assembly point"],url:"https://ksfes.karnataka.gov.in"},
{id:"ka-lifts",t:"Karnataka Lifts, Escalators and Passenger Conveyors Act, 2012 & Rules",yr:2012,j:"Karnataka",d:["PPE/Equipment","Construction","Electrical"],a:"Chief Electrical Inspector to Government, Karnataka",s:"In force",sum:"Licence to erect and operate lifts/escalators (including temporary builder's hoists where applicable under BOCW rules); annual inspection; competent person certificate; accident reporting to Electrical Inspectorate.",key:["Erection permission → inspection → licence to work; renewal; AMC by licensed agency","Passenger/material hoists on sites: BOCW rules + IS 4014/IS 3696 for hoistways; operator competence"],url:"https://ceig.karnataka.gov.in"},
{id:"kspcb",t:"Karnataka State Pollution Control Board – Consents, Authorisations & Construction Dust Guidelines",yr:0,j:"Karnataka",d:["Environment","Construction"],a:"KSPCB",s:"In force",sum:"CTE/CTO under Air & Water Acts via the XGN portal; HW authorisation; lake & buffer-zone protection norms (NGT/KSPCB mandates around Bellandur, Varthur and Peenya industrial basins); mandatory OCEMS for the 17 highly polluting categories; mandatory STP dual-piping reuse for commercial/industrial complexes in Bengaluru; authorised TSDFs at Dobbaspet and Harohalli; C&D waste; noise (Bengaluru construction-noise regulation); Bengaluru dust-control checklist (barricading ≥ 3 m, covered transport, wheel wash, water sprinkling, no on-site burning).",key:["Red/Orange/Green/White categories; consent validity by category; bank guarantee for non-compliance","Diesel generator: KSPCB noise & emission norms; DG > 1 MVA needs separate consent"],url:"https://kspcb.karnataka.gov.in"},
{id:"ka-building",t:"Karnataka Model Building Bye-laws / BBMP Building Bye-laws & Karnataka Town and Country Planning Act, 1961",yr:2003,j:"Karnataka",d:["Construction","Fire"],a:"BBMP / Urban Local Bodies / BDA; Urban Development Department",s:"In force",sum:"Building plan sanction, commencement certificate, occupancy certificate; structural stability certification; NBC adoption; Karnataka Municipal Corporations Model Building (Amendment) Bye-laws 2024 (Feb 2025 notification) – verify specifics on green building, setbacks, and construction safety conditions (barricades, hoardings, worker facilities).",key:["Demolition permission for structures; neighbouring structure protection","Occupancy certificate requires fire NOC, lift licence, KSPCB consent (STP) for large projects"],url:"https://bbmp.gov.in"},
{id:"ka-groundwater",t:"Karnataka Ground Water (Regulation and Control of Development and Management) Act, 2011",yr:2011,j:"Karnataka",d:["Environment","Construction"],a:"Karnataka Ground Water Authority",s:"In force",sum:"Permission for borewells in notified areas; construction dewatering and water use permissions; rainwater harvesting mandates (BWSSB in Bengaluru).",key:["Dewatering discharge must not pollute drains; obtain NOC for bulk extraction"],url:"https://karnataka.gov.in"},
{id:"ka-labour-welfare",t:"Karnataka Labour Welfare Fund Act, 1965 & Karnataka Industrial Establishments (National & Festival Holidays) Act, 1963",yr:1965,j:"Karnataka",d:["Welfare/Labour"],a:"Karnataka Labour Welfare Board",s:"In force",sum:"Annual contribution (employee/employer) by 15 Jan; holidays entitlement. Useful for site HR compliance calendar.",key:[],url:"https://labour.karnataka.gov.in"},
{id:"ka-boilers",t:"Karnataka Boiler Rules & Boiler Inspectorate (DFBISH)",yr:0,j:"Karnataka",d:["Pressure/Boilers"],a:"Chief Inspector of Boilers, DFBISH Karnataka",s:"In force",sum:"State implementation of the Boilers Act 2025 / IBR: registration, annual inspection, repairs by IBR-approved repairers, boiler attendant exams.",key:[],url:"https://labour.karnataka.gov.in"},

{id:"tn-factories-rules",t:"Tamil Nadu Factories Rules, 1950",yr:1950,j:"Tamil Nadu",d:["Factories","Chemical","Health"],a:"Directorate of Industrial Safety and Health (DISH), Govt of Tamil Nadu",s:"In force (transition)",sum:"State rules under the Factories Act: ventilation (Rule 17), machine guarding (Rule 53 Schedules I–VIII), lifting machines (Rules 55/55A, Forms 8/9), pressure vessels (Rule 56, Form 8-A), fire (Rule 61-A), PPE/harness (Rules 61-B, 61-O), ovens/driers/thermic-fluid heaters (61-D/61-E), hazardous-process chapter (Rules 61-F to 61-T: site appraisal, SDS, medical exams, OHC, ambulance van, decontamination), dangerous operations (Rule 95, 30+ Schedules incl. Sch. XVI chemical works). Frequently amended (2019 licence validity; 2022 first-aid training providers; 2023 rule deletions; 2025 – Schedule XX asbestos processes, explosives-rules references, online payment). Remain the working technical standard until TN OSH rules are fully final.",key:["Licensing & renewal (multi-year), approval of plans (Form 1), online via DISH portal; fees online","Rule 61 pressure vessels; Rule 55A lifting machines & tackles (competent person annual test); Rule 95 dangerous operations (Schedules I–XX incl. asbestos Sch. XX 2025); Rule 63-B first aid training (St John / TN Apex Skill Development Centre for Health Care)","Notice of accident/dangerous occurrence: fatal – immediate + written (Form 18 – verify) to Inspector, DM/Police; non-fatal >48 h absence – 24 h","Safety Officer & Safety Committee rules; occupational health centre; medical examination (Form 17/18 – verify)"],url:"https://dish.tn.gov.in",note:"DISH TN posts every amendment GO/SRO as PDF — the 2025 amendments (SRO A-17/2025 draft, SRO A-27/2025, SRO A-29/2025) are on dish.tn.gov.in."},
{id:"tn-factories-amend-2023",t:"Factories (Amendment) Act, 2023 (Tamil Nadu) – 12-hour flexible working",yr:2023,j:"Tamil Nadu",d:["Factories","Welfare/Labour"],a:"Govt of Tamil Nadu",s:"In force (transition)",sum:"Passed April 2023 to permit 12-hour shifts (within 48 h/week) with consent; implementation was put on hold by the State Government following objections. With the OSH Code in force, working-hour provisions now flow from OSH Code s.25 and the (pending) TN OSH rules. Verify current position before applying 12-h rosters.",key:[],url:"https://dish.tn.gov.in"},
{id:"tn-osh-rules",t:"Occupational Safety, Health and Working Conditions (Tamil Nadu) Rules – draft / partly notified",yr:2026,j:"Tamil Nadu",d:["Factories","Construction","Welfare/Labour"],a:"Labour Welfare and Skill Development Department, Govt of Tamil Nadu",s:"Draft",sum:"Tamil Nadu has notified parts of its OSH and IR rules and others remain draft (as reported mid-2026). Until fully notified, TN Factories Rules 1950 and TN BOCW Rules 2006 continue to operate for technical compliance; OSH Code sections apply directly.",key:["Track DISH TN and Labour Dept gazette notifications; align registers to Central Rules formats in the interim"],url:"https://labour.tn.gov.in"},
{id:"tn-bocw-rules",t:"Tamil Nadu Building and Other Construction Workers (Regulation of Employment and Conditions of Service) Rules, 2006 (amended May 2025)",yr:2006,j:"Tamil Nadu",d:["Construction","Welfare/Labour"],a:"Labour Welfare & Skill Development Dept; TN Construction Workers Welfare Board",s:"In force (transition)",sum:"State construction safety and welfare rules; amended by SRO A-16/2025 (27 May 2025 – verify content). Mirror Central Rules 1998 technical chapters; cess 1%; worker registration and benefits.",key:["Site safety plan, safety officer (500+ workers), safety committee, first-aid, canteen (250+), crèche, drinking water, latrines, rest shelters","Scaffold inspection by responsible person before use/every 7 days & after weather; excavation shoring > 1.5 m; lifting gear test certificates; hoists","Accident reporting to Inspector (Form – verify); dangerous occurrences list"],url:"https://dish.tn.gov.in"},
{id:"tn-shops",t:"Tamil Nadu Shops and Establishments Act, 1947 & Catering Establishments Act, 1958",yr:1947,j:"Tamil Nadu",d:["Welfare/Labour"],a:"Labour Department (Deputy Commissioner of Labour)",s:"In force",sum:"Registration (online), working hours, holidays, women's night work (permitted 2019 with safeguards), welfare for offices/project offices.",key:["Women night work: transport, security, consent, 5+ women per shift (verify), POSH committee"],url:"https://labour.tn.gov.in"},
{id:"tn-fire",t:"Tamil Nadu Fire Service Act, 1985 & TN Fire and Rescue Services Fire Licence / NOC",yr:1985,j:"Tamil Nadu",d:["Fire","Construction"],a:"Tamil Nadu Fire and Rescue Services (TNFRS)",s:"In force",sum:"Fire NOC required for buildings per TN Combined Development and Building Rules 2019 (special buildings ≥ 15 m / specified occupancies, industrial and hazardous buildings), fire licence for hazardous storage; annual renewal and inspection; fire-fighting as per NBC Part 4.",key:["Provisional NOC at planning permit; final NOC before completion certificate","Industrial: hydrant system, water storage, detection, extinguishers; emergency lighting; mock drills 6-monthly"],url:"https://tnfrs.tn.gov.in"},
{id:"tn-cdbr",t:"Tamil Nadu Combined Development and Building Rules, 2019",yr:2019,j:"Tamil Nadu",d:["Construction","Fire"],a:"CMDA / DTCP / Local bodies",s:"In force",sum:"Single building code for TN: planning permission, building permit, completion certificate, structural safety, fire, lifts, rainwater harvesting; Rule on construction site safety and NBC adoption; dust/noise conditions in permits.",key:["Special buildings, multi-storeyed buildings; structural engineer/site engineer certification","Completion certificate needs fire NOC, lift licence, TNPCB consent (STP for > 50 flats or as applicable)"],url:"https://tn.gov.in"},
{id:"tn-lifts",t:"Tamil Nadu Lifts and Escalators Act, 1997 & Rules",yr:1997,j:"Tamil Nadu",d:["PPE/Equipment","Electrical","Construction"],a:"Chief Electrical Inspector to Government (CEIG), Tamil Nadu",s:"In force",sum:"Permission to erect and licence to operate lifts/escalators; annual inspection; accident intimation to CEIG.",key:[],url:"https://ceig.tn.gov.in"},
{id:"tnpcb",t:"Tamil Nadu Pollution Control Board – Consents, Authorisations & Construction Guidelines",yr:0,j:"Tamil Nadu",d:["Environment","Construction"],a:"TNPCB",s:"In force",sum:"CTE/CTO (online OCMMS), HW authorisation (TSDFs at Gummidipoondi and Virudhunagar), strict Zero Liquid Discharge for dyeing, bleaching and tannery clusters, G.O. Ms. No. 213 & 127 banning polluting industries within 1–5 km of the Cauvery, Bhavani, Palar and Tamirabarani rivers, C&D waste compliance, noise; Chennai construction dust guidelines; ready-mix concrete plant and hot-mix plant siting norms; Ennore/Manali chemical corridor MAH coordination.",key:["Red/Orange/Green/White categorisation; consent validity; bank guarantee","Construction: barricading, sprinkling, covered trucks, wheel wash, no open burning"],url:"https://tnpcb.gov.in"},
{id:"tn-groundwater",t:"Tamil Nadu Groundwater (Development and Management) Act, 2003 & Chennai Metropolitan Area Groundwater Act, 1987",yr:2003,j:"Tamil Nadu",d:["Environment","Construction"],a:"TN Water Resources Dept; CMWSSB",s:"In force",sum:"Permits for borewells/extraction in notified areas and Chennai metro; construction dewatering and water tanker sourcing conditions; rainwater harvesting compulsory (TN since 2003).",key:[],url:"https://tn.gov.in"},
{id:"tn-labour-welfare",t:"Tamil Nadu Labour Welfare Fund Act, 1972 & TN Industrial Establishments (National and Festival Holidays) Act, 1958",yr:1972,j:"Tamil Nadu",d:["Welfare/Labour"],a:"TN Labour Welfare Board",s:"In force",sum:"Annual LWF contribution by 31 Jan; holiday entitlements (9 national/festival). Site HR calendar items.",key:[],url:"https://labour.tn.gov.in"},
{id:"tn-boilers",t:"Tamil Nadu Boiler Rules & Boiler Inspectorate (DISH)",yr:0,j:"Tamil Nadu",d:["Pressure/Boilers"],a:"Director of Boilers / DISH Tamil Nadu",s:"In force",sum:"State implementation of Boilers Act 2025 / IBR; registration, inspection, repairers, attendants.",key:[],url:"https://dish.tn.gov.in"},
{id:"tn-dish",t:"Directorate of Industrial Safety and Health (DISH), Tamil Nadu – portal, inspections & MAH units",yr:0,j:"Tamil Nadu",d:["Factories","Chemical","Management System"],a:"DISH TN (Labour Welfare & Skill Development Dept)",s:"In force",sum:"Enforcement authority for factories, MSIHC/MAH units (≈ 400+ MAH units in TN), boilers; online licensing, inspection reports, accident statistics; safety awards; Chennai, Coimbatore, Madurai, Trichy, Salem, Tirunelveli regional offices.",key:["MAH units: safety report, on-site plan, mock drills with District Crisis Group","Statutory competent persons list (lifting, pressure vessels, ventilation)"],url:"https://dish.tn.gov.in"},

{id:"osh-act-1970",t:"Occupational Safety and Health Act of 1970 – General Duty Clause §5(a)(1)",yr:1970,j:"USA (OSHA)",d:["Management System","Factories","Construction"],a:"OSHA (US Dept of Labor); NIOSH (research)",s:"In force",sum:"Employers must furnish a workplace free from recognised hazards likely to cause death or serious harm. Used to cite hazards without a specific standard (heat, ergonomics, workplace violence). State Plans (22 states) may be stricter.",key:["§5(a)(2) comply with standards; §11(c) anti-retaliation; §8 inspections; §17 penalties (2026 max ≈ $16k serious / $165k willful – inflation-adjusted annually)"],url:"https://www.osha.gov/laws-regs/oshact/completeoshact"},
{id:"osha-1926",t:"29 CFR Part 1926 – Safety and Health Regulations for Construction",yr:0,j:"USA (OSHA)",d:["Construction","Electrical","Fire","Chemical"],a:"OSHA",s:"In force",sum:"The OSHA construction standard. Most-cited: fall protection (1926.501), scaffolding (1926.451), ladders (1926.1053), HazCom (1926.59 → 1910.1200), eye & face PPE (1926.102), excavation (1926.651/652), silica (1926.1153).",key:["Subpart C general (1926.20 accident prevention programs, 1926.21 training); D health (1926.50 first aid, 1926.52 noise, 1926.55 air contaminants); E PPE (1926.95–106); F fire protection; G signs/signals; H rigging/materials handling; I tools; J welding; K electrical (GFCI/AEGCP 1926.404); L scaffolds (competent person, 1926.451 – guardrails above 10 ft, 4:1 height-to-base); M fall protection (6 ft trigger; 1926.502 systems; 1926.503 training); N cranes/derricks/hoists; P excavations (protective systems ≥ 5 ft; ladder every 25 ft if ≥ 4 ft; registered PE design > 20 ft; daily competent-person inspection); Q concrete/masonry; R steel erection; S underground; T demolition; U blasting; V power transmission; W rollover/overhead protection; X ladders/stairways; Z toxic substances (asbestos 1926.1101, lead 1926.62, silica 1926.1153 – 50 µg/m³ PEL); AA confined spaces in construction (1926.1200–1213); CC cranes & derricks (1926.1400 – operator certification, 1926.1408 power-line clearance 20 ft/Table A)"],url:"https://www.osha.gov/laws-regs/regulations/standardnumber/1926"},
{id:"osha-1910",t:"29 CFR Part 1910 – Occupational Safety and Health Standards (General Industry)",yr:0,j:"USA (OSHA)",d:["Factories","Chemical","Electrical","Fire","PPE/Equipment","Health"],a:"OSHA",s:"In force",sum:"General-industry standard applied to manufacturing, warehousing, process plants.",key:["1910.22–30 walking-working surfaces & fall protection (4 ft); 1910.36–38 exit routes & Emergency Action Plans; 1910.95 noise (85 dB(A) action level, hearing conservation); 1910.119 Process Safety Management (14 elements; HHC list App. A); 1910.120 HAZWOPER; 1910.132–138 PPE (hazard assessment 1910.132(d)); 1910.134 respiratory protection (fit test, medical eval); 1910.146 permit-required confined spaces; 1910.147 control of hazardous energy (LOTO – annual periodic inspection); 1910.157 extinguishers; 1910.176–184 materials handling, 1910.178 powered industrial trucks, 1910.179 overhead cranes, 1910.184 slings; 1910.212 machine guarding; 1910.252–255 welding; 1910.301–335 electrical (1910.333 lockout/energised work); 1910.1000 air contaminants (PELs Z-tables); 1910.1001 asbestos; 1910.1025 lead; 1910.1030 bloodborne pathogens; 1910.1053 silica; 1910.1200 Hazard Communication (GHS Rev. 7 aligned 2024 update – labels, SDS, training)"],url:"https://www.osha.gov/laws-regs/regulations/standardnumber/1910"},
{id:"osha-1904",t:"29 CFR Part 1904 – Recording and Reporting Occupational Injuries and Illnesses",yr:0,j:"USA (OSHA)",d:["Management System","Health"],a:"OSHA",s:"In force",sum:"OSHA 300 Log, 300A Summary (post 1 Feb–30 Apr; electronic submission by 2 March for covered establishments ≥ 20/100 employees), 301 Incident Report (within 7 days). Reporting: fatality within 8 h; in-patient hospitalisation, amputation, eye loss within 24 h.",key:["Recordable = death, days away, restricted/transfer, medical treatment beyond first aid, loss of consciousness, significant injury/illness","Keep 5 years; employee access"],url:"https://www.osha.gov/recordkeeping"},
{id:"osha-heat-nep",t:"OSHA Heat Injury & Illness – National Emphasis Program CPL 03-00-024 (10 Apr 2026) & proposed 29 CFR 1910.148 rule",yr:2026,j:"USA (OSHA)",d:["Health","Construction"],a:"OSHA",s:"Enforcement guidance",sum:"No final federal heat standard as of Oct 2026 (supplemental NPRM expected Dec 2026; final rule unlikely before 2028–29). The revised NEP (effective 10 Apr 2026) drives inspections in construction, energy, manufacturing, warehousing; citations issue under the General Duty Clause. Seven states (CA, CO, MD, MN, NV, OR, WA) have their own heat rules.",key:["NEP inspection checklist: heat-illness plan, water/rest/shade, acclimatisation for new & returning workers (documented ramp-up), monitoring (heat index/WBGT), training, emergency response","Planning assumption: build a Heat Illness Prevention Program now (water, rest, shade, acclimatisation, buddy system)"],url:"https://www.osha.gov/heat"},
{id:"osha-maritime-ag",t:"29 CFR 1915 / 1917 / 1918 (Shipyards, Marine Terminals, Longshoring) & 1928 (Agriculture)",yr:0,j:"USA (OSHA)",d:["Factories","Transport"],a:"OSHA",s:"In force",sum:"Sector standards for shipyards, ports and agriculture — relevant for port construction, marine works and jetty projects.",key:[],url:"https://www.osha.gov/laws-regs/regulations/standardnumber"},
{id:"niosh-acgih",t:"NIOSH RELs / Pocket Guide; ACGIH TLVs & BEIs; NIOSH Lifting Equation",yr:0,j:"USA (OSHA)",d:["Health","Chemical"],a:"NIOSH (CDC); ACGIH (private)",s:"In force",sum:"Reference exposure limits often stricter than OSHA PELs; ACGIH TLVs for heat stress (WBGT), noise, chemicals; NIOSH Lifting Equation (RWL, 23 kg load constant); NIOSH criteria documents. Indian Factories Act Schedule II PELs were largely derived from ACGIH TLVs.",key:["IDLH values for confined space / respirator selection","NIOSH Pocket Guide to Chemical Hazards – quick reference for SDS verification"],url:"https://www.cdc.gov/niosh"},
{id:"ansi-assp",t:"ANSI/ASSP Standards: Z10 (OHSMS), Z359 (Fall Protection), A10 series (Construction), Z117.1 (Confined Space), Z244.1 (LOTO), Z87.1 (Eye), Z89.1 (Head), Z490.1 (Training)",yr:0,j:"USA (OSHA)",d:["Management System","PPE/Equipment","Construction"],a:"ANSI / American Society of Safety Professionals",s:"In force",sum:"Voluntary consensus standards frequently incorporated by reference by OSHA and in international contracts.",key:["Z359.1–.18 fall protection code (harness, SRL, rescue, anchorage ≥ 5,000 lb/22 kN); A10.32 fall protection in construction","Z244.1 hazardous energy control (alternative methods); Z117.1 confined space (ventilation, rescue)","ASTM F2413 safety footwear; ANSI/ISEA 107 hi-vis; ANSI/ISEA 121 dropped objects"],url:"https://www.assp.org/standards"},
{id:"nfpa",t:"NFPA Codes: 70 (NEC), 70E (Electrical Safety in the Workplace), 70B, 10, 13, 25, 30, 51B (Hot Work), 72, 101, 241 (Construction/Demolition Fire Safety), 350 (Confined Space), 652/654 (Combustible Dust), 1600, 2112",yr:0,j:"USA (OSHA)",d:["Fire","Electrical","Chemical"],a:"National Fire Protection Association",s:"In force",sum:"Widely adopted internationally. NFPA 70E arc-flash risk assessment, PPE categories & boundaries; NFPA 51B hot-work permit (35 ft/11 m combustible clearance, 30–60 min fire watch + 3 h monitoring); NFPA 241 fire safety during construction, alteration and demolition; NFPA 30 flammable liquids storage cabinets/rooms; NFPA 652 Dust Hazard Analysis.",key:["NFPA 70E: energised work permit, shock & arc-flash boundaries, qualified person; 2024 edition","NFPA 10 extinguisher travel distance 75 ft (Class A), 30/50 ft (Class B)"],url:"https://www.nfpa.org/codes-and-standards"},
{id:"asme",t:"ASME B30 series (Cranes, Hoists, Slings), B56 (Industrial Trucks), A17.1 (Elevators), BPVC (Pressure Vessels), B31 (Piping)",yr:0,j:"USA (OSHA)",d:["PPE/Equipment","Pressure/Boilers","Construction"],a:"American Society of Mechanical Engineers",s:"In force",sum:"Design, inspection and operation standards; B30.5 mobile cranes (frequent/periodic inspection), B30.9 slings, B30.26 rigging hardware; ASME BPVC Section VIII vessels (reference for IBR/SMPV equivalence).",key:[],url:"https://www.asme.org/codes-standards"},

{id:"ptw",t:"Permit-to-Work (PTW) System",cat:"Management",tags:["Construction","Industrial","Chemical","Oil & Gas"],purpose:"Control non-routine, high-risk work by making hazards, precautions, isolations and authorisations explicit and signed before work starts, and by formally handing the area back afterwards.",scope:"Hot work, confined space entry, work at height, excavation, electrical (energised/HT), lifting with cranes, radiography, working on pressurised/chemical systems, roof work, demolition, vehicle entry to process areas, night work in restricted areas.",roles:["Permit Issuer / Area Authority (operations owner of the area)","Permit Receiver / Performing Authority (supervisor of the work party)","Isolating Authority (electrical/process)","Gas Tester (competent)","Safety Officer (audit, not routine signatory)","Fire Watch / Standby person where required"],hazards:["Undetected residual energy or pressure","Simultaneous operations (SIMOPS) interacting","Unclear boundaries or expiry leading to work continuing in changed conditions","Permit treated as paperwork rather than control"],pre:["Written PTW procedure approved by site management; permit types and forms defined (OISD-STD-105 / HSG250 as model)","Trained and authorised issuers/receivers (register of signatories with validity)","Permit board or e-PTW register visible at control point","Risk assessment / JSA attached for the task","Isolation certificates (electrical, process) and gas test where applicable"],steps:["Define the job: location (tag/grid), equipment ID, description, duration, number of persons.","Identify hazards with the receiver on site (walk-down), referencing the JSA/HIRA.","Specify precautions: isolations (lock/tag numbers), draining/purging, gas test limits, barricading, fire watch, rescue arrangements, PPE.","Check SIMOPS: cross-reference other live permits in the area; attach interlocks (e.g. no hot work while confined-space entry open below).","Issuer and receiver sign; display original at worksite, copy at control point/permit board.","Validity: typically one shift (max 8–12 h); extension only by re-verification and re-signature; gas test repeated at intervals and after breaks.","Supervisor carries out toolbox talk on permit conditions with the crew; crew signs attendance.","During work: receiver stays on site; stop work if conditions change (alarm, weather, new work nearby); issuer or safety officer audit a sample of permits daily.","Suspend permit for emergencies/alarms; re-validate before resumption.","Close-out: receiver confirms area clean, tools removed, guards/covers refitted; issuer inspects and signs close; de-isolation only after closure of all permits on that isolation.","File permits for the retention period (typically ≥ 1 year; 3 years for MAH units) and trend audit findings."],ppe:["As specified per permit type"],stop:["Gas reading beyond limits","Fire/gas alarm or site emergency","Permit expired or signatory absent","Unexpected energy source found"],records:["Permit forms (numbered), isolation register, gas-test log, permit audit sheet"],refs:{india:["Factories Act s.24 (devices for cutting off power) & s.37 (precautions before applying heat) – legacy basis; IS 17893:2023 Work Permit System code of practice (7 permit types); IS 11006 flashback arrestors","OSH Code 2020 s.6 (safe systems of work); Ch. XII hazardous processes","OISD-STD-105 Work Permit System (benchmark)","Factories Act s.36 / state Factories Rules – certificate for confined space; MSIHC Rule 4","Petroleum Rules 2002 Rule 118 – hot work in licensed premises","NBC 2016 Part 7 Sec. 4 – safety management"],ka:["Karnataka Factories Rules 1969 Rule 129 Schedule XVI (chemical works): written permits, blinding/disconnection, purging, gas-free certificate","Karnataka Factories Rules 1969 (confined space certificate; hot work in hazardous areas)","Karnataka BOCW Rules 2006 – site safety plan"],tn:["TN Factories Rules 1950 Rule 95 Schedule XVI (chemical works): written permits, mechanical isolation (blinding/disconnecting pipelines), gas-free certification by competent person","TN Factories Rules 1950 – Rule on dangerous fumes/certificate of safety","TN BOCW Rules 2006"],osha:["1910.146 (PRCS entry permit), 1910.147 (LOTO), 1926.1204, 1910.252/NFPA 51B hot work permit, NFPA 70E energised electrical work permit","OSHA PSM 1910.119(k) hot work permit"],intl:["HSE HSG250 Guidance on permit-to-work systems","ISO 45001 cl. 8.1 operational planning & control","ILO Code of Practice – Construction (permit systems)"]},checklist:"cl-hotwork"},
