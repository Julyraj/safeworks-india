{id:"ec-act",t:"Energy Conservation Act, 2001 (as amended 2022) & Bureau of Energy Efficiency (BEE)",yr:2022,j:"India – Central",d:["Energy/Carbon/ESG","Factories","Management System"],a:"Ministry of Power; Bureau of Energy Efficiency (BEE); State Designated Agencies (KREDL – Karnataka; EMC – Tamil Nadu)",s:"In force",sum:"Parent law for energy efficiency and, since the 2022 amendment, for the Indian carbon market. Designated consumers (energy-intensive units above notified thresholds in sectors such as cement, iron & steel, aluminium, fertilizer, pulp & paper, chlor-alkali, textiles, refineries, petrochemicals, thermal power, DISCOMs, railways, large buildings) must appoint an energy manager, get mandatory energy audits by BEE-accredited auditors, file annual returns and meet PAT (Perform, Achieve and Trade) targets. The 2022 amendment enables the Carbon Credit Trading Scheme, mandates non-fossil energy use for designated consumers, and renames ECBC as the Energy Conservation and Sustainable Building Code.",key:["s.14 – designated consumers: energy manager, mandatory energy audit, annual energy return (Form 1/2) to BEE/SDA","PAT scheme – specific energy consumption targets; ESCerts traded; now merged with CCTS cycles","s.14AA–14AB (2022) – Carbon Credit Trading Scheme; carbon credit certificates; non-fossil obligations","ECSBC (buildings) and standards & labelling (star ratings) for appliances and equipment, incl. industrial motors, pumps, transformers (BEE S&L; QCO for motors IS 12615)","Penalties under s.26 – up to ₹10 lakh plus continuing penalty; adjudication by SERC"],url:"https://beeindia.gov.in"},
{id:"ccts",t:"Carbon Credit Trading Scheme, 2023 (as amended) – Indian Carbon Market (ICM)",yr:2023,j:"India – Central",d:["Energy/Carbon/ESG","Factories"],a:"BEE (administrator); Ministry of Power; CPCB (compensation); Grid Controller of India (registry); CERC (trading on power exchanges)",s:"In force",sum:"India's compliance carbon market. GHG emission intensity (GEI) targets notified under the EC Act for obligated entities: aluminium, cement, chlor-alkali, pulp & paper (8 Oct 2025, 282 plants) and petroleum refineries, petrochemicals, textiles (16 Jan 2026) — 490 entities in 7 sectors; iron & steel targets issued as a draft (G.S.R. 517(E), 26 June 2026, 255 units) and fertilizer still pending. Targets apply to FY2025-26 and FY2026-27 against a FY2023-24 baseline (about 40% of the reduction due in year one). Over-performers receive Carbon Credit Certificates (CCCs) to sell; under-performers must buy and surrender CCCs; an offset mechanism lets non-obligated entities register projects.",key:["Obligated entity: monitoring plan approved by BEE; monthly monitoring; verified GHG emission report by an Accredited Carbon Verification Agency (ACVA) within 4 months of FY end (FY2025-26 → 31 Jul 2026; FY2026-27 → 31 Jul 2027)","CCC issuance on the ICM registry (BEE procedure date 30 Sep 2026 for the first cycle); trading only on CERC-registered power exchanges (first trades expected late 2026)","Shortfall: buy CCCs; failing that, environmental compensation by CPCB equal to twice the average CCC price of the cycle; shortfall recorded","Scope 2 for CCTS uses the CEA grid emission factor (CO2 Baseline Database v20: 0.727 tCO2/MWh for FY2023-24 weighted average; check v21)","Links to BRSR (Principle 6 disclosures) and to EU CBAM (verified installation data reusable)"],url:"https://beeindia.gov.in",note:"Sector coverage, baselines and deadlines change by notification — the statement above reflects reporting up to early Oct 2026; confirm the current GEI notification for your sector."},
{id:"brsr",t:"SEBI Business Responsibility and Sustainability Report (BRSR) & BRSR Core",yr:2023,j:"India – Central",d:["Energy/Carbon/ESG","Management System"],a:"SEBI (LODR Regulation 34(2)(f)); stock exchanges",s:"In force",sum:"Mandatory ESG disclosure for the top 1,000 listed entities by market capitalisation (since FY2022-23), structured on the nine NGRBC principles. BRSR Core (July 2023 circular) is a subset of KPIs across nine attributes — GHG emissions, energy, water, waste, inclusive development (incl. OSH), wages, gender diversity, customer complaints and business openness — subject to reasonable assurance / 'assessment', phased in: top 150 (FY2023-24), top 250 (FY2024-25), top 500 (FY2025-26) and all top 1,000 from FY2026-27. Value-chain disclosures for partners each contributing ≥ 2% of purchases/sales apply from FY2026-27 (assessment or assurance).",key:["Principle 3 (employee well-being) and Principle 6 (environment): safety incidents (LTIFR per million hours, fatalities, recordable injuries), safety-management-system coverage, health & safety training, GHG Scope 1/2 (and 3 leadership indicator), energy intensity, water, waste, air emissions","BRSR Core attribute: 'Enabling a safe, healthy workplace' – OSH KPIs must be auditable: incident registers, hours worked, training records","Data must reconcile with statutory registers (OSH Code registers, Form V, HW Form 4) — assurance providers trace to source","Dec 2024/2025 SEBI amendments: 'assessment or assurance' option, green credits disclosure, ESG rating providers (ERP) regulated"],url:"https://www.sebi.gov.in"},
{id:"cbam",t:"EU Carbon Border Adjustment Mechanism (CBAM) – Regulation (EU) 2023/956 as amended by (EU) 2025/2083",yr:2026,j:"UK / EU",d:["Energy/Carbon/ESG","Factories"],a:"European Commission; EU national competent authorities; authorised CBAM declarants (EU importers)",s:"In force",sum:"Definitive regime from 1 Jan 2026 for cement, iron & steel (incl. listed downstream articles), aluminium, fertilisers, electricity and hydrogen. EU importers must be authorised declarants and will buy CBAM certificates priced on EU ETS auctions (certificate sales open 1 Feb 2027; first annual declaration and surrender for 2026 imports due 30 Sep 2027). De minimis: importers at or below 50 t/yr of the goods (not electricity/hydrogen) are exempt. Indian exporters feel it through buyer demands for installation-level verified emissions data; default values carry mark-ups (10% in 2026, 20% in 2027, 30% from 2028). A carbon price effectively paid in India (e.g. CCTS) may be deductible for actual-data declarations once the Commission's rules are final.",key:["Exporter actions: map products to CN codes; set up installation-level MRV (direct + indirect emissions, precursors); third-party verification; register installation in the CBAM registry; supply data to EU customers; compare default vs verified cost","Overlaps: CCTS verified reports, ISO 14064, GHG Protocol; free allocation deduction shrinks to 2034"],url:"https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism_en"},
{id:"ghg-standards",t:"GHG Protocol; ISO 14064-1/-2/-3; ISO 14067; ISO 14068-1; ISO 50001; SBTi; GRI (incl. GRI 403 OSH); ISSB IFRS S1/S2; TCFD; EU CSRD/ESRS",yr:0,j:"International",d:["Energy/Carbon/ESG","Management System"],a:"WRI/WBCSD; ISO; GRI; IFRS Foundation; European Commission",s:"In force",sum:"The reporting and verification stack behind BRSR, CCTS and CBAM: GHG Protocol Corporate Standard (Scope 1 direct, Scope 2 location/market-based, Scope 3 fifteen categories); ISO 14064-1 (organisational inventory), -2 (projects), -3 (verification); ISO 14067 product carbon footprint; ISO 14068-1 carbon neutrality claims; ISO 50001 energy management; Science Based Targets initiative (1.5 °C pathways, net-zero standard); GRI Universal/Topic standards (GRI 403 for OSH: hazard identification, worker participation, injury rates per 200,000 or 1,000,000 hours); ISSB IFRS S1/S2 (2023) replacing TCFD; EU CSRD/ESRS (applies to large EU-linked groups; 2025 'Omnibus' delayed wave 2/3 by two years).",key:["Emission factors: IPCC 2006 defaults for fuels; CEA CO2 Baseline Database for Indian grid; DEFRA/IEA for international","Organisational & operational boundaries; base year recalculation; uncertainty; verification (limited/reasonable assurance)"],url:"https://ghgprotocol.org"},
{id:"epr-regimes",t:"Extended Producer Responsibility (EPR) regimes: Plastic Waste (2022), E-Waste (2022), Battery Waste (2022), Waste Tyre (2022), Used Oil (HOWM 2nd Amendment 2023, effective 1 Apr 2024) & Green Credit Rules 2023",yr:2024,j:"India – Central",d:["Environment","Energy/Carbon/ESG"],a:"CPCB (central EPR portals); SPCBs; MoEFCC",s:"In force",sum:"Producers, importers and brand owners must register on CPCB portals, meet collection/recycling targets through registered recyclers and buy EPR certificates for shortfalls; bulk consumers of e-waste/batteries and generators of used oil have hand-over and record duties. Green Credit Rules 2023 create a voluntary market-based credit for tree plantation, water, sustainable agriculture, waste management, air pollution reduction, mangrove, eco-mark and sustainable building — relevant to ESG claims.",key:["Industrial site duties: hand over e-waste, batteries, used oil only to registered recyclers/collectors; maintain records; annual returns on portals","Environmental compensation for non-compliance; EPR certificates traded on CPCB portal"],url:"https://cpcb.nic.in"},
{id:"ecsbc",t:"Energy Conservation and Sustainable Building Code (ECSBC) 2024 / Eco Niwas Samhita & Ministry of Power draft (19 Jul 2026) on mandatory star ratings",yr:2024,j:"India – Central",d:["Energy/Carbon/ESG","Construction"],a:"BEE; Ministry of Power; State Governments (adoption into building bye-laws); Urban Local Bodies",s:"Draft",sum:"ECSBC 2024 (commercial/office) and ENS 2024 (residential) succeed ECBC 2017 under the amended EC Act, adding renewable-energy integration, embodied-carbon and water provisions. Enforcement depends on state adoption into building rules (Karnataka and Tamil Nadu notified ECBC earlier; check ECSBC adoption). A Ministry of Power draft notification (19 Jul 2026) would require every new building/complex of ≥ 20,000 m² built-up area to obtain a minimum rating (3-star BEE/GRIHA, Gold IGBC/LEED, GEM-3) mapped to ECSBC tiers, valid 10 years, displayed publicly; renewal mandatory for commercial buildings.",key:["Design-stage compliance: envelope, HVAC, lighting, renewable share; third-party certification","Interacts with EIA 2006 Item 8 and state green-building incentives"],url:"https://beeindia.gov.in"},
{id:"ods-rules",t:"Ozone Depleting Substances (Regulation and Control) Rules, 2000 (as amended) & Kigali HFC phase-down",yr:2000,j:"India – Central",d:["Environment","Energy/Carbon/ESG","Chemical"],a:"MoEFCC Ozone Cell; CPCB",s:"In force",sum:"Controls production, import, sale and use of ODS (CFCs banned; HCFC-22 phase-out schedule to 2030; HCFC-141b banned in foams since 2020). India ratified the Kigali Amendment (2021): HFC consumption freeze 2028 and phase-down to 2047. Refrigerant leaks count as Scope 1 GHG (GWP-weighted) in CCTS/BRSR inventories.",key:["Servicing of refrigeration/AC with recovery units; technician training (good practices); record refrigerant purchases/leaks for GHG inventory","Fire suppression: halon banned; alternatives (clean agents) with GWP considerations"],url:"https://ozonecell.nic.in"},
{id:"ir-code",t:"Industrial Relations Code, 2020",yr:2020,j:"India – Central",d:["Welfare/Labour","Management System"],a:"MoLE; State Labour Departments",s:"In force",sum:"In force 21 Nov 2025; subsumes the Industrial Disputes Act, Trade Unions Act and Industrial Employment (Standing Orders) Act. Relevant to safety governance: standing orders (300+ workers) must cover safety rules and discipline; grievance redressal committees; works committees (100+); negotiating union recognition; strike notice (14 days) and lay-off/retrenchment provisions that affect shutdown safety planning.",key:["Standing orders define duties, shift working, disciplinary action for safety violations","Grievance committee (20+ workers) – channel for safety complaints"],url:"https://labour.gov.in"},

// ───────────── PROCESS SAFETY, TANKS, PIPELINES ─────────────
{id:"tank-standards",t:"Storage tank codes: IS 803, IS 10987, API 650 / 653 / 2000 / 2350 / 2015 / 2016 / 1615 / 1604, OISD-STD-118 / 129 / 244, 40 CFR 280 (US UST)",yr:0,j:"International",d:["Storage Tanks","Chemical","Fire","Oil & Gas"],a:"BIS; API; OISD; US EPA; PESO (licensing in India)",s:"In force",sum:"IS 803 – vertical mild-steel welded oil storage tanks (design/erection); IS 10987 – horizontal cylindrical underground/above-ground tanks for petroleum products (retail outlets, site fuel storage); API 650 design, API 653 in-service inspection (external every 5 years, internal per corrosion rate, max 20 years), API 2000 venting, API 2350 overfill protection, API 2015/2016 tank entry & cleaning, API 1615 UST installation, API 1604 UST closure; OISD-STD-118 layouts/spacing, OISD-STD-129 inspection of storage tanks, OISD-STD-244 depots and terminals; US 40 CFR Part 280 underground storage tank rules (leak detection, corrosion protection, financial responsibility) – the most complete UST regime to benchmark.",key:["Dyke/bund: capacity for largest tank (Petroleum Rules 2002 / OISD-118: ≥ 100% of largest tank + dead stock; 110% common practice); bund height ≤ 2 m typical","UST: double-wall or lined single-wall with interstitial monitoring, automatic tank gauging, cathodic protection for steel, precision tightness test on installation and periodically, inventory reconciliation; vapour recovery Stage I/II where CPCB mandates","Decommissioning: empty, clean, gas-free, inert fill or removal, soil/groundwater sampling, PESO licence surrender"],url:"https://peso.gov.in"},
{id:"static-electricity",t:"IS 7689 – Guide for control of undesirable static electricity; NFPA 77; IS/IEC 60079 (hazardous area classification)",yr:0,j:"India – Central",d:["Process Safety","Chemical","Electrical","Fire"],a:"BIS; NFPA; IEC",s:"In force",sum:"Static ignition is a leading cause of tank-truck, drum-filling and solvent-handling fires. Bonding/earthing of all conductive parts, limiting flow velocity (≤ 1 m/s until fill pipe submerged, ≤ 7 m/s thereafter), relaxation time, no splash filling, conductive hoses, anti-static clothing/footwear in Zone 1, and classification of areas (Zone 0/1/2 gas; 20/21/22 dust) with Ex-rated equipment.",key:["Earth resistance for static bonding ≤ 10 Ω (static), overall earthing per IS 3043","Verify bonding clamps before each transfer; interlock bonding with pump start on loading gantries"],url:"https://www.bis.gov.in"},
{id:"pngrb",t:"PNGRB Regulations – Technical Standards & Specifications incl. Safety (T4S) for pipelines, CGD networks, LNG terminals; ERDMP Regulations 2010; Integrity Management",yr:2010,j:"India – Central",d:["Oil & Gas","Process Safety","Chemical"],a:"Petroleum and Natural Gas Regulatory Board (PNGRB)",s:"In force",sum:"Mandatory for natural-gas and petroleum pipelines, city-gas distribution (CNG stations, PNG networks) and LNG facilities: design, construction, operation, maintenance, emergency response and disaster management plans (ERDMP), third-party audits, right-of-way safety, excavation near pipelines (contractor duty to obtain pipeline operator clearance).",key:["Construction contractors: pipeline locating and permit before digging near RoW; ROU markers","CGD/CNG stations: safety distances, gas detection, ESD, dispenser interlocks"],url:"https://www.pngrb.gov.in"},
{id:"toxic-gas-codes",t:"IS 4263 (Code of safety for chlorine), IS 4544 (Code of safety for ammonia), Chlorine Institute pamphlets, IIAR standards (ammonia refrigeration), OSHA PSM thresholds",yr:0,j:"India – Central",d:["Chemical","Process Safety"],a:"BIS; Chlorine Institute; IIAR; OSHA",s:"In force",sum:"Design and handling codes for the two most common toxic gases on Indian industrial sites (water treatment, textiles, chemicals, cold storage, fertilizer). Both are MSIHC Schedule chemicals: toxic-release scenarios drive on-site/off-site emergency plans. Chlorine tonners handled under Gas Cylinders Rules; bulk ammonia under SMPV(U).",key:["Chlorine: emergency kits A/B/C, scrubber/neutralisation, SCBA, leak detectors, wind sock, 1 ppm TLV / 0.5 ppm (ACGIH); IDLH 10 ppm","Ammonia: 25 ppm TLV, 35 ppm STEL, IDLH 300 ppm; machinery-room ventilation and detection (IIAR 2), ESD valves, water deluge"],url:"https://www.bis.gov.in"},
{id:"dust-codes",t:"Combustible dust: NFPA 652 (fundamentals, Dust Hazard Analysis), NFPA 654 / 61 / 484 / 664 / 68 / 69; OSHA Combustible Dust NEP (CPL 03-00-008); ATEX 1999/92/EC; IEC 60079-10-2; Factories Act s.37 via state rules",yr:0,j:"International",d:["Process Safety","Fire","Factories"],a:"NFPA; OSHA; EU; BIS/IEC",s:"In force",sum:"Flour, sugar, starch, wood, textiles fibre, coal, aluminium/magnesium, pharmaceutical powders and plastics all form explosive clouds. Requirements: Dust Hazard Analysis (NFPA 652, revalidated every 5 years), housekeeping limits (layer thickness > 0.8 mm / 1/32 in over 5% of area is a deflagration hazard), explosion venting (NFPA 68) or suppression/isolation (NFPA 69), bonding, dust collectors sited outdoors or with venting, Zone 20/21/22 equipment (IEC 60079-10-2), hot-surface limits, no compressed-air blow-down.",key:["India: Factories Act s.37 (explosive or inflammable dust/gas) continues via state Factories Rules and OSH Code s.6; MSIHC for flammable solids","Kst/Pmax testing of dusts (ASTM E1226) to size vents"],url:"https://www.nfpa.org/codes-and-standards"},

// ───────────── LIFTING GEAR, CRANES, TOOLS, MACHINERY ─────────────
{id:"lifting-gear-codes",t:"Lifting tackles & rigging: IS 2266 (steel wire ropes), IS 6216 (chain slings), IS 3832 (hand-operated chain pulley blocks), ISO 4309 (wire rope care & discard), EN 13155 / EN 13889 / EN 1677, ASME B30.9 / B30.10 / B30.20 / B30.26; Factories Act s.29 & BOCW rules (test & examination)",yr:0,j:"International",d:["Lifting & Cranes","Tools & Tackles","PPE/Equipment"],a:"BIS; ISO; CEN; ASME; state factory inspectorates (competent persons)",s:"In force",sum:"Design, marking (SWL/WLL, ID), proof-load testing, periodic thorough examination and discard criteria for slings, chains, shackles, hooks, eyebolts, spreader beams, chain blocks and winches. India: Factories Act s.29 (via state rules) – test and thorough examination by competent person at least every 12 months with register; BOCW Central/state rules – lifting gear tested before first use and examined at least every 6 months (verify); UK LOLER – 6-monthly for accessories and lifting persons.",key:["Discard: wire rope (ISO 4309) – broken wires above table limit (e.g. 6 in one lay length for 6-strand ropes), diameter reduction > 7–10%, kinks, corrosion, birdcaging; chain – stretch > 5%, wear > 10%, cracks; hooks – throat opening increase > 15%, twist > 10°; shackles – pin wear > 10%; webbing slings – cut, label missing, chemical/heat damage","Colour-code quarterly; quarantine failed gear; unique ID traceable to certificate"],url:"https://www.bis.gov.in"},
{id:"crane-codes",t:"Cranes: IS 3177 (EOT & gantry cranes), IS 807 (crane structures), IS 4573 (mobile cranes), IS 13367 Pt 1 (safe use), OSHA 1926.1400–1442 & 1926.1435 (tower cranes), 1910.179, ASME B30.2 / B30.3 / B30.5, BS 7121 Pts 1–5, BS EN 14439 (tower cranes), BS EN 13000 (mobile cranes)",yr:0,j:"International",d:["Lifting & Cranes","Construction","Factories"],a:"BIS; OSHA; ASME; BSI/CEN; state inspectorates",s:"In force",sum:"Design, erection, inspection and operation standards for mobile, crawler, tower and overhead cranes. Tower cranes: foundation/tie design by manufacturer or engineer, erection/climbing/dismantling by trained crew under supervision, anti-collision and zoning on multi-crane sites, out-of-service free-slew in storms, anemometer limits (manufacturer; stop lifting typically 9–10 m/s), lightning protection, test after each erection by competent person, daily/weekly/monthly inspection schedules. EOT cranes: limit switches (hoist upper, travel), brakes, pendant/remote control checks, gantry rail alignment, load test at 125% after major repair.",key:["India: 12-monthly competent-person test/examination (Factories Act s.29 via state rules; BOCW rules); certificate in cab; operator competence (HMV for mobile); IS 13367 hand signals","OSHA: operator certification (1926.1427), assembly/disassembly director, power-line Table A clearances, ground conditions, annual & monthly inspections (1926.1412)"],url:"https://www.osha.gov/cranes-derricks"},
{id:"tools-codes",t:"Hand & power tools: OSHA 1926 Subpart I (1926.300–307) & 1910 Subpart P (1910.241–244); UK PUWER 1998 & HSG17 (abrasive wheels); ANSI B7.1; ANSI A10.3 (powder-actuated); IS/IEC 62841 (power tool safety); IS 9474 (guarding)",yr:0,j:"International",d:["Tools & Tackles","Construction","Factories"],a:"OSHA; HSE; ANSI; BIS/IEC",s:"In force",sum:"Guarding of portable tools (grinder guard, retractable saw guards), abrasive-wheel mounting/speed/inspection (ring test; only trained persons mount wheels), powder-actuated tool operator training and licensing, pneumatic tool whip-checks and ≤ 30 psi for cleaning (never on clothing), electrical tool double insulation/RCD/PAT, hand tool condition (no mushroomed heads, split handles), inspection colour-coding, tool registers and quarantine of defective tools.",key:["India: state Factories Rules (grinding wheel safety provisions – verify rule), BOCW rules (tools), CEA regs and IS 732 for portable electrical equipment; check current BIS Quality Control Orders before importing power tools"],url:"https://www.osha.gov/hand-power-tools"},
{id:"pit-racking",t:"Forklifts & warehousing: OSHA 1910.178 (powered industrial trucks), ASME B56.1, 1910.176 (materials storage), NFPA 13/NBC Part 4 (high-piled storage), EN 15635 (racking inspection), SEMA guidance; India MV Act (registered FLTs), Factories Act via rules",yr:0,j:"International",d:["Lifting & Cranes","Transport","Factories"],a:"OSHA; ASME; CEN; SEMA; RTO",s:"In force",sum:"Operator training & evaluation every 3 years (OSHA), pre-use inspection, capacity plate and load centre (600 mm / 24 in), attachments de-rating, seat belts, pedestrian segregation, speed limits, battery charging rooms (hydrogen ventilation, acid, eyewash), LPG forklifts (PESO cylinders, indoor CO), racking: SWL signage, damage classification (green/amber/red), weekly visual, annual expert inspection, aisle widths, sprinkler clearance (≥ 450 mm / 18 in), block-stacking stability.",key:["India: forklifts on public roads need RTO registration and HMV/LMV licence; inside factory – authorisation, medical fitness, Factories Act s.7A duty","Dock levellers, wheel chocks, vehicle keys control during loading"],url:"https://www.osha.gov/powered-industrial-trucks"},
{id:"machinery-codes",t:"Machinery safety: ISO 12100, ISO 13849-1 / IEC 62061 (safety-related controls, PL/SIL), ISO 14120 (guards), ISO 13857 (safety distances), ISO 10218-1/-2 (industrial robots), ISO/TS 15066 (cobots), EU Machinery Regulation 2023/1230 (from 20 Jan 2027), IS 9474, Factories Act ss.21–33 via state rules",yr:0,j:"International",d:["Factories","PPE/Equipment","Electrical"],a:"ISO/IEC; European Commission; BIS; state inspectorates",s:"In force",sum:"Risk assessment and reduction for machinery; guard design and reach distances; interlocking (ISO 14119); performance level of safety functions (e-stops, light curtains, two-hand controls); robot cells (perimeter guarding, safeguarded space, collaborative operation limits); presses (ANSI B11 series), woodworking, conveyors; CE/EHSR documentation for imported machines; India: fencing, machinery in motion, young persons, self-acting machines (legacy Factories Act sections continued via OSH Code s.6 and state rules).",key:["Buy-in checklist: declaration of conformity, risk assessment, manuals in English/local language, safety circuit category, guard interlocks","Periodic functional test of safety devices; LOTO for maintenance"],url:"https://www.iso.org"},

// ───────────── FOUNDRY / METALS / HOT WORK INDUSTRIES ─────────────
{id:"foundry-codes",t:"Foundry & hot-metal safety: state Factories Rules dangerous-operations schedules (foundry operations, sand-blasting, lead, chrome), DGFASLI/CLI foundry guidance, HSE UK 'Foundries' guidance (molten metal, cupolas, induction furnaces), OSHA 1910 (silica 1910.1053, 1910.94, 1910.132), EN ISO 11612 / ASTM F955 (molten-metal PPE)",yr:0,j:"India – Central",d:["Foundry & Metals","Factories","Health"],a:"State inspectorates (KA DFBISH / TN DISH); DGFASLI; HSE; OSHA; BIS",s:"In force",sum:"No single Indian foundry code: obligations flow from the Factories Act (now OSH Code) dangerous-operations schedules in the Karnataka and Tamil Nadu Factories Rules (medical examination, PPE, exhaust ventilation, washing facilities for foundry, lead, chrome, sand-blasting operations), exposure limits (Schedule II: silica, CO, manganese, lead, formaldehyde, phenol), and general duties. International guidance covers molten-metal explosions (water contact), furnace water-cooling failures, ladle/crane integrity, cupola charging, induction-furnace lining, fettling (silica, noise, HAV), binder chemicals (phenolic resins, isocyanates, amines in cold-box), heat stress and burns.",key:["Molten metal: dry charge and ladles (preheat ≥ 100 °C), no water/moisture near pouring, ladle lifting gear inspected daily and tested 6-monthly, dedicated hot-metal routes, splash PPE (aluminised), face shields, spats, metatarsal boots","Silica: wet/LEV sand handling, enclosed shakeout, respirators (P3), medical surveillance (chest X-ray/spirometry) – silicosis notifiable (OSH Code s.12)","Induction furnace: water-cooling monitoring with interlock/alarm, earth-leakage detection on coil, lining wear monitoring; cupola: CO monitoring, charging door interlocks"],url:"https://dgfasli.gov.in",note:"Coimbatore, Belagavi, Shimoga, Chennai (Ambattur) clusters: DISH/DFBISH run periodic foundry safety drives; expect inspection focus on silica, molten-metal PPE and crane certificates."},
{id:"state-dangerous-ops",t:"Dangerous operations schedules – Karnataka Factories Rules 1969 (Rule 129 schedules) & Tamil Nadu Factories Rules 1950 (Rule 95 schedules I–XX)",yr:0,j:"Karnataka",d:["Factories","Health","Chemical","Foundry & Metals"],a:"DFBISH Karnataka; DISH Tamil Nadu (certifying surgeons)",s:"In force (transition)",sum:"Both states list operations where special rules apply (pre-employment and periodic medical examination by certifying surgeon, exposure controls, PPE, washing/cloakrooms, prohibition of food, health registers). Typical schedules: manufacture of aerated water; electrolytic plating; lead and lead compounds; manufacture/use of chromium compounds; sand-blasting; cellulose/solvent spraying; grinding/glazing of metals; foundry operations; glass manufacture; pottery; carbon disulphide; benzene; pesticides; asbestos (TN Schedule XX substituted 2025); cotton dust (byssinosis); rubber; chlorine; pickling; compressed air work; nitro/amino compounds; manufacture of rayon; highly flammable liquids and gases.",key:["Medical examination records in prescribed forms; certificate of fitness; removal from work on medical advice; occupational-disease notice (OSH Code s.12)","Transition: schedules continue until state OSH rules replace them; OSH Code Ch. XII and Central Rules list similar 'hazardous processes'"],url:"https://dish.tn.gov.in",note:"Schedule numbers differ between the two states and are amended (TN 2025); cite the current gazetted schedule in medical surveillance SOPs."},

// ───────────── ELECTRICAL (DEEPER), BATTERIES, SOLAR ─────────────
{id:"ht-codes",t:"HT & substation safety: CEA Safety Regulations 2023 (work on live/dead lines, permits, earthing), IS 5216, IS 3043, IS 10028 (transformers), IEC 61936-1 (power installations > 1 kV), IEEE 1584 (arc-flash calculation), NFPA 70E (boundaries & PPE), IS 1646 (electrical installations fire safety), IS 732",yr:0,j:"India – Central",d:["Electrical","Factories","Fire"],a:"CEA; state CEIG; BIS; IEEE/NFPA",s:"In force",sum:"Covers authorisation of competent persons, HT permit-to-work (isolate–lock–test–earth–tag), approach distances, arc-flash incident energy study and labelling, transformer fire protection and oil containment, SF6 handling, cable trench fire stopping, battery rooms, substation access control and periodic inspection by the Electrical Inspector.",key:["NFPA 70E approach boundaries (verify Table 130.4): 50–150 V – limited 1.07 m, restricted avoid contact; 151–750 V – limited 1.07 m, restricted 0.3 m; 751 V–15 kV – limited 1.52 m, restricted 0.66 m; arc-flash boundary from study (1.2 cal/cm²)","Electrical accident report to Electrical Inspector within 48 h (Form A); periodic inspection of HT installations (yearly/5-yearly per state CEIG rules)"],url:"https://cea.nic.in"},
{id:"battery-solar-codes",t:"Batteries, ESS, solar PV & EV charging: NFPA 855, UL 9540 / 9540A, IEC 62619 / IEC 62933-5-2, IS 16046 (Li-ion safety), IEC 62446-1 & IS/IEC 60364-7-712 (PV installations), IS 14286 / IS 61730 (module QCO), CEA Technical Standards (connectivity of distributed generation; EV charging safety in CEA 2023 regs), Battery Waste Management Rules 2022, IEEE 1635 / IS 1651 (lead-acid rooms)",yr:0,j:"International",d:["Electrical","Fire","Energy/Carbon/ESG"],a:"NFPA/UL; IEC; BIS; CEA; MNRE",s:"In force",sum:"Lithium-ion energy storage: thermal-runaway risk, spacing, enclosures, fire detection (off-gas/early), suppression and deflagration venting (NFPA 855 / UL 9540A test data), state-of-charge limits for storage/transport (UN 38.3 / 30% SoC), end-of-life handling under Battery Waste Rules. Lead-acid rooms: hydrogen ventilation (keep < 1% v/v), acid-resistant floors, eyewash, insulated tools. Solar PV: DC arc hazards (no load break on DC without isolators), rooftop fall risk and fragile roofs, module cleaning at height, inverter rooms, lightning/surge protection, firefighter DC isolation signage. EV charging: CEA safety provisions, RCD type B, emergency stop, ventilation for indoor charging.",key:["MNRE/BIS QCO: modules and inverters must carry BIS certification (ALMM list for government projects)","Rooftop solar installers fall under BOCW/OSH Code work-at-height duties"],url:"https://www.nfpa.org/codes-and-standards"},

// ───────────── FIRE SYSTEMS (DEEPER) ─────────────
{id:"fire-systems",t:"Fire protection systems: IS 13039 (external hydrants), IS 15105 (sprinklers), IS 2189 (detection & alarm), IS 3844 (high-rise), IS 1641 / 1642 / 1644 (fire safety of buildings – general, materials, exits), IS 2190 / IS 15683 (extinguishers), IS 12349 (industrial fire protection), IS 15325 (fixed foam), NFPA 25 (inspection, testing & maintenance), NFPA 13/14/20/72, Tariff Advisory Committee (TAC) rules (insurance)",yr:0,j:"India – Central",d:["Fire","Factories","Construction"],a:"BIS; NFPA; State Fire Services (KSFES / TNFRS); insurers (TAC/IRDAI)",s:"In force",sum:"Design and maintenance basis behind Fire NOCs and insurance. Typical test cadence: fire pumps weekly run (churn), annual flow test; sprinkler/hydrant systems quarterly inspections, annual full test, 5-yearly internal inspection; detectors tested annually, panels weekly; extinguishers monthly visual, annual service, hydrostatic test 3–5 years (CO2/clean agent 10 years); emergency lighting monthly flick/annual duration; fire doors quarterly; foam concentrate annual lab test.",key:["Fire water: 2–4 h reserve for industrial risks (TAC/NBC), fire pumps diesel + electric + jockey, hydrant spacing ≤ 45 m (industrial) / 30 m (high-hazard)","Impairment procedure when systems are out of service: notify fire brigade/insurer, fire watch, hot-work ban"],url:"https://www.bis.gov.in"},

// ───────────── UNDERGROUND, PILING, BLASTING, WATER ─────────────
{id:"tunnel-codes",t:"Tunnelling & compressed-air work: BOCW Central Rules 1998 (tunnelling chapter), OSHA 1926 Subpart S (1926.800–804; 1926.803 compressed air), BS 6164 (safety in tunnelling), UK Work in Compressed Air Regulations 1996, ITA guidelines, DGMS (where mines)",yr:0,j:"International",d:["Construction","Mines"],a:"OSHA; BSI; ITA; state labour departments; DGMS",s:"In force",sum:"Ground support, ventilation (≥ 200 cfm/person; ≥ 30 ft/min air velocity OSHA), continuous gas monitoring (methane < 10% LEL action; CO, H2S, O2), check-in/check-out, communication, refuge chambers, fire protection of TBMs, hoisting in shafts, flooding/inrush precautions, compressed-air work (medical lock, decompression tables, medical surveillance), diesel exhaust control.",key:["Metro/road tunnel contracts in Bengaluru/Chennai follow Central BOCW rules + employer specifications (BMRCL/CMRL safety manuals)"],url:"https://www.osha.gov/laws-regs/regulations/standardnumber/1926/1926.800"},
{id:"piling-codes",t:"Piling & deep foundations: BS EN 16228 (drilling & foundation equipment), FPS guidance, IS 2911 (pile foundations), OSHA 1926 Subparts N/CC (cranes), BOCW rules (excavation/foundations)",yr:0,j:"International",d:["Construction","Lifting & Cranes"],a:"CEN; Federation of Piling Specialists (UK); BIS; OSHA",s:"In force",sum:"Rig stability (platform working-platform certificate), exclusion zones around augers/rotating parts (entanglement – no loose clothing; auger cleaners), rebar cage lifting, tremie concrete, open bore covers, bentonite handling and disposal, noise/vibration limits near structures, overhead lines.",key:["Working platform (piling mat) design and sign-off before rig entry; daily checks after rain","Sheet piling: vibro/impact hammer exclusion, trench collapse precautions"],url:"https://www.fps.org.uk"},
{id:"blasting-codes",t:"Blasting: Explosives Rules 2008, IS 4081 (blasting & drilling in construction), DGMS Technical Circular 7/1997 (ground vibration limits), DGMS blasting regulations (Metalliferous Mines Regs 1961 / Coal Mines Regs 2017), OSHA 1926 Subpart U",yr:0,j:"India – Central",d:["Construction","Mines"],a:"PESO; DGMS; District Magistrate/Police; OSHA",s:"In force",sum:"Licensed magazine (Form LE-3/LE-5), licensed shot-firer/blaster, explosives van and daily issue/return register, blasting plan (burden, spacing, charge per delay, initiation), ground-vibration monitoring (PPV limits per DGMS circular by structure type and frequency), flyrock control (stemming, mats), warning sirens and shelters, misfire procedure, police/DM intimation and timing restrictions near habitation.",key:["DGMS PPV limits (mm/s, verify): domestic structures not owned by operator – 5 (< 8 Hz), 10 (8–25 Hz), 15 (> 25 Hz); industrial buildings – 10/20/25; historical monuments – 2/5/10","Misfire wait: electric ≥ 5–30 min, fuse ≥ 30–60 min (per rules); only shot-firer approaches"],url:"https://peso.gov.in"},
{id:"water-codes",t:"Working over/near water & marine works: IS 13416 Pt 5 (prevention of drowning), Dock Workers (Safety, Health & Welfare) Regulations 1990 (via OSH Code), Merchant Shipping Act 1958 (vessels/barges), ILO C152 (dock work), OSHA 1926.106 (working over or near water) / 1917 / 1918, UK HSE guidance (rescue boats, lifejackets EN ISO 12402)",yr:0,j:"India – Central",d:["Construction","Transport"],a:"DGFASLI Dock Safety; Ports; DG Shipping; OSHA",s:"In force",sum:"Lifejackets (buoyancy ≥ 150 N for work-wear), lifebuoys with 30 m line every 60 m, rescue boat with trained crew on standby, edge protection/nets, tide and current planning, barge stability and crane limits afloat, man-overboard drill, hypothermia/current hazards, water-borne disease.",key:["Jetty, bridge pier and intake works in Chennai/Ennore/Mangaluru/Karwar fall under port and coastal regulations (CRZ clearance)"],url:"https://dgfasli.gov.in"},

{id:"lab-codes",t:"Laboratory safety: OSHA 1910.1450 (Laboratory Standard – Chemical Hygiene Plan), NABL/ISO 17025 safety clauses, OECD GLP, DBT Biosafety Guidelines (BSL levels), Bio-Medical Waste Rules 2016, IS 15656 (hazard identification)",yr:0,j:"International",d:["Chemical","Health"],a:"OSHA; NABL; DBT/RCGM; CPCB",s:"In force",sum:"Chemical hygiene plan, fume hood face velocity (0.4–0.5 m/s), chemical storage segregation, peroxide-formers dating, cryogenics, compressed gases, glassware under vacuum/pressure, biosafety cabinets and BSL-2 practices for microbiology labs, sharps and bio-medical waste segregation (colour-coded bags, autoclaving), emergency shower/eyewash.",key:["QC labs in chemical/pharma plants fall under Factories/OSH Code hazardous-process rules as well"],url:"https://www.osha.gov/laboratories"},
{id:"bio-codes",t:"Biological hazards: OSHA 1910.1030 (bloodborne pathogens), Epidemic Diseases Act 1897 (as amended 2020), Bio-Medical Waste Rules 2016, MoHFW/ICMR advisories, IS 10500 (drinking water), ASHRAE 188 / HSE L8 (legionella)",yr:0,j:"India – Central",d:["Health","Environment"],a:"MoHFW; State Health Departments; CPCB; OSHA; ASHRAE/HSE",s:"In force",sum:"Pandemic/outbreak readiness (state powers under the Epidemic Diseases Act), vector control at sites and camps (dengue, malaria, chikungunya – monsoon), water-borne disease prevention (potable water to IS 10500, tested monthly), snake/scorpion/dog bite protocols (antivenom/rabies PEP hospital identified), tetanus prophylaxis, needle-stick/bloodborne precautions in OHCs, legionella control in cooling towers and hot-water systems (temperature regimes, biocide, monthly inspection, quarterly sampling where risk).",key:["Construction camps: ULB/Health Department inspections; fogging, larvicide, drainage","OHC bio-medical waste: authorisation and common facility tie-up"],url:"https://mohfw.gov.in"},
{id:"security-codes",t:"Site security & public safety: Private Security Agencies (Regulation) Act 2005, POSH Act 2013, Bharatiya Nyaya Sanhita 2023 (workplace crimes), IRC:SP:55 (public interface), NDMA guidelines, municipal hoarding/barricade bye-laws",yr:0,j:"India – Central",d:["Management System","Construction","Welfare/Labour"],a:"State Home Departments (PSARA licensing); Police; ULBs",s:"In force",sum:"Licensed security agency (PSARA) with verified guards; access control (biometric/RFID), visitor management, CCTV retention, perimeter integrity, material gate passes, public protection from falling objects and traffic (hoardings, covered walkways, debris nets), workplace-violence and harassment prevention (ICC under POSH, grievance channels), threat/bomb-call procedure, labour unrest and lock-out safety, cash/explosives/fuel security.",key:["Night security of cranes/hoists (power isolated, keys controlled); theft of scaffold components creates collapse risk","Media/public communication during incidents via single spokesperson"],url:"https://www.mha.gov.in"},
{id:"drone-rules",t:"Drone Rules, 2021 (as amended) – DGCA / Digital Sky",yr:2021,j:"India – Central",d:["Transport","Construction","Management System"],a:"DGCA; Ministry of Civil Aviation",s:"In force",sum:"Drones used for progress survey, façade/roof/stack/flare/chimney inspection and confined-area reconnaissance must have a UIN (type-certified), remote pilot certificate (above nano/micro non-commercial), flight only in green zones or with permission (yellow/red zones – airports, defence, state secretariats), ≤ 120 m AGL, visual line of sight, no flight over crowds, insurance, and operator SOP; incident reporting to DGCA.",key:["Site rule: exclusion of persons under flight path; battery (Li-Po) charging/storage controls; data privacy of imagery"],url:"https://digitalsky.dgca.gov.in"},
{id:"road-works-codes",t:"Road works & bitumen: IRC:SP:55 (traffic management in work zones), IRC:SP:98 / MoRTH Specifications (bituminous works), CPCB/TNPCB/KSPCB hot-mix plant siting & emission norms, HSE/Eurobitume 'Safe handling of bitumen' guidance, Petroleum Rules (cutback/kerosene), MV Act",yr:0,j:"India – Central",d:["Construction","Transport","Chemical"],a:"MoRTH/IRC; SPCBs; Police/RTO",s:"In force",sum:"Work-zone layout (advance warning, transition, buffer, work and termination areas), flaggers, night lighting/retro-reflective PPE, plant reversing control, bitumen burns (hot bitumen 150–180 °C; never water into hot bitumen; cool burns with water, do not remove bitumen from skin), tanker transfer earthing, fume control at pavers/HMP, cutback solvent flammability, HMP siting ≥ 500 m from habitation (state norms – verify) with dust/stack controls.",key:["Emulsion vs cutback: prefer emulsions to reduce fire risk","Burn kit and burns-centre tie-up for bitumen crews"],url:"https://www.irc.nic.in"}

{id:"foundry",t:"Foundry & Hot-Metal Operations (Melting, Pouring, Casting, Fettling)",cat:"Industrial",tags:["Industrial","Foundry & Metals"],purpose:"Prevent molten-metal explosions, burns, furnace failures, crane/ladle incidents, silica exposure and heat illness in ferrous and non-ferrous foundries.",scope:"Cupola, induction and arc furnaces; ladle handling; moulding (green sand, resin/cold-box, shell); pouring; shakeout; knock-out and fettling; heat treatment; sand reclamation; pattern shop.",roles:["Furnace in-charge (trained melter)","Crane operator & ladle slinger","Pouring supervisor","Safety officer (exposure monitoring)","Occupational physician (silica/lead surveillance)","Maintenance (lining, cooling systems)"],hazards:["Steam explosion when molten metal meets water/moisture (wet charge, damp ladle, water leak, wet floor)","Furnace cooling-water leak into melt; coil earth fault; refractory lining breakthrough (run-out)","Ladle failure, crane/hook/sling failure, spillage during transport","Burns from splash and radiant heat; heat stroke","Respirable crystalline silica (moulding, shakeout, fettling), CO (cupola), manganese/lead/zinc fumes, phenol/formaldehyde/isocyanate/amine from binders","Noise (knock-out, fettling), hand-arm vibration (grinders), eye injury from grinding"],pre:["Charge materials dry and free of closed containers/moisture (no scrap drums, cylinders, sealed castings); charge preheat where feasible; covered scrap storage","Ladles dried and preheated (≥ 100 °C surface, no moisture), lining thickness checked, trunnions/bails inspected daily, lifting gear tested 6-monthly (verify state rule) and marked","Induction furnace: cooling-water flow/temperature/pressure monitoring with alarms and interlock, earth-leakage/ground-fault detector on coil, lining-wear monitoring (meltdown count) and planned relining; emergency power for pumps","Pouring floor: dry, no water lines/drains open near pour, pits sealed, spill sand available, escape routes clear","Ventilation: cupola/fume hoods, LEV at shakeout/fettling, CO monitors near cupola; exposure monitoring plan for silica/metals/binders","Medical surveillance under dangerous-operations schedules (foundry, lead, chrome, sand-blasting); audiometry; heat-stress programme"],steps:["Pre-shift check: cooling system, interlocks, lining condition, crane and ladle gear, PPE issue; record on furnace log.","Charge furnace only with inspected dry material; never add material or tools that have contacted water; keep charging area clear of persons during tilt/charge.","Monitor melt: temperature, slag, cooling-water parameters; on water-leak alarm — stop power, do not add water, evacuate area, prepare to tilt per emergency plan.","Tap/pour: pre-planned route with exclusion zone; only pouring crew present; signaller controls crane; move ladle slowly, never over persons; pour from firm footing; no overfilled ladles (≤ 90%).","Moulds and pits dry and vented; preheat cores where required; secure mould clamps/weights to prevent run-out.","Shakeout/knock-out: enclosed with LEV; respirators (P3) where enclosure not possible; no dry sweeping — vacuum or wet methods.","Fettling: grinders with guards, correct discs, face shields; vibration exposure managed (trigger-time limits, tool rotation); noise zones with hearing protection.","Binder chemicals: SDS, LEV at mixers/core boxes, amine gas scrubbing for cold-box, skin protection; spill kits.","Heat: work/rest cycles by WBGT, hydration, cooling vests; furnace-area rest zone air-conditioned.","Emergency: furnace run-out/metal spill procedure (dry sand, no water, evacuate, isolate power), burns first aid (cool with running water 20 min, do not remove adhered material, burns-centre tie-up), CO alarm response.","Records: furnace log, cooling-system checks, lining history, lifting gear register, exposure monitoring, medicals."],ppe:["Aluminised/FR jacket & leggings (EN ISO 11612; ASTM F955 splash), face shield + safety glasses, foundry boots with metatarsal guard and quick-release, spats, heat-resistant gloves, helmet with FR cover","P3 respirator for silica areas; hearing protection; anti-vibration gloves for fettlers"],stop:["Moisture or sealed container detected in charge","Cooling-water alarm or earth-fault on induction coil","Ladle/crane gear defect or certificate expired","Wet pouring floor or open drain near pour","CO alarm near cupola"],records:["Furnace & cooling logs, lining records, ladle inspection, lifting-gear register (6-monthly test), exposure monitoring, medical surveillance register, heat-stress log, incident/near-miss log"],refs:{india:["Factories Act via state rules: dangerous-operations schedules (foundry, lead, chrome, sand-blasting), Sch. II PELs (silica, CO, Mn, Pb), s.21–s.33 machinery, s.29 lifting (12-monthly test); OSH Code s.6, s.12 (silicosis notifiable), Ch. XII","DGFASLI foundry guidance; IS 2925/IS 15298 PPE; IS 3043 earthing of furnaces; Hazardous Waste Rules (spent foundry sand, slag classification)"],ka:["Karnataka Factories Rules 1969 Rule 129 schedules (foundry/lead/chrome/sand-blasting); KSPCB consent for cupola/induction furnaces (stack norms)"],tn:["TN Factories Rules 1950 Rule 95 schedules; TNPCB cupola/furnace emission norms (Coimbatore cluster guidelines)"],osha:["1910.1053 silica; 1910.94 ventilation; 1910.95 noise; 1910.132/133/136 PPE; 1910.179 overhead cranes; 1910.184 slings; General Duty Clause (molten metal)"],intl:["HSE UK foundry guidance (molten metal, cupolas, induction furnaces); EN ISO 11612; ASTM F955; ISO 45001; ILO foundries"]},checklist:"cl-foundry"},

{id:"psm",t:"Chemical Process Plant – Process Safety Management & Tank-Farm Operations",cat:"Chemical",tags:["Chemical","Process Safety","Storage Tanks"],purpose:"Prevent loss of containment, fire, explosion and toxic release in process plants and tank farms through disciplined management of process safety information, hazard analysis, operating procedures, integrity, change and emergency response.",scope:"Batch and continuous chemical plants, pharma bulk-drug units, petrochemical/refinery units, fertilizer, chlor-alkali, solvent recovery, tank farms, loading/unloading gantries, pipelines, flare/relief systems, utilities (nitrogen, steam, refrigeration).",roles:["Plant/unit head (process owner)","Process safety engineer","Operations shift in-charge & panel operators","Maintenance & inspection (mechanical integrity)","Instrumentation (SIS/alarms)","Safety/environment officer; ERT; District Crisis Group liaison (MAH)"],hazards:["Runaway reactions, overpressure, vacuum collapse, thermal expansion in blocked lines","Loss of containment at gaskets/seals/hoses; corrosion/erosion; brittle fracture","Static ignition during transfers; flammable atmospheres in dyke/pits; electrical non-Ex equipment","Toxic release (chlorine, ammonia, HF, phosgene, H2S); nitrogen asphyxiation in inerted vessels","Overfill of tanks; dyke failure; tank-truck roll-away; hose whip","Alarm floods, bypassed trips, undocumented changes"],pre:["Process Safety Information: P&IDs as-built, chemical hazards (SDS, reactivity matrix), design basis (MAWP, relief sizing, materials), safe operating limits & consequences of deviation","Process hazard analysis: HAZOP at design, every 5 years and on MoC; LOPA/SIL for safeguards (IEC 61511); bow-ties for MAH scenarios; action close-out tracked","Operating procedures for start-up, normal, shutdown, emergency, temporary; critical-parameter alarms with rationalisation (ISA 18.2)","Mechanical integrity: RBI programme (API 580/581), inspection of vessels/piping/relief valves/tanks (API 510/570/653/576), instrument proof testing per SIL, critical-equipment list","Emergency isolation valves, fire & gas detection, deluge/foam, flare/vent capacity, spill containment; on-site emergency plan rehearsed 6-monthly; MSIHC safety report/site notification current; PLI insurance","Trained operators with competency assessment; PSSR before start-up after turnaround/MoC"],steps:["Operate within safe operating envelope; log excursions; never bypass trips/interlocks without authorised, time-limited override with compensating measures.","Loading/unloading: verify product/tank, earth/bond before connection (interlocked), dead-man control, overfill protection (high-high level trip API 2350), wheel chocks/vehicle immobiliser, emergency stop, no mobile phones, TREM card/driver briefing.","Transfers: avoid splash filling; velocity limits; vent to safe location; nitrogen blanketing for flammables; check hoses (test/tag, 6-monthly) and quick-connect couplings.","Tank farm: daily walk-down of dykes (drain valves closed), tank level checks, cathodic protection readings, vents/flame arresters clean, dyke drainage through oil-water separator; hot work only with gas test and permit; vehicles with spark arresters.","Reactor safety: charge sequence verified, cooling and agitation interlocks, emergency quench/dump, relief to catch tank/scrubber; temperature/pressure trends watched for runaway indicators.","Inerting/nitrogen: confined-space rules for inerted vessels; O2 monitoring at vents; signage on N2 utility stations; never use N2 for breathing-air or cooling persons.","Maintenance: PTW with process isolation (double block & bleed/blind), depressurise, drain, purge, gas-test; pyrophoric scale kept wet; line-breaking PPE.","Management of change for any process, equipment, chemical, control or organisational change; PSSR before restart; update PSI and training.","Metrics: API RP 754 Tier 1–4 indicators (LOPCs, safeguard demands, overdue inspections, overrides); review monthly; near-miss reporting.","Audits: PSM audit every 3 years (OSHA model) / MSIHC Rule 12 annual safety audit; HAZOP revalidation; emergency drill with District Crisis Group annually."],ppe:["FR coveralls (anti-static in Zone 1), chemical gloves per SDS, goggles/face shield, safety boots (conductive where required), escape respirator/SCBA at toxic units, gas detector"],stop:["Trip/interlock bypassed without authorisation","Gas detection alarm or flammable reading at transfer point","Overfill alarm or level instrument faulty","Earth/bond not verified before loading","Relief device isolated or overdue"],records:["PSI set, PHA reports & actions, SOPs, MoC register, PSSR, inspection/RBI records, relief valve register, SIS proof-test records, alarm management reports, training/competency, drill reports, safety report & on-site plan, API 754 metrics"],refs:{india:["Factories Act Ch. IVA; IS 11457 Pt 1; IS 17859; IS 4209","MSIHC Rules 1989 (Rules 4–18: site notification, safety report, safety audit, on-site plan, MSDS); Chemical Accidents (EPPR) Rules 1996; PLI Act 1991; OSH Code Ch. XII; Factories Act Ch. IVA via rules","OISD-STD-105 (permits), 118 (layouts), 163 (PSM), 116/117 (fire), 244 (terminals), 129 (tank inspection); IS 15656 (HAZOP), IS 7689 (static), IS/IEC 60079, IS 803 (tanks), IS 2825 (vessels), SMPV(U) 2016, Petroleum Rules 2002; Boilers Act 2025; PNGRB T4S for pipelines"],ka:["Major Accident Hazards Control (Karnataka) Rules 1994; KA Rules 88-A–88-P","DFBISH MAH registry & safety-report approval; Karnataka Factories (Safety Audit) Rules 2024; KSPCB consent & HW authorisation; KSDMA district off-site plans"],tn:["TN CIMAH Rules 1994; TN Rules 61-F–61-T","DISH TN MAH units (Manali/Ennore/Cuddalore clusters) – safety report, mock drills with District Crisis Group; TNPCB; TN Factories Rules Rule 61 (pressure plant)"],osha:["1910.119 PSM (14 elements); 1910.106 flammable liquids; 1910.1200; 1910.120 HAZWOPER; 1910.146; NFPA 30, 77, 69, 70; API RP 754, 2350, 2003 (static), 2015/2016; CCPS RBPS"],intl:["Seveso III / COMAH 2015; IEC 61511; IEC 61882 (HAZOP); ISO 45001; ILO C174; EI Model Code of Safe Practice (Part 19 fire precautions at terminals)"]},checklist:"cl-psm"},

{id:"tanks",t:"Storage Tanks (Above-Ground & Underground): Installation, Inspection, Leak Detection & Decommissioning",cat:"Chemical",tags:["Chemical","Storage Tanks","Construction"],purpose:"Prevent leaks to soil and groundwater, tank failure, overfill and fire at petroleum/chemical storage tanks and site fuel installations (UST/AST), and manage their safe installation and closure.",scope:"Site diesel tanks (above-ground skid/bunded), retail-outlet style USTs, bulk Class A/B/C petroleum tanks, chemical storage tanks (acids, solvents), water-treatment chemical tanks; installation, commissioning, operation, inspection, repair and decommissioning.",roles:["Tank owner/operator","Installation contractor (PESO-approved fabricator for petroleum)","Competent person / inspector (API 653 / IS 803)","Cathodic-protection technician","Safety officer; environment officer"],hazards:["Undetected UST leak contaminating groundwater (soil/aquifer liability, SPCB directions)","Overfill, vent blockage (over/under-pressure), vapour accumulation in low points","Tank floor/shell corrosion; weld failure; settlement; dyke breach","Fire during installation hot work; confined-space entry during cleaning; excavation collapse at UST pits","Static during filling; incompatible chemical in wrong tank"],pre:["Design/standards: IS 803 or API 650 (vertical AST), IS 10987 (horizontal UST/AST), double-wall or lined tanks with interstitial monitoring for new USTs; venting (API 2000) and flame arrester; overfill protection (high-level alarm + automatic shut-off at 95% / API 2350)","Licensing: PESO licence for petroleum above thresholds (Class B > 2,500 L; Class A > 30 L), approved drawings/site plan, safety distances; SPCB consent where applicable; fire NOC","Dyke/bund: capacity ≥ largest tank (110% practice), impervious, drain valve normally closed, no vegetation/stored material","Corrosion protection: coating + cathodic protection for buried steel; CP potential readings quarterly; tank-pit backfill clean sand; anchoring against flotation in high water table","Leak detection: automatic tank gauging/statistical inventory reconciliation, interstitial sensors, monitoring wells; precision tightness test at installation and periodically (annual for single-wall USTs without continuous monitoring); dispensing lines pressure tested","Site diesel: bunded tank on hard-stand, spill kit, extinguishers (2 × 9 kg DCP), earthing, lockable fill point, no refuelling of running engines"],steps:["Installation: excavation per excavation procedure (shoring, utility clearance); tank inspected on arrival (coating, test certificate); handled with proper lifting lugs/slings; set on bedding, anchor straps; backfill in lifts; pipework with secondary containment/sumps; hydrostatic/pneumatic test per code (pneumatic only with written procedure and exclusion); CP installed and commissioned.","Commissioning: calibration/dip chart, high-level alarm test, vents checked, emergency shut-off, earthing/bonding verified, labelling (product, capacity, UN hazard), PESO/fire inspection before first fill.","Operation: dip/gauge daily; inventory reconciliation (unexplained loss > 0.5% of throughput → investigate); keep fill-point area clear; bonding of tankers; no overfilling (max 95%); water bottom draw-off; record.","Inspection: AST external visual monthly; API 653/IS 803 external by competent person every 5 years; internal per corrosion rate (max 10–20 years); UST interstitial alarms tested monthly, tightness test per schedule, CP readings quarterly, monitoring wells sampled.","Repairs: hot work only after emptying, cleaning and gas-freeing (see tank cleaning procedure); PESO/competent-person approval for repairs to licensed tanks; re-test after repair.","Spill/leak response: stop transfer, isolate, contain in dyke/absorbents, no ignition, notify SPCB (forthwith), recover product, assess soil/groundwater, remediation plan.","Decommissioning: empty and clean; gas-free certificate; disconnect lines; either remove (lift, transport as hazardous waste if sludge), or fill in place with inert material (sand/foam concrete) only where permitted; soil and groundwater sampling; PESO licence surrender; record location on site plan.","Chemical tanks: materials compatibility (HDPE/FRP/lined), level and temperature monitoring, scrubbers for fuming acids, segregated bunds, eyewash/shower within 10 s."],ppe:["Standard; chemical PPE per SDS for chemical tanks; harness for tank-top work; gas detector"],stop:["Unexplained inventory loss","High-level alarm inoperative","Dyke drain valve found open / bund compromised","Vent blocked or flame arrester missing","Expired PESO licence or failed CP"],records:["Design/test certificates, PESO licence & drawings, inventory reconciliation log, tightness/CP/inspection reports, alarm tests, spill reports, decommissioning records and sampling results"],refs:{india:["IS 11457 Pt 1 (fire safety of petroleum/chemical plants)","Petroleum Rules 2002 (licensing, underground/above-ground tanks, safety distances); PESO approved tank fabricators; Petroleum Act 1934","IS 803, IS 10987, IS 2825; OISD-STD-129, 118, 244, 117, 116; CPCB vapour recovery guidelines (Stage I/II) for retail outlets; HOWM Rules (tank bottom sludge – Schedule I waste); EP Act s.9 (spill reporting); Water Act (groundwater)","MSIHC Rules where thresholds exceeded; Fire NOC (KSFES/TNFRS)"],ka:["PESO Sub-circle Mangaluru/Bengaluru","KSPCB consent/HW authorisation; KSFES NOC; Karnataka Ground Water Act (contamination); DFBISH (factory tanks)"],tn:["PESO Southern Circle Chennai","TNPCB; TNFRS; DISH TN; Chennai Metropolitan Area Groundwater Act (contamination/extraction)"],osha:["40 CFR Part 280 (EPA UST rules: leak detection, corrosion protection, closure); 1910.106; 1926.152/153 (construction site fuel); NFPA 30; API 650/653/2000/2350/1615/1604; PEI RP100"],intl:["UK Blue Book (APEA/EI); EU Groundwater Directive; EI Model Code Part 19; ISO 14001 (aspects)"]},checklist:"cl-tanks"},

{id:"tankclean",t:"Storage Tank Cleaning, Gas-Freeing, Sludge Handling & Entry",cat:"Chemical",tags:["Chemical","Storage Tanks","Industrial"],purpose:"Safely take a tank out of service, remove product and sludge, make the atmosphere safe, allow entry/hot work and return it to service without fire, toxic exposure or asphyxiation.",scope:"Petroleum, solvent, chemical and oily-water tanks; drums and ISO containers by analogy; includes benzene/H2S/lead (leaded sludge) hazards and pyrophoric deposits.",roles:["Tank cleaning supervisor (entry supervisor)","Gas tester (competent)","Entrants and attendants","Hazardous-waste contractor (authorised)","Safety officer; ERT on standby"],hazards:["Flammable vapour (LEL), benzene (carcinogen), H2S from sour sludge, lead from leaded gasoline tanks, O2 deficiency after inerting/steam","Pyrophoric iron sulphide igniting on drying; static from steam/water jetting; sludge engulfment","Falls through roof plates/pontoons; heat stress inside tank; hydro-blasting injection injuries"],pre:["Isolate tank: blind all lines (blind register), lock valves, electrical isolation of mixers/heaters, cathodic protection off where required","Product removal and water flushing; sludge quantity estimated; disposal route (TSDF/co-processing, manifest) agreed; oily-water to ETP","Gas-freeing plan: ventilation (eductors/fans, explosion-proof), steaming for heavy residues (temperature/static controls), inerting for pyrophoric risk; gas-free certificate target: LEL 0%, benzene < 0.5 ppm (ACGIH TLV; 1 ppm OSHA PEL), H2S < 10 ppm, O2 19.5–23.5%","Confined-space permit and hot-work permit (separate); rescue plan with tripod/winch at manway; respiratory protection plan (airline/SCBA until gas-free; organic-vapour respirator only when confirmed below limits)","Pyrophoric deposits: keep wet; remove and dispose under water/immediately"],steps:["Issue isolation certificate; verify every blind by number; drain and depressurise; open manways only after initial atmosphere test from outside.","Ventilate continuously; test atmosphere at multiple levels (bottom first for heavy vapours); record readings and time; retest every 2 h and after breaks.","Remove free liquid by pump (Ex-rated) through manway; sludge by vacuum truck or manual (mechanical preferred); keep sludge wet; lead-contaminated sludge handled with full PPE and medical surveillance (blood lead).","Entry under permit: attendant at manway, entrant log, communication, lighting Ex-rated, no cylinders inside; hydro-blasting with pressure-rated hoses, dump valves, exclusion, face shields; no high-pressure water near persons.","Hot work inside only after gas-free certificate and continuous monitoring at 0% LEL; fire watch; remove all residues within 11 m; check adjacent tanks and dyke for vapour.","Inspection by competent person once clean (API 653 / IS 803); repairs; close-out.","Return to service: remove all tools/blinds in sequence (blind register reconciled), reinstate vents/flame arresters/alarms, leak test, purge with product vapour or inert as required, update records.","Waste: tank bottom sludge is hazardous waste (HOWM Schedule I) – manifest Form 10 to authorised facility; contaminated PPE/absorbents likewise."],ppe:["Chemical-resistant coveralls (Tychem class per product), nitrile/viton gloves, chemical boots, airline or SCBA until gas-free, then OV respirator per test; harness with retrieval line; face shield for jetting"],stop:["LEL > 0% for hot work or > 10% for entry","Benzene/H2S above limits without supplied air","Blind missing/unverified","Attendant absent; retrieval not rigged","Sludge drying out (pyrophoric) or smoke/odour change"],records:["Isolation & blind register, gas-free certificates, entry/hot-work permits, waste manifests, inspection report, medical surveillance (benzene/lead), return-to-service checklist"],refs:{india:["Factories Act s.36 (dangerous fumes – certificate of safety) via state rules; OSH Code s.6; OISD-STD-105; HOWM Rules 2016 (sludge); Petroleum Rules 2002 Rule on repairs/hot work in licensed premises; Sch. II PELs (benzene, lead – check current Indian limits)"],ka:["Karnataka Factories Rules 1969 (confined space certificate, lead schedule); KSPCB authorisation for sludge disposal"],tn:["TN Factories Rules 1950 (certificate of safety; lead/benzene schedules); TNPCB"],osha:["1910.146; 1926.1200; 1910.1028 benzene; 1910.1025 lead; 1910.252; API 2015 (safe entry & cleaning of petroleum storage tanks), API 2016 (guidelines), API 2207 (hot tapping/tank repairs); NFPA 326 (safeguarding tanks and containers for entry, cleaning or repair)"],intl:["UK HSE L101 Safe work in confined spaces; EI guidance on tank cleaning; ILO"]},checklist:"cl-tankclean"},

{id:"tackles",t:"Lifting Tackles & Rigging Gear Control (Slings, Chains, Shackles, Hooks, Chain Blocks, Winches)",cat:"Lifting & Tools",tags:["Construction","Industrial","Lifting & Cranes","Tools & Tackles"],purpose:"Ensure every item of lifting gear is identified, certified, inspected, used within its working load limit and withdrawn when worn.",scope:"Wire-rope slings, chain slings, webbing/round slings, shackles, eyebolts, hooks, master links, spreader/lifting beams, plate clamps, chain blocks, lever hoists, winches, tirfors, pulley blocks, trolleys, pad eyes and anchorages; crane hooks by association.",roles:["Lifting gear controller (stores)","Competent person (thorough examination/test)","Riggers (pre-use checks)","Appointed person (lifting plans)"],hazards:["Overload from wrong sling angle/mode factor, shock loading, unrated attachments (rebar, eyebolts in wrong thread), damaged gear in use","Mixed/counterfeit gear without certificates; home-made spreader beams","Side loading of shackles/hooks; missing hook latches; chain block brake failure"],pre:["Lifting gear register: unique ID, type, WLL, manufacturer, certificate number, test/examination dates, status; gear store with quarantine area","Statutory thorough examination: at least every 12 months by competent person (Factories Act s.29 via state rules); 6-monthly for lifting accessories under BOCW rules (verify) and LOLER; test certificate after manufacture/repair","Quarterly colour code (tag/tape) applied only after inspection; chart displayed","Sling capacity tables (angle/mode factors) displayed; edge protectors, softeners available"],steps:["Issue only inspected, colour-coded, certified gear against the register; record user and return.","Pre-use check by rigger: label/ID legible, WLL marked, no cuts/broken wires/stretch/deformation/cracks, latch on hooks, shackle pin seated and moused where required, chain block brake and chain condition.","Select by load: weight (verified), centre of gravity, sling angle (keep included angle ≤ 90°; capacity falls to ~70% at 90° and ~50% at 120°), mode (choke/basket/vertical), edge protection, temperature (synthetic slings ≤ 90 °C), chemicals.","Rig correctly: shackles loaded in line (no side load > 45° without derating), hooks loaded at bowl not tip, master link on crane hook, no knots/twists, tag lines; never use rebar, scaffold tubes, non-rated eyebolts, or forklift tines without rated attachment.","Chain blocks/lever hoists: suspend from rated beam clamp/anchor, check load chain lubrication and stop, do not extend lever, never use as a lashing with load swinging.","Winches/tirfors: anchor rated, rope condition, safety shear pins (tirfor), nobody in line of rope under tension (rope-whip zone).","After use: inspect, clean, return to store; damaged gear tagged 'DO NOT USE', quarantined and destroyed (cut) so it cannot be reused.","Thorough examination schedule tracked; certificates filed; register reconciled monthly; audit the store quarterly.","Wire rope discard per ISO 4309 (broken wires, diameter loss > 7–10%, kinks, corrosion, birdcage, heat damage); chains per EN 818-6 (stretch > 5%, wear > 10%); textile slings on any cut, label loss or chemical/heat damage; hooks on throat opening > 15% or twist > 10°."],ppe:["Gloves (cut-resistant), helmet, boots, eye protection"],stop:["Gear without ID/certificate or colour code","Damaged gear found in use","WLL unknown or exceeded","Homemade/unrated attachment"],records:["Lifting gear register, test & thorough-examination certificates (prescribed forms under state rules), quarterly inspection, issue/return log, quarantine/destruction log"],refs:{india:["IS 2762 wire-rope slings","Factories Act s.29 via state rules (12-monthly examination; register); BOCW Central Rules 1998 & KA/TN BOCW Rules (lifting gear test/examination – 6-monthly verify); IS 2266, IS 6216, IS 3832, IS 13367; OSH Code s.6"],ka:["KA Rules 58/59 Forms 6/7","Karnataka Factories Rules 1969 lifting tackles register/forms; Karnataka BOCW Rules"],tn:["TN Rules 55/55A Forms 8/9","TN Factories Rules 1950 Rule 55A forms; TN BOCW Rules"],osha:["1926.251 rigging equipment for material handling; 1910.184 slings; ASME B30.9 (slings), B30.10 (hooks), B30.20 (below-the-hook), B30.26 (rigging hardware), B30.16/21 (hoists)"],intl:["UK LOLER 1998 (6-monthly accessories), BS EN 13155, EN 13889, EN 1677, EN 818, EN 1492, ISO 4309; BS 7121"]},checklist:"cl-tackles"},

{id:"tools",t:"Hand & Power Tools (incl. Abrasive Wheels, Pneumatic & Powder-Actuated Tools)",cat:"Lifting & Tools",tags:["Construction","Industrial","Tools & Tackles"],purpose:"Prevent cuts, eye injuries, electrocution, disc bursts, kickback, hand-arm vibration and dust/noise harm from tools.",scope:"Hand tools (hammers, chisels, spanners, knives), electric tools (drills, grinders, saws, breakers), pneumatic tools, hydraulic tools, powder-actuated (cartridge) tools, battery tools, bench grinders, chop saws.",roles:["Tool store controller","Supervisors","Trained users (abrasive-wheel mounting, powder-actuated licence)","Electrician (PAT)"],hazards:["Angle-grinder disc burst (wrong RPM/size, damaged disc), kickback, cutting with grinding disc, guard removed","Electric shock (damaged cable/plug, wet), no RCD","Eye injuries from chips/sparks; hand injuries; HAV; noise; silica dust from cutting","Pneumatic: hose whip, compressed-air injection; powder-actuated: ricochet/through-penetration"],pre:["Tool register with inspection colour-code (quarterly) and PAT (3-monthly site / annual workshop); defective tools quarantined","Right tool for the task; manufacturer manuals available; abrasive wheels stored dry, flat, and mounted only by trained persons after ring test; wheel RPM ≥ tool RPM","Guards fitted and working (grinder guard covers ≥ 180°, saw retractable guard); side handles; dead-man triggers; anti-restart on bench tools","RCD (30 mA) on all electric tools; 110 V CTE or double-insulated; cables elevated; no taped joints","Vibration data per tool; trigger-time limits; job rotation; anti-vibration handles"],steps:["Pre-use check by user: body, cable/plug, guard, switch, disc/blade condition and rating, hose couplings and whip-checks, battery/charger condition; tag out if defective.","Set up: secure workpiece (clamp/vice), stable footing, exclusion for sparks/chips, fire precautions and hot-work permit where sparks near combustibles, dust control (water or LEV) for concrete/stone.","Operate within design: correct disc (cutting vs grinding), no overreach, two hands, let tool reach full speed before contact, do not force; keep cords away from cutting path; allow disc to stop before putting down.","Pneumatic: ≤ 30 psi (2 bar) for cleaning with chip guards, never towards people or clothing; whip-checks at every coupling; isolate and bleed before changing bits.","Powder-actuated: licensed operator only; sequential-action tool; check substrate (no through-penetration), no use near flammables, cartridges stored locked, misfire wait 30 s then unload.","Hand tools: chisels dressed (no mushrooming), handles tight, knives retractable, insulated tools for electrical work, non-sparking in flammable areas, carry in holsters not pockets.","Bench grinders: work-rest ≤ 3 mm gap, tongue guard ≤ 6 mm, eye shield; ring-test wheels; dress regularly.","Battery tools: charge on non-combustible surface, use manufacturer charger, do not charge damaged packs, store cool; Li-ion fire response (water in quantity, do not reuse).","Record inspections; retrain on incidents; report near-misses (disc bursts, kickbacks)."],ppe:["Safety glasses + face shield for grinding/cutting, gloves (not near rotating parts where entanglement), hearing protection, FFP2/P3 for dust, anti-vibration gloves (limited), safety boots"],stop:["Guard missing/modified","Disc damaged, wrong size/RPM or cutting disc used for grinding","No RCD / damaged cable","Unlicensed powder-actuated tool use","Dry cutting of concrete without dust control"],records:["Tool register, inspection colour-code log, PAT records, abrasive-wheel mounting training, powder-actuated licences, vibration exposure log"],refs:{india:["IS 1991 Pts 1–10 abrasive grinding wheels; IS 16819","Factories Act s.21–s.33 via state rules (grinding wheels, guarding); BOCW Central/state rules (tools, electrical); CEA Safety Regs (portable apparatus); IS 732; IS/IEC 62841; IS 9474","Sch. II PELs (silica) for cutting; OSH Code s.6"],ka:["KA Rule 56 schedules","Karnataka Factories Rules 1969; Karnataka BOCW Rules"],tn:["TN Rule 53 schedules","TN Factories Rules 1950; TN BOCW Rules"],osha:["1926 Subpart I (1926.300–307: guarding, abrasive wheels 1926.303, pneumatic 1926.302(b), powder-actuated 1926.302(e)); 1910.242–244; 1926.1153 silica; ANSI B7.1; ANSI A10.3"],intl:["UK PUWER 1998; HSG17 Safety in the use of abrasive wheels; Control of Vibration at Work Regs 2005; EN 62841; ILO CoP Construction"]},checklist:"cl-tools"},

{id:"towercrane",t:"Tower Cranes & Overhead (EOT) Cranes – Erection, Operation, Inspection, Dismantling",cat:"Lifting & Tools",tags:["Construction","Industrial","Lifting & Cranes"],purpose:"Prevent tower-crane collapse, overturning, load drops, collisions and crush injuries, and EOT crane failures in factories.",scope:"Self-erecting, hammerhead, luffing and internal-climbing tower cranes; EOT/gantry cranes in workshops and warehouses; monorails and jib cranes by analogy.",roles:["Appointed person / lifting supervisor","Tower-crane erection/dismantling supervisor (manufacturer-trained)","Crane operator (certified) and slingers/signallers","Structural/temporary works engineer (foundation, ties)","Competent person (test & examination)","Maintenance (EOT)"],hazards:["Foundation/tie failure, overload, out-of-service wind, erection/climbing errors, mast bolt failure, slew-ring failure","Collision between cranes/jibs and with structures; loads over public roads","Falls during erection/maintenance; crush between counter-jib and structure","EOT: limit-switch failure (two-blocking), brake failure, rail misalignment, pendant/remote faults, persons on walkways"],pre:["Tower crane: foundation and tie design by manufacturer/engineer with ground investigation; erection method statement; wind data and manufacturer limits (in-service typically 9–10 m/s at hook; out-of-service free-slew with jib unloaded); lightning protection; anti-collision/zone-limiting on multi-crane sites; load-moment indicator, limit switches, anemometer, slew/trolley limits","Test & thorough examination by competent person after each erection/climb and every 12 months (state rules) — certificate in cab; daily operator checks; weekly/monthly inspection schedule (bolts torque, ties, slew ring, ropes, brakes)","Operator certification/medical (vision, no vertigo), rescue-from-cab plan, cab access ladders with rest platforms/fall arrest; communication (radio) with signallers","EOT: IS 3177/IS 807 design; limit switches (upper hoist, cross/long travel), brakes, overload device, rail stops, warning horn, isolator, inspection access, 125% load test after major repair, 12-monthly examination","Public interface: loads not over public roads/occupied areas unless engineered exclusion and permission; night lighting/aviation warning if near airports (AAI NOC for height)"],steps:["Erect/climb/dismantle only with manufacturer-trained crew under supervisor; exclusion zone; weather within limits; sequence per manual (no shortcuts); torque bolts to spec; independent check before load test.","Daily pre-use: structure/ties visual, ropes, hook latch, LMI/limits functional test, anemometer, brakes; log; stop if any defect.","Operate within load chart (radius); trial lift; no side pull/dragging; loads with tag lines; banksman/signaller for blind lifts; slow slewing near structures.","Multi-crane sites: priority rules, anti-collision set and verified, communication protocol; no jib overlap without zoning.","Weather: stop lifting at manufacturer wind limit (≈ 9–10 m/s; lower for large-surface loads); lightning – stop and leave cab; cyclone/storm warning – put crane out of service (jib free-slew, hook up, trolley in, power off) per manual; after storm – inspection before use.","Night/idle: hook raised, no load left suspended, power isolated, access locked; no unauthorised climbing.","Maintenance at height under WAH rules (harness to designated anchors), isolation of slew/hoist; replacement of ropes/limit switches by trained persons; re-test after repair.","EOT operations: authorised operators only; pre-use checks; sound horn before travel; no riding on hook/load; never leave load suspended; keep persons clear of load path; stack loads stable; lockout for maintenance on crane rails with rail stops; two-crane tandem lifts only under lift plan.","Inspection records and certificates filed; competent person examination every 12 months; operator refresher every 2–3 years."],ppe:["Helmet with chin strap, harness for erection/maintenance, gloves, boots, hi-vis; radios"],stop:["Wind above limit or lightning","LMI/limit switch or anemometer faulty","Tie/bolt looseness, unusual noise or movement","Certificate expired after erection/climb","Load path over persons/public without control"],records:["Erection method statement, foundation/tie design, competent-person test certificates, daily/weekly/monthly inspections, operator certificates, lift plans, anti-collision settings, storm shutdown records, EOT inspection & load test"],refs:{india:["Factories Act s.29 via state rules (12-monthly test & examination; register); BOCW Central Rules 1998 & KA/TN BOCW Rules (lifting appliances – test after erection, certificate, operator); IS 13367 Pt 1, IS 4573, IS 3177, IS 807; AAI height NOC; CEA clearances","OSH Code s.6, s.11 (crane collapse = dangerous occurrence, 12 h notice)"],ka:["KA Rules 58/59 Forms 6/7 (annual certification)","Karnataka BOCW Rules 2006; Karnataka Factories Rules 1969; BBMP conditions for cranes over roads"],tn:["TN Rules 55/55A Forms 8/9; TN BOCW Rules 2006 (tower cranes)","TN BOCW Rules 2006; TN Factories Rules 1950 Rule 55A; CMDA/GCC conditions"],osha:["1926 Subpart CC: 1926.1435 tower cranes (erection/climbing/dismantling, inspections), 1926.1412 inspections, 1926.1427 operator certification, 1926.1408 power lines, 1926.1417 operation; 1910.179 overhead & gantry cranes; ASME B30.3, B30.2"],intl:["BS 7121-5 (tower cranes), BS 7121-1; BS EN 14439; UK CPA tower crane guidance; LOLER; ILO CoP Construction"]},checklist:"cl-towercrane"},

{id:"forklift",t:"Forklifts, Powered Industrial Trucks, Warehousing & Racking",cat:"Lifting & Tools",tags:["Industrial","Lifting & Cranes","Transport"],purpose:"Prevent tip-overs, pedestrian strikes, falling loads, racking collapse and charging-area incidents in warehouses, yards and factories.",scope:"Counterbalance (diesel/LPG/electric), reach trucks, pallet trucks, order pickers, telehandlers, tow tractors; pallet racking, cantilever racks, mezzanines, block stacking, loading docks.",roles:["Warehouse manager","Forklift operators (trained, authorised)","Racking inspector (PRRS/competent)","Maintenance; battery-room attendant"],hazards:["Tip-over (speed, turns with raised load, slopes, overload, uneven ground), operator ejection without seat belt","Pedestrians struck in aisles/doorways/reversing; falling loads from high racks; racking impact damage and collapse","Battery charging: hydrogen explosion, acid burns; LPG cylinder changeover leaks; CO from engines indoors","Falls from forks/platforms; dock edge falls; trailer creep during loading"],pre:["Operator training with practical evaluation; authorisation card; refresher every 3 years and after incident; medical fitness; RTO licence if on public road","Truck: capacity plate (load centre 600 mm/24 in), attachment de-rating, daily pre-use checklist, horn, lights, reversing alarm/blue spot, seat belt, overhead guard, mast chains; maintenance records","Traffic plan: segregated pedestrian walkways, crossings, mirrors at blind corners, speed limits (≤ 8–10 km/h indoors), one-way aisles, no-go zones, lighting","Racking: designed and installed per supplier; SWL load notices per bay; column guards; floor flatness; inspections – weekly by staff, annual by expert (EN 15635/SEMA); damage classified green/amber/red; sprinkler clearance ≥ 450 mm","Charging/LPG: dedicated ventilated room (hydrogen < 1%), no ignition, eyewash, spill kit, insulated tools, PPE; LPG cylinders stored outdoors, changeover outdoors with gloves/goggles
