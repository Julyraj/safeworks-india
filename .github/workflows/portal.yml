name: SafeWorks Portal

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "data/**"
      - "index.html"
      - ".github/workflows/portal.yml"
  pull_request:
    paths:
      - "portal/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build the web pages, test the Python server
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: safeworks
          POSTGRES_PASSWORD: safeworks
          POSTGRES_DB: safeworks_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U safeworks" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portal/server/requirements*.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install server
        working-directory: portal/server
        run: pip install -r requirements-dev.txt
      - name: Workflow and permission tests (photos on disk)
        working-directory: portal/server
        run: python -m pytest tests -q
        env:
          TEST_DATABASE_URL: postgres://safeworks:safeworks@localhost:5432/safeworks_test
      - name: Workflow and permission tests (photos in the database)
        working-directory: portal/server
        run: python -m pytest tests -q
        env:
          TEST_DATABASE_URL: postgres://safeworks:safeworks@localhost:5432/safeworks_test
          STORAGE_DRIVER: db
      - name: Load test with demo users (short run)
        working-directory: portal/server
        env:
          DATABASE_URL: postgres://safeworks:safeworks@localhost:5432/safeworks_test
          FILE_SIGNING_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          STORAGE_DIR: ${{ runner.temp }}/storage
          RUN_JOBS: "false"
          SEED_ADMIN_PASSWORD: CiAdmin2026
          WEB_CONCURRENCY: "2"
        run: |
          psql postgres://safeworks:safeworks@localhost:5432/safeworks_test -c "drop schema public cascade; create schema public;"
          python scripts/seed.py --demo
          python -m safeworks > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/v1/health && break; sleep 1; done
          BASE_URL=http://localhost:8080 ADMIN_ID=ADMIN01 ADMIN_PASSWORD=CiAdmin2026 USERS=100 DURATION=60 REPORT=loadtest-report.json python scripts/loadtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadtest-report
          path: |
            portal/server/loadtest-report.json
            portal/server/server.log
          if-no-files-found: ignore

  docker:
    name: Docker image (as used by Render and docker compose)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: safeworks
          POSTGRES_PASSWORD: safeworks
          POSTGRES_DB: safeworks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U safeworks" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f portal/Dockerfile -t safeworks-portal .
      - name: Start like Render does (seed + demo data, photos in the database) and sign in
        run: |
          docker run -d --name sw --network host \
            -e DATABASE_URL=postgres://safeworks:safeworks@localhost:5432/safeworks \
            -e FILE_SIGNING_SECRET=ci-only-secret-0123456789abcdef0123456789abcdef \
            -e STORAGE_DRIVER=db -e SEED_ON_START=true -e SEED_DEMO=true \
            -e SEED_ADMIN_PASSWORD=CiAdmin2026 -e WEB_CONCURRENCY=1 safeworks-portal
          for i in $(seq 1 90); do curl -sf http://localhost:8080/api/v1/health && break; sleep 2; done
          curl -sf http://localhost:8080/ | grep -q "<div id=\"root\">"
          curl -sf http://localhost:8080/admin/ > /dev/null
          curl -sf http://localhost:8080/library/ > /dev/null
          curl -sf -X POST http://localhost:8080/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"login":"SO-TN1","password":"CiAdmin2026","kind":"field"}' | grep -q '"token"'
          curl -sf http://localhost:8080/q/demo-token | grep -q "<div id=\"root\">"
          docker inspect --format '{{.State.Health.Status}}' sw
      - if: always()
        run: docker logs sw 2>&1 | tail -50

  install-arm:
    name: One-command install on an Arm server (like Oracle Cloud Always Free)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install with sample data (HTTPS on localhost)
        run: sudo bash portal/deploy/install.sh --domain localhost --demo --admin-password CiAdmin2026
      - name: Sign in over HTTPS; port 8080 stays private
        run: |
          curl -fsSk https://localhost/api/v1/health
          curl -fsSk https://localhost/ | grep -q '<div id="root">'
          curl -fsSk -X POST https://localhost/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"login":"SO-TN1","password":"CiAdmin2026","kind":"field"}' | grep -q '"token"'
          curl -fsSk -X POST https://localhost/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"login":"ADMIN01","password":"CiAdmin2026","kind":"admin"}' | grep -q '"token"'
          ss -ltn | grep -q '127.0.0.1:8080'
          ! ss -ltn | grep -q '0.0.0.0:8080'
      - name: Backup and restore
        run: |
          sudo bash portal/deploy/backup.sh
          D=$(sudo sh -c 'ls /var/backups/safeworks/db-*.dump | tail -1')
          P=$(sudo sh -c 'ls /var/backups/safeworks/photos-*.tar.gz | tail -1')
          sudo env RESTORE_YES=1 bash portal/deploy/restore.sh "$D" "$P"
          for i in $(seq 1 30); do curl -fsSk https://localhost/api/v1/health && break; sleep 2; done
          curl -fsSk -X POST https://localhost/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"login":"OWN-TN1-1","password":"CiAdmin2026","kind":"field"}' | grep -q '"token"'
      - name: Run the installer again (update) – settings and data are kept
        run: |
          sudo bash portal/deploy/install.sh
          curl -fsSk -X POST https://localhost/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"login":"ADMIN01","password":"CiAdmin2026","kind":"admin"}' | grep -q '"token"'
          test -f /etc/cron.d/safeworks-backup
      - if: failure()
        working-directory: portal
        run: sudo docker compose logs --tail 80

  android:
    name: Android app (APK)
    needs: [test, docker]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build web app
        working-directory: portal
        run: |
          npm ci
          npm run build -w web
      - name: Sync Capacitor
        working-directory: portal/mobile
        run: |
          npm ci || npm install
          npx cap sync android
      - name: Build APK
        working-directory: portal/mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 2.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q || { echo "::error title=Gradle build failed::See the log above"; exit 1; }
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SafeWorks-Portal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SafeWorks-Portal-apk
          path: SafeWorks-Portal.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "portal-v2.0.${{ github.run_number }}" SafeWorks-Portal.apk \
            --title "SafeWorks Portal app 2.0.${{ github.run_number }}" \
            --notes "Android app for SafeWorks Portal 2.0: report a hazard in 30 seconds (offline too), triage, actions with verified closure, inspections, in English, Hindi, Tamil and Kannada. On first launch, enter your company's SafeWorks server address (HTTPS) and sign in with your employee code or an enrolment code." \
            --latest=false
