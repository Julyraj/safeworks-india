# Run SafeWorks Portal with its own PostgreSQL on any server (cloud VM in India or a company server).
#
# Easiest: on a fresh Ubuntu server run   sudo bash portal/deploy/install.sh   (adds HTTPS, backups and the first login).
# By hand:
#   cd portal && cp .env.example .env   # then edit the values
#   docker compose up -d --build
#   docker compose exec app python scripts/seed.py  # first time: master lists, company, 5 pilot sites, first admin login
#   Put HTTPS in front of port 8080 (e.g. deploy/docker-compose.https.yml, Nginx or the cloud load balancer) before anyone signs in.

name: safeworks

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: safeworks
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: safeworks
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-256MB}"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeworks"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: portal/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://safeworks:${DB_PASSWORD}@db:5432/safeworks
      FILE_SIGNING_SECRET: ${FILE_SIGNING_SECRET:?Set FILE_SIGNING_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,capacitor://localhost}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-SafeWorks <no-reply@safeworks.local>}
      SEED_COMPANY: ${SEED_COMPANY:-Your Company}
      SEED_ADMIN_ID: ${SEED_ADMIN_ID:-ADMIN01}
      # API worker processes; 2 suits a 2-vCPU server (each keeps up to DB_POOL_MAX database connections)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
    ports:
      # APP_BIND=127.0.0.1 keeps port 8080 private when HTTPS (Caddy) sits in front
      - "${APP_BIND:-0.0.0.0}:8080:8080"
    volumes:
      - storage:/data/storage

volumes:
  pgdata:
  storage:
